<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0b10">
<title>Radiux – Magdeburg entdecken</title>
<style>
  :root{
    --bg:#0a0b10; --bg-2:#0f1118;
    --surface:#161926; --surface-2:#1e2231; --surface-3:#272c3d;
    --line:#2c3243; --line-soft:#232838;
    --text:#f5f7fc; --text-dim:#a6b0c6; --text-mute:#7c8699;
    --brand-1:#7c5cff; --brand-2:#22d3ee;
    --pos:#3ddc97; --neg:#ff6b81; --warn:#ffc44d;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
    --shadow:0 18px 50px -12px rgba(0,0,0,.75);
    --glow:0 0 0 1px rgba(255,255,255,.05), 0 20px 60px -20px rgba(124,92,255,.45);
    --card-h:clamp(360px,50vh,470px);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#f7f8fc; --bg-2:#eef0f7;
      --surface:#ffffff; --surface-2:#f2f4fa; --surface-3:#e6e9f3;
      --line:#d8dced; --line-soft:#e6e9f3;
      --text:#101322; --text-dim:#4a5468; --text-mute:#6b7488;
      --brand-1:#6338f0; --brand-2:#0891b2;
      --pos:#0f9d63; --neg:#d92543; --warn:#a86a00;
      --shadow:0 18px 44px -16px rgba(16,19,34,.28);
      --glow:0 0 0 1px rgba(16,19,34,.06), 0 20px 50px -22px rgba(99,56,240,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    font-size:16.5px; line-height:1.55; letter-spacing:-.01em;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(70% 45% at 12% -8%, color-mix(in srgb, var(--brand-1) 26%, transparent), transparent 70%),
      radial-gradient(60% 40% at 92% 4%, color-mix(in srgb, var(--brand-2) 20%, transparent), transparent 70%),
      linear-gradient(180deg, var(--bg-2), var(--bg) 45%);
  }
  .wrap{max-width:580px;margin:0 auto;padding:0 18px}
  main.wrap{padding-bottom:30px}
  h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.025em}
  h1{font-size:1.7rem;font-weight:800}
  h2{font-size:1.22rem;font-weight:700}
  h3{font-size:1.02rem;font-weight:700}
  p{margin:0 0 .9em}
  a{color:var(--brand-2)}
  button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2.5px solid var(--brand-2);outline-offset:3px;border-radius:10px}
  .skip{position:absolute;left:-9999px;top:0;background:var(--brand-1);color:#fff;padding:12px 18px;z-index:99;border-radius:0 0 12px 0;font-weight:700}
  .skip:focus{left:0;top:0}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- Kopfbereich ---------- */
  header.app{position:sticky;top:0;z-index:30;
    background:color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid var(--line-soft)}
  .bar{display:flex;align-items:center;gap:10px;padding:13px 0 11px}
  .brand{font-weight:850;font-size:1.32rem;letter-spacing:-.045em;margin-right:auto;
    background:linear-gradient(100deg,var(--brand-1),var(--brand-2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-size:.68rem;font-weight:700;letter-spacing:.02em;
    background:color-mix(in srgb, var(--brand-1) 16%, transparent);
    color:var(--brand-2); padding:5px 11px;border-radius:99px;
    border:1px solid color-mix(in srgb, var(--brand-1) 32%, transparent);white-space:nowrap}

  .controls{padding:4px 18px 14px;border-bottom:1px solid var(--line-soft)}
  .rng{display:flex;align-items:center;gap:12px;width:100%;margin:4px 0 12px}
  .rng label{flex:0 0 auto;font-size:.85rem;font-weight:650;color:var(--text-dim)}
  input[type=range]{flex:1;min-width:100px;height:34px;appearance:none;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;
    background:linear-gradient(90deg,var(--brand-1),var(--brand-2))}
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;
    background:linear-gradient(90deg,var(--brand-1),var(--brand-2))}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:22px;height:22px;margin-top:-8px;
    border-radius:50%;background:#fff;border:2.5px solid var(--brand-1);
    box-shadow:0 3px 10px rgba(0,0,0,.45)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;
    border:2.5px solid var(--brand-1);box-shadow:0 3px 10px rgba(0,0,0,.45)}
  .radval{font-variant-numeric:tabular-nums;font-weight:800;font-size:1rem;
    min-width:66px;text-align:right;flex:0 0 auto;
    background:linear-gradient(100deg,var(--brand-1),var(--brand-2));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 5px;
    scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);
    border-radius:99px;padding:9px 15px;cursor:pointer;min-height:40px;
    font-size:.85rem;font-weight:700;color:var(--text-dim);
    transition:transform .18s var(--ease),background .18s,color .18s,border-color .18s}
  .chip:active{transform:scale(.94)}
  .chip[aria-pressed=true]{background:linear-gradient(100deg,var(--brand-1),var(--brand-2));
    color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--brand-1) 70%,transparent)}

  /* ---------- Schaltflächen ---------- */
  .btn{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
    padding:12px 16px;cursor:pointer;min-height:46px;font-weight:700;
    transition:transform .16s var(--ease),background .18s,border-color .18s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(100deg,var(--brand-1),var(--brand-2));color:#fff;border-color:transparent}
  .btn.sm{padding:8px 13px;min-height:40px;font-size:.82rem;border-radius:12px}
  .btn.ghost{background:transparent}
  .btn-row{display:flex;gap:8px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .btn-row::-webkit-scrollbar{display:none}
  .btn-row .btn{flex:0 0 auto;white-space:nowrap}

  /* ---------- Startauswahl ---------- */
  .hero{padding:26px 0 6px}
  .hero h1{font-size:2rem;margin-bottom:.3em}
  .hero .lead{color:var(--text-dim);font-size:1.02rem;margin-bottom:22px}
  .modes{display:grid;gap:12px}
  .mode{position:relative;overflow:hidden;border:1px solid var(--line);
    border-radius:var(--r-lg);padding:0;cursor:pointer;text-align:left;
    background:var(--surface);box-shadow:var(--shadow);
    transition:transform .2s var(--ease),border-color .2s}
  .mode:active{transform:scale(.98)}
  .mode .mi{display:flex;align-items:center;gap:14px;padding:16px 18px;position:relative;z-index:2}
  .mode .orb{width:46px;height:46px;border-radius:14px;flex:0 0 auto;
    box-shadow:0 8px 22px -8px rgba(0,0,0,.7)}
  .mode .mt{font-weight:800;font-size:1.06rem;display:block}
  .mode .ms{font-size:.85rem;color:var(--text-dim);display:block;margin-top:1px}
  .mode .arw{margin-left:auto;color:var(--text-mute);font-size:1.2rem}

  /* ---------- Entdeckungskarten ---------- */
  .deck{position:relative;height:var(--card-h);margin:16px 0 14px;perspective:1200px}
  .card{position:absolute;inset:0;border-radius:var(--r-xl);overflow:hidden;
    background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow);display:flex;flex-direction:column;
    touch-action:pan-y;user-select:none}
  .card.behind{transform:scale(.94) translateY(16px);opacity:.5;z-index:1;box-shadow:none}
  .card.front{z-index:2;animation:cardIn .38s var(--ease)}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .cover{position:relative;height:38%;min-height:120px;flex:0 0 auto;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 42%,color-mix(in srgb,var(--surface) 96%, transparent) 100%)}
  .cover .catbadge{position:absolute;top:13px;left:14px;z-index:2;
    font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    background:rgba(8,10,16,.62);color:#fff;padding:6px 11px;border-radius:99px;
    border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px)}
  .cover .fict{position:absolute;top:13px;right:14px;z-index:2;
    font-size:.6rem;font-weight:700;background:rgba(8,10,16,.5);color:rgba(255,255,255,.82);
    padding:5px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
  .cbody{padding:14px 20px 18px;display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto}
  .cbody h2{font-size:1.5rem;margin-bottom:6px}
  .desc{color:var(--text-dim);font-size:.92rem;margin-bottom:11px}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
  .pill{font-size:.76rem;font-weight:650;background:var(--surface-2);
    border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--text-dim)}
  .pill.open{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 45%,transparent);
    background:color-mix(in srgb,var(--pos) 12%,transparent)}
  .pill.closed{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 45%,transparent);
    background:color-mix(in srgb,var(--neg) 12%,transparent)}
  .pill.dist{color:var(--text);background:var(--surface-3)}
  .why{margin-top:auto;border-radius:var(--r-md);padding:13px 15px;
    background:color-mix(in srgb,var(--brand-1) 10%, var(--surface-2));
    border:1px solid color-mix(in srgb,var(--brand-1) 26%, transparent)}
  .why h3{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--brand-2);margin-bottom:7px;font-weight:800}
  .why ul{margin:0;padding-left:17px;font-size:.87rem;color:var(--text-dim)}
  .why li{margin-bottom:4px}
  .why li::marker{color:var(--brand-1)}
  .hint{font-size:.74rem;color:var(--text-mute);margin:10px 0 0;text-align:center}

  .stamp{position:absolute;top:26px;z-index:5;font-size:1.5rem;font-weight:900;
    letter-spacing:.06em;padding:9px 18px;border-radius:14px;opacity:0;
    border:3px solid currentColor;pointer-events:none;transition:opacity .12s}
  .stamp.yes{left:20px;color:var(--pos);transform:rotate(-13deg)}
  .stamp.no{right:20px;color:var(--neg);transform:rotate(13deg)}

  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
  .actions .btn{text-align:center;padding:14px 6px;font-size:.88rem;border-radius:var(--r-md)}
  .act-no{border-color:color-mix(in srgb,var(--neg) 50%,transparent);color:var(--neg);
    background:color-mix(in srgb,var(--neg) 10%,transparent)}
  .act-yes{border-color:color-mix(in srgb,var(--pos) 50%,transparent);color:var(--pos);
    background:color-mix(in srgb,var(--pos) 10%,transparent)}
  .counter{font-size:.78rem;color:var(--text-mute);text-align:center;margin:0 0 4px}

  /* ---------- Listen ---------- */
  .sechead{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
  .sechead h2{margin:0;font-size:1.05rem}
  .sechead .cnt{font-size:.78rem;color:var(--text-mute);margin-left:auto}
  .list{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:12px}
  .list > li{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
    overflow:hidden;box-shadow:0 8px 24px -18px rgba(0,0,0,.8)}
  .lrow{display:flex;gap:0}
  .lthumb{width:92px;flex:0 0 auto;position:relative;min-height:118px}
  .lthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .lmain{padding:13px 15px;flex:1;min-width:0}
  .lmain h3{margin-bottom:5px}
  .lact{display:flex;gap:8px;padding:0 15px 13px;flex-wrap:wrap}
  .list .why{margin:0 15px 13px}

  .empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:34px 20px;
    text-align:center;color:var(--text-dim);background:var(--surface)}

  /* ---------- Navigation ---------- */
  nav.tabs{position:sticky;bottom:0;z-index:30;
    background:color-mix(in srgb, var(--bg) 80%, transparent);
    backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    border-top:1px solid var(--line-soft);
    padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px 10px}
  nav.tabs button{background:none;border:0;padding:9px 4px 8px;min-height:52px;cursor:pointer;
    font-size:.7rem;font-weight:700;color:var(--text-mute);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:color .18s,background .18s}
  nav.tabs button svg{width:21px;height:21px;stroke-width:1.9}
  nav.tabs button[aria-current=page]{color:var(--text);
    background:color-mix(in srgb,var(--brand-1) 15%,transparent)}
  nav.tabs button[aria-current=page] svg{stroke:url(#navgrad)}

  /* ---------- Rechtstexte ---------- */
  .legal{font-size:.93rem}
  .legal h1{margin-top:.4em}
  .legal h2{margin-top:1.6em;padding-top:.2em}
  .legal h3{margin-top:1.2em;color:var(--text-dim);font-size:.95rem}
  .legal table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:.83rem;
    margin:0 0 1.2em;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
  .legal th,.legal td{padding:10px 11px;text-align:left;vertical-align:top;hyphens:auto;
    border-bottom:1px solid var(--line-soft)}
  .legal th{background:var(--surface-2);font-weight:750}
  .legal tr:last-child td{border-bottom:0}
  .legal ul{padding-left:19px}
  .legal li{margin-bottom:5px}
  .note,.todo{border-radius:var(--r-md);padding:14px 16px;margin:0 0 1.2em;font-size:.88rem;
    border:1px solid}
  .note{background:color-mix(in srgb,var(--brand-1) 11%,var(--surface));
    border-color:color-mix(in srgb,var(--brand-1) 32%,transparent)}
  .todo{background:color-mix(in srgb,var(--warn) 11%,var(--surface));
    border-color:color-mix(in srgb,var(--warn) 36%,transparent)}
  .wbar{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:56px}
  .wbar i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--brand-1),var(--brand-2))}
  footer.attrib{border-top:1px solid var(--line-soft);margin-top:24px;padding:16px 0 26px;
    font-size:.76rem;color:var(--text-mute)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);
    z-index:60;max-width:min(92vw,520px);text-align:center;
    background:var(--surface-3);border:1px solid var(--line);color:var(--text);
    padding:11px 18px;border-radius:99px;font-size:.85rem;font-weight:650;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:opacity .22s var(--ease),transform .22s var(--ease)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<a class="skip" href="#main">Zum Hauptinhalt springen</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="navgrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#22d3ee"/>
  </linearGradient>
</defs></svg>

<header class="app">
  <div class="wrap">
    <div class="bar">
      <div class="brand">Radiux</div>
      <span class="tag">Prototyp · Magdeburg</span>
    </div>
  </div>
  <div class="controls wrap" id="controls">
    <div class="rng">
      <label for="rad">Umkreis</label>
      <input type="range" id="rad" min="500" max="10000" step="500" value="3000" aria-describedby="radhelp">
      <output class="radval" id="radval" for="rad">3,0 km</output>
    </div>
    <p id="radhelp" class="sr">Legt fest, wie weit entfernt Orte höchstens sein dürfen. Mit den Pfeiltasten in 500-Meter-Schritten verstellbar.</p>
    <div class="chips" role="group" aria-label="Kategorien filtern" id="chips"></div>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <div aria-live="polite" class="sr" id="live"></div>
</main>

<div class="toast" id="toast" aria-hidden="true"></div>

<nav class="tabs" aria-label="Hauptnavigation">
  <div class="wrap">
    <button type="button" data-view="discover" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2.2 5.1-5.1 2.2 2.2-5.1z"/></svg>
      Entdecken</button>
    <button type="button" data-view="saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12a1 1 0 011 1v15l-7-4-7 4V5a1 1 0 011-1z"/></svg>
      Merkliste</button>
    <button type="button" data-view="how">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      Empfehlung</button>
    <button type="button" data-view="legal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a1 1 0 00-1 1v16a1 1 0 001 1h10a1 1 0 001-1V7z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></svg>
      Rechtliches</button>
  </div>
</nav>
<script>
/* Startbestand Magdeburg – bekannte Orte, dient als Grundlage, solange keine
   Live-Abfrage bei OpenStreetMap erfolgt ist.
   Quelle: OpenStreetMap-Mitwirkende, ODbL. Angaben ungeprüft. */
const FALLBACK_PLACES = [
  {n:"Magdeburger Dom",c:"sehenswuerdigkeit",lat:52.12472,lon:11.63472,t:"Gotische Kathedrale, Wahrzeichen der Stadt",oh:"Mo-Sa 10:00-17:00"},

  {n:"Kloster Unser Lieben Frauen",c:"museum",lat:52.12583,lon:11.63700,t:"Kunstmuseum und Konzerthalle",oh:"Tu-Su 10:00-17:00"},
  {n:"Kulturhistorisches Museum",c:"museum",lat:52.12900,lon:11.63200,t:"Stadtgeschichte und Magdeburger Halbkugeln",oh:"Tu-Su 10:00-17:00"},
  {n:"Technikmuseum Magdeburg",c:"museum",lat:52.13600,lon:11.63900,t:"Technikgeschichte zum Anfassen",oh:"Tu-Su 10:00-17:00"},
  {n:"Elbauenpark",c:"park",lat:52.13550,lon:11.67200,t:"Großer Landschaftspark mit Seebühne"},
  {n:"Jahrtausendturm",c:"sehenswuerdigkeit",lat:52.13500,lon:11.67100,t:"Aussichts- und Ausstellungsturm im Elbauenpark"},
  {n:"Zoo Magdeburg",c:"erleben",lat:52.15600,lon:11.61000,t:"Zoologischer Garten",oh:"Mo-Su 09:00-18:00"},
  {n:"Rotehornpark",c:"park",lat:52.12000,lon:11.64500,t:"Stadtpark auf dem Werder"},
  {n:"Herrenkrugpark",c:"park",lat:52.14500,lon:11.67000,t:"Landschaftspark an der Elbe"},
  {n:"Gruson-Gewächshäuser",c:"erleben",lat:52.12100,lon:11.64300,t:"Botanische Schauhäuser",oh:"Tu-Su 10:00-16:00"},
  {n:"Opernhaus Magdeburg",c:"theater",lat:52.13000,lon:11.63500,t:"Oper und Schauspiel"},
  {n:"Puppentheater Magdeburg",c:"theater",lat:52.13500,lon:11.62500,t:"Figurentheater für alle Altersgruppen"},

/* ------------------------------------------------------------------
   Radiux – Prototyp Magdeburg
   Regelbasierte Empfehlungslogik, keine KI, keine Serververbindung
   außer der optionalen, vom Nutzer ausgelösten OpenStreetMap-Abfrage.
   Alle Bildmotive werden im Gerät erzeugt – keine Fotos, keine Lizenzen.
------------------------------------------------------------------- */

const CATS = [
  { k:"restaurant",       l:"Essen gehen",       m:["restaurant","biergarten"] },
  { k:"cafe",             l:"Café & Bäckerei",   m:["cafe","ice_cream","bakery"] },
  { k:"bar",              l:"Bar & Kneipe",      m:["bar","pub","nightclub"] },
  { k:"schnell",          l:"Schnell & günstig", m:["fast_food"] },
  { k:"sehenswuerdigkeit",l:"Sehenswürdigkeit",  m:["attraction","viewpoint","artwork"] },
  { k:"museum",           l:"Museum & Galerie",  m:["museum","gallery"] },
  { k:"theater",          l:"Bühne & Kino",      m:["theatre","cinema","arts_centre"] },
  { k:"park",             l:"Park & Natur",      m:["park","garden"] },
  { k:"erleben",          l:"Freizeit & Sport",  m:["fitness_centre","sports_centre","swimming_pool","zoo","theme_park"] },

  { k:"alltag",           l:"Alltag",            m:["fuel","library"] }

const CATMAP = Object.fromEntries(CATS.map(c => [c.k, c.l]));

/* Farbwelten je Kategorie: Himmel oben, Himmel unten, drei Silhouettenebenen */
const PAL = {
  restaurant:       ["#ff9a3d","#ff4d6d","#a02b52","#7a1f43","#4d1230"],
  cafe:             ["#ffc46b","#ff7a45","#a34a2c","#7d3520","#4f2013"],

  theater:          ["#f9a8d4","#a855f7","#6d2f8f","#52226c","#341545"],
  park:             ["#86efac","#059669","#0b6b4a","#08533a","#053424"],

/* Aus Datenschutzgründen niemals geladene Kategorien – siehe Blueprint 3 und 9.4 */
const BLOCKED_AMENITY = ["doctors","pharmacy","hospital","clinic","dentist","veterinary",
  "nursing_home","social_facility","childcare","place_of_worship","funeral_hall","crematorium"];

const MODES = {
  essen:     { l:"Etwas essen",     s:"Restaurants, Cafés und Bars in der Nähe", cats:["restaurant","cafe","bar","schnell"], g:["#ff9a3d","#ff4d6d"] },
  erleben:   { l:"Etwas erleben",   s:"Kultur, Sehenswürdigkeiten und Parks",    cats:["sehenswuerdigkeit","museum","theater","park","erleben"], g:["#5eead4","#3b82f6"] },
  stoebern:  { l:"Einfach stöbern", s:"Alles, was in deinem Umkreis liegt",      cats:CATS.map(c=>c.k), g:["#c084fc","#ec4899"] },
  ueberrasch:{ l:"Überrasch mich",  s:"Zufällige Auswahl aus den besten Treffern",cats:CATS.map(c=>c.k), g:["#fbbf24","#7c5cff"] }

/* ---------------- Bildmotive im Gerät erzeugen ---------------- */
function hashOf(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function prng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

function cover(name, cat, w, h){
  const p = PAL[cat] || PAL.alltag;
  const scene = SCENE[cat] || "stadt";
  const r = prng(hashOf(name+"|"+cat));
  const id = "g"+(hashOf(name)%99999);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  s += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient>
        <radialGradient id="${id}s"><stop offset="0" stop-color="#fff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect width="${w}" height="${h}" fill="url(#${id})"/>`;

  // Lichtquelle
  const sx = w*(0.18+r()*0.64), sy = h*(0.16+r()*0.22), sr = h*(0.09+r()*0.06);
  s += `<circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="${(sr*3).toFixed(0)}" fill="url(#${id}s)" opacity=".33"/>`;
  s += `<circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="${sr.toFixed(0)}" fill="#fff" opacity=".82"/>`;

  // Streulichter
  for(let i=0;i<3;i++){
    s += `<circle cx="${(r()*w).toFixed(0)}" cy="${(r()*h*.5).toFixed(0)}" r="${(h*(.05+r()*.16)).toFixed(0)}" fill="#fff" opacity="${(.04+r()*.06).toFixed(2)}"/>`;
  }

  if(scene==="natur"){
    for(let L=0;L<3;L++){
      const base = h*(0.58+L*0.13), amp = h*(0.16-L*0.035);
      let d = `M0 ${h} L0 ${base.toFixed(0)}`;
      const steps = 4+Math.floor(r()*3);
      for(let i=0;i<=steps;i++){
        const x=(w/steps)*i, y=base-Math.sin(i*1.7+L*2+r()*0.6)*amp*(0.5+r()*0.7);
        d += ` Q ${(x-w/steps/2).toFixed(0)} ${(y-amp*.4).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)}`;
      }
      d += ` L${w} ${h} Z`;
      s += `<path d="${d}" fill="${p[2+L]}" opacity="${(0.92-L*0.04).toFixed(2)}"/>`;
      if(L===1){ // Bäume
        for(let t=0;t<5;t++){ const tx=r()*w, ty=base-amp*.2+r()*h*.06, th=h*(.05+r()*.05);
          s += `<path d="M${tx.toFixed(0)} ${ty.toFixed(0)} l${(th*.42).toFixed(0)} ${th.toFixed(0)} h${(-th*.84).toFixed(0)} Z" fill="${p[4]}" opacity=".8"/>`; }
      }
    }
  } else if(scene==="stadt"){
    for(let L=0;L<3;L++){
      const base = h*(0.60+L*0.12);
      let x=0;
      while(x<w){
        const bw = w*(0.06+r()*0.09), bh = h*(0.10+r()*(0.30-L*0.07));
        const y = base-bh;
        s += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${bw.toFixed(0)}" height="${(h-y).toFixed(0)}" fill="${p[2+L]}" opacity="${(0.94-L*0.05).toFixed(2)}"/>`;
        if(L===0 && r()>0.45){ // Fenster
          for(let wy=y+10; wy<base-14; wy+=16){
            for(let wx=x+7; wx<x+bw-9; wx+=14){
              if(r()>0.55) s += `<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="5" height="7" fill="#fff" opacity="${(.2+r()*.5).toFixed(2)}"/>`;
            }
          }
        }
        x += bw + w*0.006;
      }
    }
  } else { // kultur: Bögen und Säulen
    const base = h*0.78;
    s += `<rect x="0" y="${base.toFixed(0)}" width="${w}" height="${(h-base).toFixed(0)}" fill="${p[4]}"/>`;
    const n = 4+Math.floor(r()*3), gap = w/(n+1);
    for(let i=1;i<=n;i++){
      const cx=gap*i, cw=gap*0.62, ch=h*(0.26+r()*0.16);
      s += `<path d="M${(cx-cw/2).toFixed(0)} ${base.toFixed(0)} L${(cx-cw/2).toFixed(0)} ${(base-ch).toFixed(0)}
            A ${(cw/2).toFixed(0)} ${(cw/2).toFixed(0)} 0 0 1 ${(cx+cw/2).toFixed(0)} ${(base-ch).toFixed(0)}
            L${(cx+cw/2).toFixed(0)} ${base.toFixed(0)} Z" fill="${p[2]}" opacity=".93"/>`;
      s += `<rect x="${(cx-cw/2-3).toFixed(0)}" y="${(base-ch-cw/2-10).toFixed(0)}" width="${(cw+6).toFixed(0)}" height="9" rx="3" fill="${p[3]}"/>`;
    }
  }
  s += `<rect width="${w}" height="${h}" fill="none"/></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.replace(/\s+/g," "));
}

/* ---------------- Speicher (§ 25 Abs. 2 Nr. 2 TDDDG) ---------------- */
const store = {
  ok:(()=>{ try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return true; }catch(e){ return false; } })(),
  get(k,d){ if(!this.ok) return d; try{ const v=localStorage.getItem("radius."+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ if(!this.ok) return; try{ localStorage.setItem("radius."+k,JSON.stringify(v)); }catch(e){} },
  clear(){ if(!this.ok) return; Object.keys(localStorage).filter(k=>k.startsWith("radius.")).forEach(k=>localStorage.removeItem(k)); }
};

const S = {
  view:"discover", radius:store.get("radius",3000), mode:null, origin:MD,
  places:[], idx:0, saved:store.get("saved",[]), hidden:store.get("hidden",[]),
  profile:store.get("profile",{}), activeCats:[], loaded:false, loading:false,
  dataSource:"Startbestand"
};

/* ---------------- Hilfsfunktionen ---------------- */
const $ = s => document.querySelector(s);
const main = () => $("#main");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = t => {
  const l=$("#live"); if(l){ l.textContent=""; setTimeout(()=>l.textContent=t,60); }
  const tt=document.getElementById("toast");
  if(tt){ tt.textContent=t; tt.classList.add("on");
    clearTimeout(tt._h); tt._h=setTimeout(()=>tt.classList.remove("on"),4500); }
};

function dist(a,b){
  const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const fmtDist = m => m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const fmtRad  = m => m<1000 ? m+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const walkMin = m => Math.max(1, Math.round(m/80));
const walkTxt = m => { const n=walkMin(m); return n===1 ? "1 Minute" : n+" Minuten"; };

function openState(oh){
  if(!oh) return {s:"unknown", t:"Zeiten unbekannt"};
  const v=oh.trim();
  if(/^24\/7$/.test(v)) return {s:"open", t:"Durchgehend offen"};
  const days=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const now=new Date(), today=days[now.getDay()], mins=now.getHours()*60+now.getMinutes();
  let known=false, open=false;
  for(const part of v.split(";")){
    const m=part.trim().match(/^([A-Za-z,\-]+)\s+(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if(!m) continue;
    const spec=m[1], from=+m[2]*60+ +m[3]; let to=+m[4]*60+ +m[5];
    if(to<=from) to+=1440;
    let hit=false;
    for(const tok of spec.split(",")){
      if(tok.includes("-")){
        const [a,b]=tok.split("-"), ia=days.indexOf(a), ib=days.indexOf(b), it=days.indexOf(today);
        if(ia<0||ib<0) continue;
        if(ia<=ib ? (it>=ia&&it<=ib) : (it>=ia||it<=ib)) hit=true;
      } else if(tok===today) hit=true;
    }
    if(hit){ known=true; if(mins>=from && mins<to) open=true; }
  }
  if(!known) return {s:"unknown", t:"Zeiten unbekannt"};
  return open ? {s:"open", t:"Jetzt geöffnet"} : {s:"closed", t:"Jetzt geschlossen"};
}

/* ---------------- Empfehlungslogik ---------------- */
const W = { dist:0.40, interest:0.30, open:0.20, info:0.10 };

function score(p){
  const sd = Math.max(0, 1 - p._d / Math.max(S.radius,1));
  const prof = S.profile[p.c] || 0;
  const maxProf = Math.max(1, ...Object.values(S.profile).map(Math.abs));
  const si = Math.max(0, Math.min(1, (prof/maxProf + 1)/2));
  const os = p._o.s==="open" ? 1 : p._o.s==="unknown" ? 0.5 : 0.05;
  const inf = (p.oh?0.5:0) + (p.t?0.5:0);
  return W.dist*sd + W.interest*si + W.open*os + W.info*inf;
}

function reasons(p){
  const out=[`${fmtDist(p._d)} entfernt – etwa ${walkTxt(p._d)} zu Fuß`];
  if(p._o.s==="open") out.push("Hat aktuell geöffnet");
  else if(p._o.s==="closed") out.push("Hat gerade geschlossen – deshalb weiter unten");
  else out.push("Öffnungszeiten liegen nicht vor – neutral bewertet");
  const prof=S.profile[p.c]||0;
  if(prof>0) out.push(`Passt zu „${CATMAP[p.c]}“ – ${prof===1?"einmal":prof+"-mal"} gemerkt`);
  else if(prof<0) out.push(`„${CATMAP[p.c]}“ hast du bisher eher ausgeblendet`);
  else out.push(`„${CATMAP[p.c]}“ – noch keine Vorlieben hinterlegt`);
  return out;
}

/* ---------------- Datenaufbereitung ---------------- */
function catOf(tags){
  const vals=[tags.amenity,tags.tourism,tags.leisure,tags.shop].filter(Boolean);
  for(const c of CATS) if(vals.some(v=>c.m.includes(v))) return c.k;
  return null;
}
function allowed(tags){
  if(tags.healthcare) return false;
  if(BLOCKED_AMENITY.includes(tags.amenity))
    return !!tags.tourism && tags.amenity!=="pharmacy" && tags.amenity!=="doctors";
  return true;
}
function prepare(){
  const raw=S.places.map(p=>({...p}));
  raw.forEach(p=>{ p._d=dist(S.origin,p); p._o=openState(p.oh); });
  const cats = S.activeCats.length ? S.activeCats : CATS.map(c=>c.k);
  let list = raw.filter(p => p._d<=S.radius && cats.includes(p.c) && !S.hidden.includes(p.n));
  list.forEach(p=>{ p._s=score(p); });
  list.sort((a,b)=>b._s-a._s);
  if(S.mode==="ueberrasch"){
    const top=list.slice(0,Math.max(8,Math.ceil(list.length*0.4)));
    for(let i=top.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [top[i],top[j]]=[top[j],top[i]]; }
    list=top.concat(list.slice(top.length));
  }
  return list;
}

/* ---------------- OpenStreetMap ---------------- */
const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"
];

async function loadLive(){
  if(S.loading) return;
  S.loading=true; say("Orte werden geladen …"); render();
  const r=Math.max(S.radius,2000)/111000;
  const bb=[S.origin.lat-r, S.origin.lon-r*1.6, S.origin.lat+r, S.origin.lon+r*1.6]
    .map(n=>n.toFixed(4)).join(",");
  const q=`[out:json][timeout:60];(
    nwr(${bb})["amenity"~"^(restaurant|cafe|bar|pub|fast_food|ice_cream|biergarten|theatre|cinema|arts_centre|library|nightclub|fuel)$"]["name"];
    nwr(${bb})["tourism"~"^(attraction|museum|artwork|viewpoint|gallery|zoo|theme_park)$"]["name"];
    nwr(${bb})["leisure"~"^(park|fitness_centre|sports_centre|swimming_pool|garden)$"]["name"];
    nwr(${bb})["shop"~"^(supermarket|mall|bakery|books|clothes|greengrocer)$"]["name"];
  );out center 1500;`;

  let lastErr="unbekannter Fehler";
  for(const url of OVERPASS){
    try{
      const res=await fetch(url,{ method:"POST",
        body:"data="+encodeURIComponent(q),
        headers:{"Content-Type":"application/x-www-form-urlencoded"} });
      if(!res.ok){ lastErr="Server antwortete mit Code "+res.status; continue; }
      const j=await res.json();
      const seen=new Set(), out=[];
      for(const el of (j.elements||[])){
        const t=el.tags||{};
        const lat = el.lat!=null ? el.lat : (el.center ? el.center.lat : null);
        const lon = el.lon!=null ? el.lon : (el.center ? el.center.lon : null);
        if(!t.name || lat==null || lon==null || !allowed(t)) continue;
        const c=catOf(t); if(!c) continue;
        const key=t.name+"|"+c; if(seen.has(key)) continue; seen.add(key);
        out.push({ n:t.name, c, lat, lon, oh:t.opening_hours||"",
          t:t.cuisine ? t.cuisine.replace(/[_;]/g," ") : (t.description||""),
          adr:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ") });
      }
      if(out.length){
        S.places=out; S.loaded=true;
        S.dataSource="OpenStreetMap, "+out.length+" Orte";
        say(out.length+" Orte aus OpenStreetMap geladen.");
        S.loading=false; S.idx=0; render(); return;
      }
      lastErr="Antwort enthielt keine passenden Orte";
    }catch(e){ lastErr = e && e.message ? e.message : "Verbindung fehlgeschlagen"; }
  }
  S.dataSource="Startbestand – Abruf fehlgeschlagen";
  say("Abruf nicht möglich: "+lastErr);
  S.loading=false; render();
}

function useGeo(){
  if(!navigator.geolocation){ say("Standortbestimmung wird nicht unterstützt."); return; }
  say("Standort wird ermittelt …");
  navigator.geolocation.getCurrentPosition(
    pos=>{ S.origin={lat:pos.coords.latitude, lon:pos.coords.longitude, label:"Dein Standort"};
      S.idx=0; say("Standort übernommen."); render(); },
    ()=>say("Standort nicht verfügbar. Es bleibt bei Magdeburg, Stadtmitte."),
    {enableHighAccuracy:false, timeout:8000, maximumAge:300000});
}

/* ---------------- Aktionen ---------------- */
const isSaved = n => S.saved.some(x=>x.n===n);
function bump(p,v){ S.profile[p.c]=(S.profile[p.c]||0)+v; store.set("profile",S.profile); }
function save(p){
  if(!isSaved(p.n)){ S.saved.push({n:p.n,c:p.c,lat:p.lat,lon:p.lon,t:p.t||"",adr:p.adr||"",oh:p.oh||""});
    store.set("saved",S.saved); bump(p,1); say(`„${p.n}“ gemerkt.`); }
  else { S.saved=S.saved.filter(x=>x.n!==p.n); store.set("saved",S.saved); say(`„${p.n}“ entfernt.`); }
}
function hide(p){
  if(!S.hidden.includes(p.n)){ S.hidden.push(p.n); store.set("hidden",S.hidden); bump(p,-0.5); say(`„${p.n}“ ausgeblendet.`); }
}

/* ---------------- Bausteine ---------------- */
function altOf(p){
  return `Stilisierte Illustration in den Farben der Kategorie ${CATMAP[p.c]||"Ort"} – kein Foto des Ortes`;
}
function whyBlock(p){
  return `<div class="why"><h3>Warum dieser Vorschlag</h3><ul>${
    reasons(p).map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
}
function pills(p){
  const o=p._o;
  return `<div class="meta">
    <span class="pill dist">${fmtDist(p._d)} · ${walkMin(p._d)} Min</span>
    <span class="pill ${o.s==="open"?"open":o.s==="closed"?"closed":""}">${esc(o.t)}</span>
    ${p.adr?`<span class="pill">${esc(p.adr)}</span>`:""}
  </div>`;
}

    <strong>Prototyp.</strong> Diese Fassung dient dem Test des Bedienkonzepts.
    Sie verarbeitet keine Daten auf einem Server und enthält keine Werbung,
    keine Zahlungsfunktion und keine Nutzerkonten.
    Alle Bildmotive sind im Gerät erzeugte Illustrationen, keine Fotos der Orte.
  </div>`;
  main().querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{
    S.mode=b.dataset.mode; S.activeCats=[...MODES[S.mode].cats];
    S.idx=0; store.set("mode",S.mode); render();
  }));
}

/* ---------------- Entdecken ---------------- */
function viewDiscover(){
  const list=prepare(), p=list[S.idx];
  let body;
  if(S.loading){
    body = `<div class="empty"><p>Orte werden von OpenStreetMap geladen …</p></div>`;
  } else if(!p){
    body = `<div class="empty">
      <p><strong>Keine weiteren Orte im gewählten Umkreis.</strong></p>
      <p>Vergrößere den Umkreis, wähle mehr Kategorien oder lade aktuelle Daten.</p>
      <button class="btn" id="reset">Ausgeblendete zurückholen</button></div>`;
  } else {
    const nxt=list[S.idx+1];
    body = `<div class="deck" id="deck">
      ${nxt?`<article class="card behind" aria-hidden="true">
        <div class="cover"><img src="${cover(nxt.n,nxt.c,600,400)}" alt=""><div class="scrim"></div></div>
        <div class="cbody"><h2>${esc(nxt.n)}</h2></div></article>`:""}
      <article class="card front" id="card" tabindex="0" aria-labelledby="cardname">
        <div class="stamp yes" id="stampY" aria-hidden="true">MERKEN</div>
        <div class="stamp no" id="stampN" aria-hidden="true">WEG</div>
        <div class="cover">
          <img src="${cover(p.n,p.c,600,400)}" alt="${esc(altOf(p))}">
          <div class="scrim"></div>
          <span class="catbadge">${esc(CATMAP[p.c]||"Ort")}</span>
          <span class="fict">Illustration</span>
        </div>
        <div class="cbody">
          <h2 id="cardname">${esc(p.n)}</h2>
          ${p.t?`<p class="desc">${esc(p.t)}</p>`:""}
          ${pills(p)}
          ${whyBlock(p)}
        </div>
      </article>
    </div>
    <div class="actions">
      <button class="btn act-no" id="bNo">Ausblenden</button>
      <button class="btn" id="bSkip">Später</button>
      <button class="btn act-yes" id="bYes">${isSaved(p.n)?"Gemerkt ✓":"Merken"}</button>
    </div>
    <p class="counter">Vorschlag ${S.idx+1} von ${list.length} · ${fmtRad(S.radius)} um ${esc(S.origin.label)}</p>
    <p class="hint">Nach rechts wischen zum Merken, nach links zum Ausblenden – oder die Schaltflächen nutzen.</p>`;
  }

  main().innerHTML = `<div aria-live="polite" class="sr" id="live"></div>
    <div class="btn-row">
      <button class="btn sm" id="bGeo">Standort verwenden</button>
      <button class="btn sm primary" id="bLive">${S.loaded?"Daten neu laden":"Aktuelle Orte laden"}</button>
      <button class="btn sm ghost" id="bMode">Vorhaben ändern</button>
    </div>
    <p class="counter" style="text-align:left;margin-bottom:2px">Datenbestand: ${esc(S.dataSource)}</p>
    ${body}
    ${listView(list.slice(0,25),"Alle Vorschläge",list.length)}`;

  $("#bGeo")?.addEventListener("click",useGeo);
  $("#bLive")?.addEventListener("click",loadLive);
  $("#bMode")?.addEventListener("click",()=>{ S.mode=null; render(); });
  $("#reset")?.addEventListener("click",()=>{ S.hidden=[]; store.set("hidden",[]); S.idx=0;
    say("Ausgeblendete Orte wurden zurückgeholt."); render(); });
  if(p && !S.loading && $("#card")){
    $("#bYes")?.addEventListener("click",()=>{ save(p); render(); });
    $("#bNo")?.addEventListener("click",()=>{ hide(p); render(); });
    $("#bSkip")?.addEventListener("click",()=>{ S.idx++; render(); });
    swipe($("#card"), ()=>{ save(p); render(); }, ()=>{ hide(p); render(); });
  }
  bindList();
}

/* ---------------- Listenansicht (gleichwertige Alternative) ---------------- */
function listView(list,title,total){
  if(!list.length) return "";
  return `<div class="sechead"><h2>${esc(title)}</h2><span class="cnt">${total??list.length} Treffer</span></div>
  <ul class="list">${list.map((p,i)=>`
    <li>
      <div class="lrow">
        <div class="lthumb"><img src="${cover(p.n,p.c,240,320)}" alt="${esc(altOf(p))}"></div>
        <div class="lmain">
          <h3>${esc(p.n)}</h3>
          ${p.t?`<p class="desc" style="margin-bottom:8px">${esc(p.t)}</p>`:""}
          ${pills(p)}
        </div>
      </div>
      ${whyBlock(p)}
      <div class="lact">
        <button class="btn sm" data-act="save" data-n="${esc(p.n)}">${isSaved(p.n)?"Gemerkt ✓":"Merken"}</button>
        <button class="btn sm" data-act="hide" data-n="${esc(p.n)}">Ausblenden</button>
        <button class="btn sm ghost" data-act="jump" data-i="${i}">Als Karte zeigen</button>
      </div>
    </li>`).join("")}</ul>`;
}
function bindList(){
  main().querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.act==="jump"){ S.idx=+b.dataset.i; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
    const list=prepare();
    const p=list.find(x=>x.n===b.dataset.n) || S.saved.find(x=>x.n===b.dataset.n);
    if(!p) return;
    if(b.dataset.act==="save") save(p); else hide(p);
    render();
  }));
}

/* ---------------- Wischgesten (stets mit Schaltflächen-Alternative) ---------------- */
function swipe(el,onRight,onLeft){
  if(!el) return;
  const sy=$("#stampY"), sn=$("#stampN");
  let x0=null,y0=null,dx=0,lock=null;
  el.addEventListener("pointerdown",e=>{ x0=e.clientX; y0=e.clientY; dx=0; lock=null;
    el.style.transition="none"; el.setPointerCapture?.(e.pointerId); });
  el.addEventListener("pointermove",e=>{
    if(x0===null) return;
    dx=e.clientX-x0; const dy=e.clientY-y0;
    if(lock===null && (Math.abs(dx)>8||Math.abs(dy)>8)) lock=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(lock!=="x") return;
    el.style.transform=`translateX(${dx}px) rotate(${dx/26}deg)`;
    const t=Math.min(Math.abs(dx)/95,1);
    if(sy) sy.style.opacity = dx>0 ? t : 0;
    if(sn) sn.style.opacity = dx<0 ? t : 0;
  });
  const end=()=>{
    if(x0===null) return;
    const d=dx; x0=null;
    if(sy) sy.style.opacity=0; if(sn) sn.style.opacity=0;
    el.style.transition="transform .28s cubic-bezier(.22,1,.36,1)";
    if(lock==="x" && Math.abs(d)>90){
      el.style.transform=`translateX(${d>0?600:-600}px) rotate(${d>0?24:-24}deg)`;
      setTimeout(()=> d>0?onRight():onLeft(), 150);
    } else el.style.transform="";
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"){ e.preventDefault(); onRight(); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); onLeft(); }
  });
}

/* ---------------- Steuerung ---------------- */
function renderControls(){
  const show = S.view==="discover" && S.mode;
  $("#controls").classList.toggle("hidden", !show);
  if(!show) return;
  const chips=$("#chips");
  const ordered=[...CATS].sort((a,b)=>
    (S.activeCats.includes(b.k)?1:0)-(S.activeCats.includes(a.k)?1:0));
  chips.innerHTML=ordered.map(c=>
    `<button type="button" class="chip" data-c="${c.k}" aria-pressed="${S.activeCats.includes(c.k)}">${esc(c.l)}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.c;
    S.activeCats = S.activeCats.includes(k) ? S.activeCats.filter(x=>x!==k) : [...S.activeCats,k];
    S.idx=0; render();
  }));
  $("#rad").value=S.radius;
  $("#radval").textContent=fmtRad(S.radius);
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    if(b.dataset.view===S.view) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  if(S.view==="discover" && !S.mode) viewStart();
  else if(S.view==="discover") viewDiscover();
  else if(S.view==="saved") viewSaved();
  else if(S.view==="how") viewHow();
  else viewLegal();
  renderControls();
}

function init(){
  if(!S.places.length) S.places=FALLBACK_PLACES.map(p=>({...p,oh:p.oh||""}));
  S.mode=store.get("mode",null);
  if(S.mode && MODES[S.mode]) S.activeCats=[...MODES[S.mode].cats]; else S.mode=null;
  document.querySelectorAll("nav.tabs button").forEach(b=>
    b.addEventListener("click",()=>{ S.view=b.dataset.view; window.scrollTo({top:0}); render(); main().focus(); }));
  $("#rad").addEventListener("input",e=>{
    S.radius=+e.target.value; $("#radval").textContent=fmtRad(S.radius); store.set("radius",S.radius); });
  $("#rad").addEventListener("change",()=>{ S.idx=0; render(); });
  render();
}
document.addEventListener("DOMContentLoaded",init);
</script>
