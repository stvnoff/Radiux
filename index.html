    <li>Nur Magdeburg. Außerhalb siehst du nichts.</li>
    <li>Veranstaltungen sind eine Handauswahl, nicht der volle Kalender der Stadt.</li>
    <li>Öffnungszeiten stammen aus OpenStreetMap und können veraltet sein.</li>
    <li>Die Bilder sind Symbolbilder und zeigen nicht den jeweiligen Ort.</li>
    <li>Bewertungen und der persönliche Assistent sind noch nicht gebaut.</li>
  </ul>

  <h2>Radiux auf den Startbildschirm legen</h2>
  <p>Radiux lässt sich wie eine App ablegen, dann genügt ein Tippen auf das Symbol –
  ohne die Adresse einzugeben.</p>
  <ul class="bul">
    <li><strong>iPhone und iPad:</strong> in Safari unten auf „Teilen“, dann
    „Zum Home-Bildschirm“.</li>
    <li><strong>Android:</strong> im Browsermenü auf „App installieren“
    oder „Zum Startbildschirm hinzufügen“.</li>
    <li><strong>Rechner:</strong> in Chrome oder Edge auf das Installationssymbol
    rechts in der Adresszeile.</li>
  </ul>
  <p>Dabei wird nichts installiert, was mitliest: Es entsteht nur eine Verknüpfung.
  Radiux läuft weiterhin im Browser und ohne Server.</p>

  <h2>Ohne dich wächst hier nichts</h2>
  <p>Radiux ist kein fertiges Produkt, das man einfach benutzt. Es ist eine Stadtkarte,
  die genau so gut wird, wie viele Menschen etwas hineintragen. Eine Person allein kann
  Magdeburg nicht abbilden – wer wo aufmacht, was am Wochenende läuft, welcher Laden
  seit dem Frühjahr geschlossen ist.</p>
  <p>Jeder Hinweis, jede Korrektur, jedes Foto macht Radiux für alle anderen brauchbarer.
  Das ist der einzige Weg, wie so etwas wachsen kann, wenn kein Geld dahintersteht:
  weil Leute mitmachen, die selbst etwas davon haben.</p>
  <div class="phase">
    <div class="pnum">Was ich zurückgeben möchte</div>
    <p>Kommt es tatsächlich zu Phase 3 und gibt es eines Tages Komfortfunktionen gegen
    Geld, ist es meine feste Absicht, sie allen, die früh dabei waren, für eine gewisse
    Zeit kostenlos zu geben.</p>
    <p>Ehrlich dazu gehört: Radiux hat heute keine Nutzerkonten und speichert nichts über
    dich auf einem Server. Ich kann also gar nicht sehen, wer wann dabei war. Wie sich das
    später fair lösen lässt, weiß ich noch nicht. Deshalb steht hier eine Absicht und
    kein Versprechen – ein Versprechen, das ich technisch nicht einlösen kann, wäre
    nichts wert.</p>
  </div>

  <h2>Mitmachen</h2>
  <p>Radiux lebt davon, dass die Angaben stimmen. Eine Person allein kann nicht wissen,
  welches Café seit März geschlossen hat oder wann der Biergarten in Buckau wirklich
  aufmacht. Wenn dir etwas auffällt, hilf bitte mit – jeder Hinweis zählt.</p>

  <h3>Der beste Weg: OpenStreetMap</h3>
  <p>Öffnungszeiten, neue Orte, dauerhaft geschlossene Läden – all das gehört nach
  <a href="https://www.openstreetmap.org" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>.
  Ein Konto ist in zwei Minuten angelegt, das Bearbeiten geht direkt im Browser.
  Der Vorteil: Deine Korrektur landet nicht nur in Radiux, sondern in jeder App,
  die OpenStreetMap nutzt – und sie bleibt dort, auch wenn es Radiux einmal nicht mehr gibt.</p>

  <h3>Hinweise direkt an Radiux</h3>
  ${CONTACT ? `<p>Wenn dir der Umweg zu weit ist, schreib mir. Nützlich sind vor allem:
  falsche Öffnungszeiten, geschlossene Betriebe, fehlende Orte und Veranstaltungen,
  die hier fehlen.</p>
  <p><a class="btn sm" href="mailto:${esc(CONTACT)}?subject=${
    encodeURIComponent("Hinweis zu Radiux")}">Hinweis schreiben</a></p>`
  : `<p>Ein Formular direkt in der App gibt es noch nicht. Es bräuchte einen Server,
  der die Eingaben entgegennimmt – und damit einen Auftragsverarbeitungsvertrag,
  ein Verzeichnis der Verarbeitungstätigkeiten und ein Meldeverfahren nach dem
  Digitale-Dienste-Gesetz der EU. Das kommt in Phase 2, sauber gemacht statt schnell.</p>`}

  <h3>Fotos</h3>
  <p>Eigene Fotos sind willkommen und würden die Symbolbilder ersetzen. Bevor du eines
  schickst, drei Dinge, die dich sonst in Schwierigkeiten bringen können:</p>
  <ul class="bul">
    <li>Das Foto muss von dir sein. Ein Bild aus dem Internet oder von der Website des
    Betriebs darfst du nicht weitergeben, auch nicht mit Quellenangabe.</li>
    <li>Von öffentlichem Grund aus darfst du Gebäude von außen fotografieren
    (§ 59 Urheberrechtsgesetz). Innenräume gehören dem Betrieb – dort brauchst du
    das Einverständnis der Betreiberin oder des Betreibers.</li>
    <li>Erkennbare Personen dürfen nicht drauf sein, außer sie sind einverstanden.
    Das gilt auch für Kennzeichen und für Kinder.</li>
  </ul>
  <p>Für den Fall, dass ein Betrieb ein Foto freigibt, gibt es ein einseitiges
  Einverständnisformular zum Ausdrucken. Frag danach, bevor du fotografierst –
  das ist höflicher und rechtlich eindeutig.</p>

  <h3>Was mit deinem Hinweis passiert</h3>
  ${CONTACT ? "" : `<p>Das gilt, sobald oben eine Adresse steht – die Regeln stehen
  vorher fest, nicht hinterher.</p>`}
  <p>Schreibst du eine E-Mail, sehe ich deine Adresse und deinen Text. Beides nutze ich
  nur, um den Hinweis zu bearbeiten und dir gegebenenfalls zu antworten
  (Art. 6 Abs. 1 lit. f DSGVO, berechtigtes Interesse an der Pflege der Angaben).
  Die Nachricht wird gelöscht, sobald die Sache erledigt ist, spätestens nach sechs Monaten.
  Es entsteht kein Konto, kein Newsletter, keine Weitergabe an Dritte.</p>
  <p>Schickst du ein Foto, räumst du damit das Recht ein, es in Radiux zu zeigen –
  widerruflich, jederzeit, formlos. Auf Wunsch wird dein Name als Urheber genannt,
  sonst nicht. Ohne deine ausdrückliche Zustimmung wird kein Foto veröffentlicht.</p>
  <p class="note">Ein Hinweis ist freiwillig. Es entsteht dir kein Nachteil, wenn du
  nichts schickst, und Radiux funktioniert für dich genauso wie für alle anderen.</p>

  <footer class="attrib">
    Ortsdaten © OpenStreetMap-Mitwirkende, Open Database License.
    Symbolbilder aus freier Bilddatenbank.
  </footer>`;
}

/* ---------------- Weitere Seiten ---------------- */
function openMore(){
  document.querySelectorAll(".sheet").forEach(n=>n.remove());
  const el = document.createElement("div");
  el.className = "sheet";
  el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  el.setAttribute("aria-label","Weitere Seiten");
  const items = [
    ["thema","Aussehen","Farbwelt der App wechseln"],
    ["about","Über Radiux","Ziel, aktueller Stand und was als Nächstes kommt"],
    ["how","Wie Radiux empfiehlt","Welche Kriterien die Reihenfolge bestimmen"],
    ["legal","Rechtliches","Impressum, Datenschutz, Barrierefreiheit"]
  ];
  el.innerHTML = `<div class="veil" data-close></div>
    <div class="panel" tabindex="-1">
      <div class="grab"></div>
      <div class="sbody" style="padding-top:22px">
        <div class="micro" style="margin-bottom:14px">Weitere Seiten</div>
        <div class="morelist">${items.map(([v,t,d])=>
          `<button type="button" data-go="${v}"><span class="mt">${esc(t)}</span><span class="ms">${esc(d)}</span></button>`
        ).join("")}</div>
        <div class="lact" style="margin-top:20px">
          <button class="btn sm ghost" data-close>Schließen</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add("locked");
  const shut = ()=>{ el.remove(); document.body.classList.remove("locked"); };
  el.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",shut));
  el.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
    shut();
    if(b.dataset.go==="thema"){ openThema(); return; }
    S.view = b.dataset.go; window.scrollTo({top:0}); render(); main().focus({preventScroll:true});
  }));
  dragClose(el, shut);
  el.querySelector(".panel").focus();
  el.addEventListener("keydown",e=>{ if(e.key==="Escape"){ shut(); } });
}

/* ---------------- Detailansicht eines Ortes ---------------- */
const WC = { yes:"Barrierefrei zugänglich", limited:"Teilweise zugänglich", no:"Nicht barrierefrei" };

function openDetail(name){ S.detail = name; render(); }
function closeDetail(){ S.detail = null; document.body.classList.remove("locked"); render(); }

function viewSheet(){
  const list = prepare();
  const p = list.find(x=>x.n===S.detail) || S.saved.find(x=>x.n===S.detail);
  if(!p){ S.detail=null; return; }
  if(!p._d){ p._d = dist(bezug(),p); p._o = p.start ? {s:"soon",t:evLabel(p.start)} : openState(p.oh); }
  const rows = [];
  rows.push(["Entfernung", p.approx ? "noch nicht bekannt"
    : `${fmtDist(p._d)} · etwa ${walkTxt(p._d)} zu Fuß`]);
  if(p.start) rows.push(["Termin", evLabel(p.start)]);
  if(p.approx) rows.push(["Hinweis",
    "Die genaue Lage dieses Veranstaltungsortes liegt Radiux noch nicht vor. "
    + "Deshalb gibt es hier keine Entfernung und keine Karte – der Ort steht aber fest."]);
  else rows.push(["Status", p._o.t]);
  if(p.oh) rows.push(["Öffnungszeiten", p.oh]);
  if(p.art) rows.push(["Art", esc(p.art)]);
  if(p.adr) rows.push(["Adresse", p.adr]);
  if(p.wc && WC[p.wc]) rows.push(["Zugang", WC[p.wc]]);
  if(p.tel) rows.push(["Telefon", `<a href="tel:${esc(p.tel.replace(/\s+/g,""))}">${esc(p.tel)}</a>`]);
  if(p.web) rows.push(["Website", `<a href="${esc(p.web)}" target="_blank" rel="noopener noreferrer">Speisekarte und Infos</a>`]);
  if(p.src) rows.push(["Quelle", esc(p.src)]);

  const osm = `https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=19/${p.lat}/${p.lon}`;
  const route = `https://www.openstreetmap.org/directions?to=${p.lat}%2C${p.lon}`;

  const el = document.createElement("div");
  el.className = "sheet";
  el.setAttribute("role","dialog");
  el.setAttribute("aria-modal","true");
  el.setAttribute("aria-label", p.n);
  el.innerHTML = `<div class="veil" data-close></div>
    <div class="panel" tabindex="-1">
      <div class="grab"></div>
      <div class="shero">${media(p,900,620)}<div class="scrim"></div></div>
      <div class="sbody">
        <div class="micro" style="margin-bottom:7px">${esc(CATMAP[p.c]||"Ort")} · ${esc(badgeFor(p))}</div>
        <h2>${esc(p.n)}</h2>
        ${p.t?`<p class="desc" style="margin:0">${esc(p.t)}</p>`:""}
        ${p.i?`<p class="about">${esc(p.i)}</p>`:""}
        ${(!p.i && !p.t && !p.start)?`<p class="about" style="opacity:.75">Zu diesem Ort liegt in
          OpenStreetMap keine Beschreibung vor – nur Name, Art und Lage. Wer mag, kann dort
          eine ergänzen; sie erscheint dann auch hier.</p>`:""}
        ${p.wp?`<p style="margin:14px 0 0"><a class="btn sm ghost" href="${esc(p.wp)}"
          target="_blank" rel="noopener noreferrer">Wikipedia-Artikel</a></p>`:""}
        ${p.approx ? "" : miniMap(p)}
        <dl class="dl">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
        ${whyBlock(p)}
        <div class="lact">
          <button class="btn sm" data-act="save" data-n="${esc(p.n)}">${isSaved(p.n)?"Gemerkt ✓":"Merken"}</button>
          <a class="btn sm" href="${route}" target="_blank" rel="noopener noreferrer">Route</a>
          ${p.start?`<button class="btn sm" type="button" data-ics="1">In den Kalender</button>`:""}
          ${p.start?`<a class="btn sm ghost" href="${gcalLink(p)}" target="_blank" rel="noopener noreferrer">Google Kalender</a>`:""}
          ${p.url?`<a class="btn sm" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Zum Veranstalter</a>`:""}
          <a class="btn sm ghost" href="${osm}" target="_blank" rel="noopener noreferrer">Straßenkarte öffnen</a>
          ${p.osm?`<a class="btn sm ghost" href="https://www.openstreetmap.org/${esc(p.osm)}"
            target="_blank" rel="noopener noreferrer">Eintrag ergänzen</a>`:""}
          <button class="btn sm ghost" data-close>Schließen</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add("locked");
  el.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeDetail));
  el.querySelector("[data-ics]")?.addEventListener("click",()=>openCalendar(p));
  el.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
    const q = prepare().find(x=>x.n===b.dataset.n) || S.saved.find(x=>x.n===b.dataset.n);
    if(q) save(q);
    closeDetail();
  }));

  dragClose(el, closeDetail);
  el.querySelector(".panel").focus();
  el.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.preventDefault(); closeDetail(); } });
}

/* ---------------- Wischgesten (stets mit Schaltflächen-Alternative) ---------------- */
function swipe(el,onRight,onLeft,onTap){
  if(!el) return;
  const sy=$("#stampY"), sn=$("#stampN");
  let x0=null,y0=null,dx=0,lock=null;
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest && e.target.closest(".cactions")){ x0=null; return; }
    x0=e.clientX; y0=e.clientY; dx=0; lock=null;
    el.style.transition="none"; el.classList.add("dragging");
    el.setPointerCapture?.(e.pointerId); });
  el.addEventListener("pointermove",e=>{
    if(x0===null) return;
    dx=e.clientX-x0; const dy=e.clientY-y0;
    if(lock===null && (Math.abs(dx)>8||Math.abs(dy)>8)) lock=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(lock!=="x") return;
    el.style.transform=`translateX(${dx}px) rotate(${dx/26}deg)`;
    const t=Math.min(Math.abs(dx)/95,1);
    if(sy) sy.style.opacity = dx>0 ? t : 0;
    if(sn) sn.style.opacity = dx<0 ? t : 0;
  });
  const end=()=>{
    if(x0===null) return;
    const d=dx, moved=lock!==null; x0=null;
    if(!moved && Math.abs(d)<8 && onTap){
      el.style.transition=""; el.style.transform="";
      if(sy) sy.style.opacity=0; if(sn) sn.style.opacity=0;
      onTap(); return;
    }
    if(sy) sy.style.opacity=0; if(sn) sn.style.opacity=0;
    el.style.transition="transform .28s cubic-bezier(.22,1,.36,1)";
    if(lock==="x" && Math.abs(d)>90){
      el.style.transform=`translateX(${d>0?600:-600}px) rotate(${d>0?24:-24}deg)`;
      setTimeout(()=> d>0?onRight():onLeft(), 150);
    } else el.style.transform="";
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"){ e.preventDefault(); onRight(); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); onLeft(); }
    if((e.key==="Enter"||e.key===" ") && onTap){ e.preventDefault(); onTap(); }
    if(e.key==="Backspace"){ e.preventDefault(); undo(); }
  });
}

/* ---------------- Steuerung ---------------- */
function renderControls(){
  const show = S.view==="discover" && S.mode;
  $("#controls").classList.toggle("hidden", !show);
  if(!show) return;
  const all = MODES[S.mode] ? MODES[S.mode].cats : CATS.map(c=>c.k);
  const isAll = S.activeCats.length !== 1;
  const chips = $("#chips");
  chips.innerHTML = CATS.filter(c=>all.includes(c.k)).map(c=>{
      const on = !isAll && S.activeCats[0]===c.k;
      return `<button type="button" class="chip" data-c="${c.k}" aria-pressed="${on}">${esc(c.l)}${on?' <span aria-hidden="true">✕</span>':''}</button>`;
    }).join("");
  chips.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    const k = b.dataset.c;
    S.activeCats = (S.activeCats.length===1 && S.activeCats[0]===k) ? [...all] : [k];
    S.idx = 0; render();
    const el = chips.querySelector('[aria-pressed="true"]');
    if(el) el.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  }));
  const fern = istFern();
  $("#rad").value=S.radius;
  $("#rad").disabled = fern;
  $("#rad").closest(".rng").classList.toggle("aus", fern);
  $("#radval").textContent = fern ? "aus" : fmtRad(S.radius);
  const gb=$("#bGeo");
  if(gb){
    const an = S.origin.label !== MD.label;
    gb.setAttribute("aria-pressed", String(an));
    gb.setAttribute("aria-label", an
      ? "Dein Standort ist der Bezugspunkt. Antippen setzt zurück auf Magdeburg, Stadtmitte."
      : "Meinen Standort verwenden");
    gb.setAttribute("aria-describedby","geohelp");
    if(gb.dataset.wired!=="1"){
      gb.dataset.wired="1";
      gb.addEventListener("click",()=>{
        if(S.origin.label !== MD.label){
          S.origin={...MD}; S.idx=0;
          say("Bezugspunkt ist wieder die Magdeburger Stadtmitte."); render();
        } else useGeo();
      });
    }
  }
  const q=$("#q"), qc=$("#qclr");
  if(q && q.dataset.wired!=="1"){
    q.dataset.wired="1";
    let t=null;
    q.addEventListener("input",()=>{
      clearTimeout(t);
      t=setTimeout(()=>{ S.q=q.value; S.idx=0; render(); q.focus(); },220);
    });
    qc.addEventListener("click",()=>{ S.q=""; q.value=""; S.idx=0; render(); });
  }
  if(q && q.value!==S.q) q.value=S.q;
  if(qc) qc.hidden = !S.q;
}

function render(){
  document.querySelectorAll(".sheet").forEach(n=>n.remove());
  /* Das Wasserzeichen ist eine fortlaufende Zeichnung. Auf den Listen- und
     Kartenansichten würde es unnötig Rechenzeit kosten, deshalb läuft es nur dort,
     wo es zu sehen sein soll. */
  document.body.classList.toggle("nowmark",
    !(S.view==="about" || (S.view==="discover" && !S.mode)));
  const hm = $("#hMode");
  if(hm){
    const on = S.view==="discover" && S.mode && MODES[S.mode];
    hm.hidden = !on;
    if(on) hm.textContent = MODES[S.mode].l + "  ⌄";
  }
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    const cur = b.dataset.view==="more"
      ? (S.view==="how"||S.view==="legal"||S.view==="about") : b.dataset.view===S.view;
    if(cur) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(S.view==="discover" && !S.mode) viewStart();
  else if(S.view==="discover") viewDiscover();
  else if(S.view==="saved") viewSaved();
  else if(S.view==="how") viewHow();
  else if(S.view==="about") viewAbout();
  else viewLegal();
  renderControls();
  if(S.detail) viewSheet(); else document.body.classList.remove("locked");
}

function init(){
  setThema(S.thema);
  try{
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
      document.querySelectorAll(".blogo animate").forEach(a=>a.remove());
  }catch(e){}

  if(!S.places.length) S.places=FALLBACK_PLACES.map(p=>({...p,oh:p.oh||""}));
  S.mode=store.get("mode",null);
  if(S.mode && MODES[S.mode]){ S.activeCats=[...MODES[S.mode].cats]; S.step="modes"; }
  else S.mode=null;
  document.querySelectorAll("nav.tabs button").forEach(b=>
    b.addEventListener("click",()=>{
      if(b.dataset.view==="more"){ openMore(); return; }
      /* Nochmaliges Antippen von „Entdecken“ führt zur Startauswahl zurück –
         damit gibt es aus jedem Zustand einen Weg heraus. */
      if(b.dataset.view==="discover" && S.view==="discover" && !S.detail){
        if(S.mode){ S.mode=null; store.set("mode",null); S.q=""; S.idx=0; S.step="modes"; }
        else S.step = "welcome";
        window.scrollTo({top:0}); render(); main().focus({preventScroll:true}); return;
      }
      S.detail=null; document.body.classList.remove("locked");
      S.view=b.dataset.view; window.scrollTo({top:0}); render(); main().focus({preventScroll:true});
    }));
  $("#hMode")?.addEventListener("click",()=>{ S.mode=null; S.view="discover"; render(); });
  $("#rad").addEventListener("input",e=>{
    S.radius=+e.target.value; $("#radval").textContent=fmtRad(S.radius); store.set("radius",S.radius); });
  $("#rad").addEventListener("change",()=>{ S.idx=0; render(); });
  render();
  loadEvents();
}
document.addEventListener("DOMContentLoaded",init);
</script>
