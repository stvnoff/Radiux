/* ---------------- Übersichtskarte in der Detailansicht ----------------
   Wird im Gerät gezeichnet: Bezugspunkt in der Mitte, der Ort an seiner
   tatsächlichen Himmelsrichtung und Entfernung. Kein Kartendienst, keine
   Kachel-Gebühren, keine Verbindung nach außen. */
const DIRS = ["Norden","Nordosten","Osten","Südosten","Süden","Südwesten","Westen","Nordwesten"];

function bearingTo(a,b){
  const r=Math.PI/180;
  const dLon=(b.lon-a.lon)*r, la1=a.lat*r, la2=b.lat*r;
  const y=Math.sin(dLon)*Math.cos(la2);
  const x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function dirName(deg){ return DIRS[Math.round(deg/45)%8]; }
function ringLabel(m){ return m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km"; }

function miniMap(p){
  const W=320, H=320, cx=W/2, cy=H/2, pad=30;
  const maxD = Math.max(p._d*1.28, 250);
  const sc = (cy-pad)/maxD;
  const deg = bearingTo(bezug(),p), rad = deg*Math.PI/180;
  const tx = cx + Math.sin(rad)*p._d*sc, ty = cy - Math.cos(rad)*p._d*sc;
  const rings = [maxD/3, maxD*2/3, maxD];
  let g = "";
  rings.forEach((r,i)=>{
    g += `<circle cx="${cx}" cy="${cy}" r="${(r*sc).toFixed(1)}" fill="none"
            stroke="currentColor" stroke-opacity="${i===2?.26:.14}" stroke-width="1"
            ${i<2?'stroke-dasharray="3 5"':''}/>`;
    g += `<text x="${cx+4}" y="${(cy-r*sc+11).toFixed(1)}" fill="currentColor" fill-opacity=".38"
            font-size="9.5" font-family="system-ui,sans-serif" letter-spacing="1">${ringLabel(r)}</text>`;
  });
  g += `<line x1="${cx}" y1="${pad-14}" x2="${cx}" y2="${H-pad+14}" stroke="currentColor" stroke-opacity=".10"/>`;
  g += `<line x1="${pad-14}" y1="${cy}" x2="${W-pad+14}" y2="${cy}" stroke="currentColor" stroke-opacity=".10"/>`;
  g += `<text x="${cx}" y="13" text-anchor="middle" fill="currentColor" fill-opacity=".45"
          font-size="10" font-weight="600" font-family="system-ui,sans-serif" letter-spacing="2">N</text>`;
  g += `<line x1="${cx}" y1="${cy}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}"
          stroke="#5aa8ff" stroke-opacity=".75" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="12" fill="#5aa8ff" fill-opacity=".16"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="#5aa8ff"/>`;
  g += `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="13" fill="currentColor" fill-opacity=".12"/>`;
  g += `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="5.5" fill="currentColor"/>`;
  return `<div class="mmap">
    <svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Übersicht: ${esc(p.n)} liegt ${fmtDist(p._d)} in Richtung ${dirName(deg)}, ausgehend von ${esc(bezug().label)}">${g}</svg>
    <div class="mlegend">
      <span><i class="d you"></i>${esc(bezug().label)}</span>
      <span><i class="d there"></i>${esc(p.n)}</span>
      <span class="mdir">${fmtDist(p._d)} Richtung ${dirName(deg)}</span>
    </div>
  </div>`;
}



/* ---------------- Kalendereintrag ----------------
   Erzeugt eine ICS-Datei im Gerät. Öffnet sich in der Kalender-App,
   die der Nutzer ohnehin verwendet – Google, Apple, Outlook.
   Keine Anmeldung, keine Schnittstelle, keine Datenübertragung. */
function icsEsc(x){
  return String(x||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;")
    .replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
}
function icsFor(p){
  const pad = n => String(n).padStart(2,"0");
  const stamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const start = new Date(p.start);
  const end = new Date(start.getTime() + 3*3600*1000);
  const body = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Radiux//Prototyp//DE","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + hashOf(p.n + p.start) + "@radiux",
    "DTSTAMP:" + stamp(new Date()),
    "DTSTART:" + stamp(start),
    "DTEND:" + stamp(end),
    "SUMMARY:" + icsEsc(p.n),
    "LOCATION:" + icsEsc(p.t || ""),
    "DESCRIPTION:" + icsEsc((p.src ? "Angabe laut " + p.src + ". " : "") +
      "Termin und Ort beim Veranstalter prüfen." + (p.url ? " " + p.url : "")),
    "GEO:" + p.lat + ";" + p.lon,
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  return body;
}
/* iOS/Safari blockiert das direkte Öffnen von data:-Adressen. Deshalb wird die
   Termindatei als Blob im Gerät erzeugt und darüber ausgeliefert; die Datei
   verlässt das Gerät nicht. */
function icsDownload(p){
  try{
    const blob = new Blob([icsFor(p)], {type:"text/calendar;charset=utf-8"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = icsName(p); a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    say("Termindatei erstellt. Öffne sie, um sie in deinen Kalender zu übernehmen.");
  }catch(e){
    say("Termindatei konnte nicht erzeugt werden. Nutze den Kalender-Link.");
  }
}
/* Zweiter Weg, falls die Datei auf dem Gerät nicht geöffnet werden kann:
   ein gewöhnlicher Link auf das Eintragsformular von Google Kalender.
   Kein Konto-Zugriff, keine Schnittstelle, keine Übertragung im Hintergrund –
   der Link öffnet sich nur, wenn du ihn antippst. */
function gcalLink(p){
  const pad = n => String(n).padStart(2,"0");
  const z = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  const st = new Date(p.start), en = new Date(st.getTime()+3*3600*1000);
  const par = new URLSearchParams({
    action:"TEMPLATE", text:p.n, dates:`${z(st)}/${z(en)}`,
    location:p.t||"", details:"Termin und Ort beim Veranstalter prüfen."
  });
  return "https://calendar.google.com/calendar/render?" + par.toString();
}
function icsName(p){
  return (String(p.n).replace(/[^\wäöüÄÖÜß -]+/g,"").trim() || "Termin") + ".ics";
}
/* Dateiname der mitgelieferten Termindatei im Ordner „kalender“ */
function icsSlug(p){
  return norm(p.n).replace(/ /g,"-").slice(0,60) + "-" +
         String(p.start).slice(0,10).replace(/-/g,"");
}
/* iOS öffnet nur Termindateien, die über eine Adresse ausgeliefert werden.
   Deshalb liegt zu jeder Veranstaltung eine fertige .ics-Datei im Ordner „kalender“.
   Gibt es sie nicht (etwa beim Testen von der Festplatte), wird die Datei
   ersatzweise im Gerät erzeugt. */
async function openCalendar(p){
  /* Die Termindateien können im Ordner „kalender“ liegen oder direkt neben der
     index.html – beim Hochladen entscheidet sich das leicht anders, als man denkt.
     Beide Wege werden probiert, damit an dieser Stelle nichts kaputtgeht. */
  const datei = icsSlug(p) + ".ics";
  if(location.protocol === "http:" || location.protocol === "https:"){
    for(const url of ["kalender/" + datei, datei]){
      try{
        const r = await fetch(url, {cache:"no-store"});
        if(r.ok){ location.href = url; return; }
      }catch(e){}
    }
  }
  icsDownload(p);
}



/* ---------------- Farbwelt wählen ----------------
   Die Wahl liegt nur im Gerät (§ 25 Abs. 2 Nr. 2 TDDDG: unbedingt erforderlich,
   um eine ausdrücklich gewünschte Einstellung beizubehalten). Nichts davon

const THEMEN = [
  ["auto",  "Automatisch", "Folgt der Einstellung deines Geräts", "linear-gradient(135deg,#09090a 50%,#efe7d8 50%)"],
  ["dunkel","Ruhig dunkel","Zurückhaltend, kontrastreich",        "#131315"],
  ["mondstein","Mondstein","Mondsteinweiß und Beige, diagonal","linear-gradient(135deg,#ffffff 0%,#f0ece3 45%,#d9c39c 100%)"],
  ["neon",  "Neon",        "Glitch, Raster, Magenta und Cyan",    "linear-gradient(135deg,#ff3ba7,#b06bff 55%,#c8ff4d)"]
];
function tempo(k){
  const svg = document.querySelector(".wmark svg");
  if(!svg) return;
  const d = k === "neon" ? "4s" : "7s";
  svg.querySelectorAll("animate").forEach(a=>a.setAttribute("dur", d));
  try{ svg.setCurrentTime(0); }catch(e){}
}
function setThema(k){
  /* Frühere Fassungen kannten „hell". Wer das gewählt hatte, bekommt Mondstein. */
  if(k === "hell") k = "mondstein";
  S.thema = k;
  store.set("thema", k);
  if(k === "auto") document.documentElement.removeAttribute("data-thema");
  else document.documentElement.setAttribute("data-thema", k);
  const dunkel = k==="mondstein" ? "#f6f7f9" : k==="neon" ? "#0a0714"
    : k==="dunkel" ? "#09090a" : null;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta && dunkel) meta.setAttribute("content", dunkel);
  tempo(k);
}
function openThema(){
  document.querySelectorAll(".sheet").forEach(n=>n.remove());
  const el = document.createElement("div");
  el.className = "sheet";
  el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  el.setAttribute("aria-label","Aussehen");
  el.innerHTML = `<div class="veil" data-close></div>
    <div class="panel" tabindex="-1">
      <div class="grab"></div>
      <div class="sbody" style="padding-top:22px">
        <div class="micro" style="margin-bottom:14px">Aussehen</div>
        <div class="themen" role="group" aria-label="Farbwelt wählen">${THEMEN.map(([k,n,d,sw])=>
          `<button type="button" data-t="${k}" aria-pressed="${S.thema===k}">
            <span class="sw" style="background:${sw}"></span>
            <span><span class="tn">${esc(n)}</span><span class="td">${esc(d)}</span></span>
          </button>`).join("")}</div>
        <p class="note" style="margin-top:20px">Die Auswahl bleibt in diesem Browser
        gespeichert und wird nicht übertragen. Inhalte und Reihenfolge der Vorschläge
        ändern sich dadurch nicht.</p>
        <div class="lact" style="margin-top:18px">
          <button class="btn sm ghost" data-close>Schließen</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add("locked");
  const shut = ()=>{ el.remove(); document.body.classList.remove("locked"); };
  el.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",shut));
  el.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{
    setThema(b.dataset.t);
    el.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.t===S.thema)));
    say("Aussehen geändert.");
  }));
  dragClose(el, shut);
  el.querySelector(".panel").focus();
  el.addEventListener("keydown",e=>{ if(e.key==="Escape"){ shut(); } });
}

/* ---------------- Blatt nach unten wegziehen ----------------
   Wird von jedem Blatt genutzt (Detailansicht wie auch „Mehr“).
   Greift nur, wenn das Blatt oben steht – sonst würde normales
   Scrollen versehentlich schließen. Es gibt stets auch einen
   Schließen-Knopf und die Esc-Taste (Barrierefreiheit). */
function dragClose(el, close){
  const panel = el.querySelector(".panel");
  if(!panel) return;
  let y0=null, dy=0, active=false;

  const begin = (y, target)=>{
    if(panel.scrollTop > 2) return false;
    if(target && target.closest && target.closest("a,button,input,select,textarea")) return false;
    y0=y; dy=0; active=false;
    panel.style.transition="none";
    return true;
  };
  const move = (y)=>{
    if(y0===null) return false;
    dy = y - y0;
    if(dy<=0){ panel.style.transform=""; return false; }
    if(!active && dy>6) active=true;
    if(!active) return false;
    panel.style.transform="translateY("+dy+"px)";
    panel.style.opacity=String(Math.max(.35, 1 - dy/620));
    return true;
  };
  const stop = ()=>{
    if(y0===null) return;
    const d=dy; y0=null;
    panel.style.transition="transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s";
    if(active && d>110){
      panel.style.transform="translateY(110%)"; panel.style.opacity="0";
      setTimeout(close,190);
    } else { panel.style.transform=""; panel.style.opacity=""; }
    active=false;
  };

  /* Finger. Nur so erreicht uns die Bewegung auf Handy und Tablet:
     Solange das Blatt oben steht und nach unten gezogen wird, uebernehmen wir
     die Geste, sonst bleibt das gewohnte Scrollen erhalten. */
  panel.addEventListener("touchstart", e=>{
    if(e.touches.length!==1){ y0=null; return; }
    begin(e.touches[0].clientY, e.target);
  }, {passive:true});
  panel.addEventListener("touchmove", e=>{
    if(y0===null || e.touches.length!==1) return;
    if(move(e.touches[0].clientY) && e.cancelable) e.preventDefault();
  }, {passive:false});
  panel.addEventListener("touchend", stop, {passive:true});
  panel.addEventListener("touchcancel", stop, {passive:true});

  /* Maus */
  panel.addEventListener("pointerdown", e=>{
    if(e.pointerType && e.pointerType!=="mouse") return;
    if(begin(e.clientY, e.target)) panel.setPointerCapture?.(e.pointerId);
  });
  panel.addEventListener("pointermove", e=>{
    if(e.pointerType && e.pointerType!=="mouse") return;
    move(e.clientY);
  });
  panel.addEventListener("pointerup", e=>{
    if(e.pointerType && e.pointerType!=="mouse") return; stop();
  });
  panel.addEventListener("pointercancel", e=>{
    if(e.pointerType && e.pointerType!=="mouse") return; stop();
  });
}

    <div class="pnum">Phase 2 · als Nächstes</div>
    <p>Magdeburg vollständig. Veranstaltungen aus einer laufenden Quelle statt von Hand,
    Öffnungszeiten verlässlich, Impressum und Datenschutzerklärung mit echten Angaben,
    anwaltlich geprüft. <strong>Erst dann verschwindet der Prototyp-Hinweis.</strong>
    Bis dahin bleibt er stehen, auch wenn die App längst gut aussieht.</p>
  </div>
  <div class="phase">
    <div class="pnum">Phase 3 · später</div>
    <p>Bewertungen, gemeinsame Merklisten für Gruppen, Erinnerungen an gemerkte Termine,
    weitere Städte. Und der persönliche Assistent, der aus deinen Bewertungen lernt.</p>
    <p>Dazu gehört ehrlicherweise: Bewertungen und ein lernender Assistent brauchen einen
    Server, und ein Server kostet Geld. Beides kommt deshalb erst, wenn es tragfähig ist –
    und beides bleibt freiwillig. Was Radiux ausmacht – suchen, entdecken, merken,
    Wege finden – bleibt für alle kostenlos. Bezahlt würde nur Komfort, nie eine
    Kernfunktion.</p>
  </div>

  <h2>Was heute noch fehlt</h2>
  <ul class="bul">
    <li>Nur Magdeburg. Außerhalb siehst du nichts.</li>
    <li>Veranstaltungen sind eine Handauswahl, nicht der volle Kalender der Stadt.</li>
    <li>Öffnungszeiten stammen aus OpenStreetMap und können veraltet sein.</li>
    <li>Die Bilder sind Symbolbilder und zeigen nicht den jeweiligen Ort.</li>
    <li>Bewertungen und der persönliche Assistent sind noch nicht gebaut.</li>
  </ul>

  <h2>Radiux auf den Startbildschirm legen</h2>
  <p>Radiux lässt sich wie eine App ablegen, dann genügt ein Tippen auf das Symbol –
  ohne die Adresse einzugeben.</p>
  <ul class="bul">
    <li><strong>iPhone und iPad:</strong> in Safari unten auf „Teilen“, dann
    „Zum Home-Bildschirm“.</li>
    <li><strong>Android:</strong> im Browsermenü auf „App installieren“
    oder „Zum Startbildschirm hinzufügen“.</li>
    <li><strong>Rechner:</strong> in Chrome oder Edge auf das Installationssymbol
    rechts in der Adresszeile.</li>
  </ul>
  <p>Dabei wird nichts installiert, was mitliest: Es entsteht nur eine Verknüpfung.
  Radiux läuft weiterhin im Browser und ohne Server.</p>

  <h2>Ohne dich wächst hier nichts</h2>
  <p>Radiux ist kein fertiges Produkt, das man einfach benutzt. Es ist eine Stadtkarte,
  die genau so gut wird, wie viele Menschen etwas hineintragen. Eine Person allein kann
  Magdeburg nicht abbilden – wer wo aufmacht, was am Wochenende läuft, welcher Laden
  seit dem Frühjahr geschlossen ist.</p>
  <p>Jeder Hinweis, jede Korrektur, jedes Foto macht Radiux für alle anderen brauchbarer.
  Das ist der einzige Weg, wie so etwas wachsen kann, wenn kein Geld dahintersteht:
  weil Leute mitmachen, die selbst etwas davon haben.</p>
  <div class="phase">
    <div class="pnum">Was ich zurückgeben möchte</div>
    <p>Kommt es tatsächlich zu Phase 3 und gibt es eines Tages Komfortfunktionen gegen
    Geld, ist es meine feste Absicht, sie allen, die früh dabei waren, für eine gewisse
    Zeit kostenlos zu geben.</p>
    <p>Ehrlich dazu gehört: Radiux hat heute keine Nutzerkonten und speichert nichts über
    dich auf einem Server. Ich kann also gar nicht sehen, wer wann dabei war. Wie sich das
    später fair lösen lässt, weiß ich noch nicht. Deshalb steht hier eine Absicht und
    kein Versprechen – ein Versprechen, das ich technisch nicht einlösen kann, wäre
    nichts wert.</p>
  </div>

  <h2>Mitmachen</h2>
  <p>Radiux lebt davon, dass die Angaben stimmen. Eine Person allein kann nicht wissen,
  welches Café seit März geschlossen hat oder wann der Biergarten in Buckau wirklich
  aufmacht. Wenn dir etwas auffällt, hilf bitte mit – jeder Hinweis zählt.</p>

  <h3>Der beste Weg: OpenStreetMap</h3>
  <p>Öffnungszeiten, neue Orte, dauerhaft geschlossene Läden – all das gehört nach
  <a href="https://www.openstreetmap.org" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>.
  Ein Konto ist in zwei Minuten angelegt, das Bearbeiten geht direkt im Browser.
  Der Vorteil: Deine Korrektur landet nicht nur in Radiux, sondern in jeder App,
  die OpenStreetMap nutzt – und sie bleibt dort, auch wenn es Radiux einmal nicht mehr gibt.</p>

  <h3>Hinweise direkt an Radiux</h3>
  ${CONTACT ? `<p>Wenn dir der Umweg zu weit ist, schreib mir. Nützlich sind vor allem:
  falsche Öffnungszeiten, geschlossene Betriebe, fehlende Orte und Veranstaltungen,
  die hier fehlen.</p>
  <p><a class="btn sm" href="mailto:${esc(CONTACT)}?subject=${
    encodeURIComponent("Hinweis zu Radiux")}">Hinweis schreiben</a></p>`
  : `<p>Ein Formular direkt in der App gibt es noch nicht. Es bräuchte einen Server,
  der die Eingaben entgegennimmt – und damit einen Auftragsverarbeitungsvertrag,
  ein Verzeichnis der Verarbeitungstätigkeiten und ein Meldeverfahren nach dem
  Digitale-Dienste-Gesetz der EU. Das kommt in Phase 2, sauber gemacht statt schnell.</p>`}

  <h3>Fotos</h3>
  <p>Eigene Fotos sind willkommen und würden die Symbolbilder ersetzen. Bevor du eines
  schickst, drei Dinge, die dich sonst in Schwierigkeiten bringen können:</p>
  <ul class="bul">
    <li>Das Foto muss von dir sein. Ein Bild aus dem Internet oder von der Website des
    Betriebs darfst du nicht weitergeben, auch nicht mit Quellenangabe.</li>
    <li>Von öffentlichem Grund aus darfst du Gebäude von außen fotografieren
    (§ 59 Urheberrechtsgesetz). Innenräume gehören dem Betrieb – dort brauchst du
    das Einverständnis der Betreiberin oder des Betreibers.</li>
    <li>Erkennbare Personen dürfen nicht drauf sein, außer sie sind einverstanden.
    Das gilt auch für Kennzeichen und für Kinder.</li>
  </ul>
  <p>Für den Fall, dass ein Betrieb ein Foto freigibt, gibt es ein einseitiges
  Einverständnisformular zum Ausdrucken. Frag danach, bevor du fotografierst –
  das ist höflicher und rechtlich eindeutig.</p>

  <h3>Was mit deinem Hinweis passiert</h3>
  ${CONTACT ? "" : `<p>Das gilt, sobald oben eine Adresse steht – die Regeln stehen
  vorher fest, nicht hinterher.</p>`}
  <p>Schreibst du eine E-Mail, sehe ich deine Adresse und deinen Text. Beides nutze ich
  nur, um den Hinweis zu bearbeiten und dir gegebenenfalls zu antworten
  (Art. 6 Abs. 1 lit. f DSGVO, berechtigtes Interesse an der Pflege der Angaben).
  Die Nachricht wird gelöscht, sobald die Sache erledigt ist, spätestens nach sechs Monaten.
  Es entsteht kein Konto, kein Newsletter, keine Weitergabe an Dritte.</p>
  <p>Schickst du ein Foto, räumst du damit das Recht ein, es in Radiux zu zeigen –
  widerruflich, jederzeit, formlos. Auf Wunsch wird dein Name als Urheber genannt,
  sonst nicht. Ohne deine ausdrückliche Zustimmung wird kein Foto veröffentlicht.</p>
  <p class="note">Ein Hinweis ist freiwillig. Es entsteht dir kein Nachteil, wenn du
  nichts schickst, und Radiux funktioniert für dich genauso wie für alle anderen.</p>

  <footer class="attrib">
    Ortsdaten © OpenStreetMap-Mitwirkende, Open Database License.
    Symbolbilder aus freier Bilddatenbank.
  </footer>`;
}

  const rows = [];
  rows.push(["Entfernung", p.approx ? "noch nicht bekannt"
    : `${fmtDist(p._d)} · etwa ${walkTxt(p._d)} zu Fuß`]);
  if(p.start) rows.push([istSerie(p) ? "Nächster Termin" : "Termin", evLabel(p.start)]);
  if(p.approx) rows.push(["Hinweis",
    "Die genaue Lage dieses Veranstaltungsortes liegt Radiux noch nicht vor. "
    + "Deshalb gibt es hier keine Entfernung und keine Karte – der Ort steht aber fest."]);
  else rows.push(["Status", p._o.t]);
  if(p.oh) rows.push(["Öffnungszeiten", ohListe(p.oh) || esc(p.oh)]);
  if(p.art) rows.push(["Art", esc(p.art)]);
  if(p.adr) rows.push(["Adresse", p.adr]);
  if(p.wc && WC[p.wc]) rows.push(["Zugang", WC[p.wc]]);
  if(p.tel) rows.push(["Telefon", `<a href="tel:${esc(p.tel.replace(/\s+/g,""))}">${esc(p.tel)}</a>`]);
  if(p.web) rows.push(["Website", `<a href="${esc(p.web)}" target="_blank" rel="noopener noreferrer">Speisekarte und Infos</a>`]);

          badgeZusatz(p) ? " (" + esc(badgeZusatz(p)) + ")" : ""}</div>
        <h2>${esc(p.n)}</h2>
        ${p.t?`<p class="desc" style="margin:0">${esc(p.t)}</p>`:""}
        ${p.i?`<p class="about">${esc(p.i)}</p>`:""}
        ${(!p.i && !p.t && !p.start)?`<p class="about" style="opacity:.75">Zu diesem Ort liegt in
          OpenStreetMap keine Beschreibung vor – nur Name, Art und Lage. Wer mag, kann dort
          eine ergänzen; sie erscheint dann auch hier.</p>`:""}
        ${p.wp?`<p style="margin:14px 0 0"><a class="btn sm ghost" href="${esc(p.wp)}"
          target="_blank" rel="noopener noreferrer">Wikipedia-Artikel</a></p>`:""}
        ${istSerie(p) ? `<div class="termine">
          <h3>Alle Termine</h3>
          <p class="micro" style="margin:0 0 10px">Diese Veranstaltung läuft an
            ${p.alle.length} Abenden. Jeder Termin lässt sich einzeln übernehmen.</p>
          <ul>${p.alle.map((st,i)=>`<li>
            <span>${esc(evLabel(st))}</span>
            <button type="button" class="btn sm ghost" data-termin="${i}">In den Kalender</button>

        ${p.approx ? "" : miniMap(p)}
        <dl class="dl">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
        ${whyBlock(p)}

        </div>
        <details class="mehr">

            ${p.tk?`<a href="${esc(p.tk)}" target="_blank" rel="noopener noreferrer">Tickets beim Anbieter ↗</a>`:""}
            ${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Zur Ankündigung ↗</a>`:""}
            ${(p.start && !p.approx)?`<a href="${route}" target="_blank" rel="noopener noreferrer">Route dorthin</a>`:""}
            ${p.start?`<a href="${gcalLink(p)}" target="_blank" rel="noopener noreferrer">Google Kalender ↗</a>`:""}
            <a href="${esc(waLink(p))}" target="_blank" rel="noopener noreferrer">Über WhatsApp senden ↗</a>
            ${p.approx?"":`<a href="${osm}" target="_blank" rel="noopener noreferrer">Straßenkarte öffnen ↗</a>`}

              target="_blank" rel="noopener noreferrer">Eintrag bei OpenStreetMap ergänzen ↗</a>`:""}
            <button type="button" data-act="hide" data-n="${esc(p.n)}">Diesen Ort ausblenden</button>
          </div>
        </details>
        <p class="tkhint">Geteilt wird ein gewöhnlicher Link auf diesen Ort in Radiux.
          Es wird nichts an einen Nachrichtendienst übertragen, solange du keinen auswählst.</p>
        ${p.tk?`<p class="tkhint">Der Ticketverkauf
          läuft über ${esc(ziel(p.tk))} – ein fremdes Angebot. Radiux verkauft keine
          Tickets, vermittelt nichts und verdient an diesem Verweis nichts.</p>`:""}
      </div>
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add("locked");
  el.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeDetail));
  el.querySelector("[data-ics]")?.addEventListener("click",()=>openCalendar(p));
  el.querySelector("[data-teilen]")?.addEventListener("click",()=>teilen(p));
  el.querySelectorAll("[data-termin]").forEach(b=>b.addEventListener("click",()=>{

  el.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{

    if(q){ if(b.dataset.act === "hide") hide(q); else save(q); }

  }));

  dragClose(el, closeDetail);
  el.querySelector(".panel").focus();
  el.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.preventDefault(); closeDetail(); } });
}

/* ---------------- Wischgesten (stets mit Schaltflächen-Alternative) ---------------- */
function swipe(el,onRight,onLeft,onTap){
  if(!el) return;
  const sy=$("#stampY"), sn=$("#stampN");
  let x0=null,y0=null,dx=0,lock=null;
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest && e.target.closest(".cactions")){ x0=null; return; }
    x0=e.clientX; y0=e.clientY; dx=0; lock=null;
    el.style.transition="none"; el.classList.add("dragging");
    el.setPointerCapture?.(e.pointerId); });
  el.addEventListener("pointermove",e=>{
    if(x0===null) return;
    dx=e.clientX-x0; const dy=e.clientY-y0;
    if(lock===null && (Math.abs(dx)>8||Math.abs(dy)>8)) lock=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(lock!=="x") return;
    el.style.transform=`translateX(${dx}px) rotate(${dx/26}deg)`;
    const t=Math.min(Math.abs(dx)/95,1);
    if(sy) sy.style.opacity = dx>0 ? t : 0;
    if(sn) sn.style.opacity = dx<0 ? t : 0;
  });
  const end=()=>{
    if(x0===null) return;
    const d=dx, moved=lock!==null; x0=null;
    if(!moved && Math.abs(d)<8 && onTap){
      el.style.transition=""; el.style.transform="";
      if(sy) sy.style.opacity=0; if(sn) sn.style.opacity=0;
      onTap(); return;
    }
    if(sy) sy.style.opacity=0; if(sn) sn.style.opacity=0;
    el.style.transition="transform .28s cubic-bezier(.22,1,.36,1)";
    if(lock==="x" && Math.abs(d)>90){
      el.style.transform=`translateX(${d>0?600:-600}px) rotate(${d>0?24:-24}deg)`;
      setTimeout(()=> d>0?onRight():onLeft(), 150);
    } else el.style.transform="";
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"){ e.preventDefault(); onRight(); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); onLeft(); }
    if((e.key==="Enter"||e.key===" ") && onTap){ e.preventDefault(); onTap(); }
    if(e.key==="Backspace"){ e.preventDefault(); undo(); }
  });
}

/* ---------------- Steuerung ---------------- */
function renderControls(){
  const show = S.view==="discover" && S.mode;
  $("#controls").classList.toggle("hidden", !show);
  if(!show) return;
  const all = MODES[S.mode] ? MODES[S.mode].cats : CATS.map(c=>c.k);
  const isAll = S.activeCats.length !== 1;
  const chips = $("#chips");
  chips.innerHTML = CATS.filter(c=>all.includes(c.k)).map(c=>{
      const on = !isAll && S.activeCats[0]===c.k;
      return `<button type="button" class="chip" data-c="${c.k}" aria-pressed="${on}">${esc(c.l)}${on?' <span aria-hidden="true">✕</span>':''}</button>`;
    }).join("");
  chips.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    const k = b.dataset.c;
    S.activeCats = (S.activeCats.length===1 && S.activeCats[0]===k) ? [...all] : [k];
    S.idx = 0; render();
    const el = chips.querySelector('[aria-pressed="true"]');
    if(el) el.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  }));
  const fern = istFern();
  $("#rad").value=S.radius;
  $("#rad").disabled = fern;
  $("#rad").closest(".rng").classList.toggle("aus", fern);
  $("#radval").textContent = fern ? "aus" : fmtRad(S.radius);
  const gb=$("#bGeo");
  if(gb){
    const an = S.origin.label !== MD.label;
    gb.setAttribute("aria-pressed", String(an));
    gb.setAttribute("aria-label", an
      ? "Dein Standort ist der Bezugspunkt. Antippen setzt zurück auf Magdeburg, Stadtmitte."
      : "Meinen Standort verwenden");
    gb.setAttribute("aria-describedby","geohelp");
    if(gb.dataset.wired!=="1"){
      gb.dataset.wired="1";
      gb.addEventListener("click",()=>{
        if(S.origin.label !== MD.label){
          S.origin={...MD}; S.idx=0;
          say("Bezugspunkt ist wieder die Magdeburger Stadtmitte."); render();
        } else useGeo();
      });
    }
  }
  const q=$("#q"), qc=$("#qclr");
  if(q && q.dataset.wired!=="1"){
    q.dataset.wired="1";
    let t=null;
    q.addEventListener("input",()=>{
      clearTimeout(t);
      t=setTimeout(()=>{ S.q=q.value; S.idx=0; render(); q.focus(); },220);
    });
    qc.addEventListener("click",()=>{ S.q=""; q.value=""; S.idx=0; render(); });
  }
  if(q && q.value!==S.q) q.value=S.q;
  if(qc) qc.hidden = !S.q;
}


/* Kurzer Bildversatz auf der ersten Überschrift. Die Regel dazu gilt nur in
   der Farbwelt Neon; in allen anderen passiert sichtbar nichts. */
function glitch(){
  const el = main().querySelector("h1, .wgreet");
  if(!el) return;
  el.classList.remove("glitch");
  void el.offsetWidth;          /* erzwingt einen Neustart der Abfolge */
  el.classList.add("glitch");
}

function render(){
  document.querySelectorAll(".sheet").forEach(n=>n.remove());
  /* Das Wasserzeichen ist eine fortlaufende Zeichnung. Auf den Listen- und
     Kartenansichten würde es unnötig Rechenzeit kosten, deshalb läuft es nur dort,
     wo es zu sehen sein soll. */
  document.body.classList.toggle("nowmark",
    !(S.view==="about" || (S.view==="discover" && !S.mode)));
  const hm = $("#hMode");
  if(hm){
    const on = S.view==="discover" && S.mode && MODES[S.mode];
    hm.hidden = !on;
    if(on) hm.textContent = MODES[S.mode].l + "  ⌄";
  }
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    const cur = b.dataset.view==="more"
      ? (S.view==="how"||S.view==="legal"||S.view==="about") : b.dataset.view===S.view;
    if(cur) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(S.view==="discover" && !S.mode) viewStart();
  else if(S.view==="discover") viewDiscover();
  else if(S.view==="saved") viewSaved();
  else if(S.view==="how") viewHow();
  else if(S.view==="about") viewAbout();
  else viewLegal();
  renderControls();
  glitch();
  if(S.detail) viewSheet(); else document.body.classList.remove("locked");
}

function init(){
  setThema(S.thema);
  try{
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
      document.querySelectorAll(".blogo animate").forEach(a=>a.remove());
  }catch(e){}

  if(!S.places.length) S.places=FALLBACK_PLACES.map(p=>({...p,oh:p.oh||""}));
  /* Wurde ein Ort geteilt, führt die Adresse direkt dorthin. Gibt es ihn nicht
     (mehr), passiert nichts Schlimmes – dann startet Radiux wie sonst auch. */
  try{
    const gewuenscht = new URLSearchParams(location.search).get("ort");
    if(gewuenscht){
      S.step="modes"; S.mode="stoebern"; S.activeCats=[...MODES.stoebern.cats];
      const alle = S.places.concat(eventsAsPlaces());
      const treffer = alle.find(x => x.n === gewuenscht)
                   || alle.find(x => norm(x.n) === norm(gewuenscht));
      if(treffer) S.detail = treffer.n;
      history.replaceState(null,"",location.pathname);
    }
  }catch(e){}
  S.mode=store.get("mode",null);
  if(S.mode && MODES[S.mode]){ S.activeCats=[...MODES[S.mode].cats]; S.step="modes"; }
  else S.mode=null;
  document.querySelectorAll("nav.tabs button").forEach(b=>
    b.addEventListener("click",()=>{
      if(b.dataset.view==="more"){ openMore(); return; }
      /* Nochmaliges Antippen von „Entdecken“ führt zur Startauswahl zurück –
         damit gibt es aus jedem Zustand einen Weg heraus. */
      if(b.dataset.view==="discover" && S.view==="discover" && !S.detail){
        if(S.mode){ S.mode=null; store.set("mode",null); S.q=""; S.idx=0; S.step="modes"; }
        else S.step = "welcome";
        window.scrollTo({top:0}); render(); main().focus({preventScroll:true}); return;
      }
      S.detail=null; document.body.classList.remove("locked");
      S.view=b.dataset.view; window.scrollTo({top:0}); render(); main().focus({preventScroll:true});
    }));
  $("#hMode")?.addEventListener("click",()=>{ S.mode=null; S.view="discover"; render(); });
  $("#rad").addEventListener("input",e=>{
    S.radius=+e.target.value; $("#radval").textContent=fmtRad(S.radius); store.set("radius",S.radius); });
  $("#rad").addEventListener("change",()=>{ S.idx=0; render(); });
  render();
  loadEvents();
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body></html>
