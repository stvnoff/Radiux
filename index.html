<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0b10">
<title>Radiux – Magdeburg entdecken</title>
<style>
  /* ---------- Farbwelten ----------
     Alle Farben stecken in Variablen. Ein Wechsel des Erscheinungsbildes tauscht
     nur diese Werte aus – kein zweites Stilblatt, kein Nachladen.
     Ohne eigene Wahl richtet sich Radiux nach der Einstellung des Geräts. */
  :root{
    --blur:blur(22px) saturate(125%);
    --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
    --card-h:clamp(320px,47vh,452px);
    --ease:cubic-bezier(.2,.8,.2,1);
    --micro:.68rem;
      --bg:#09090a; --bg-2:#0d0d0e;
      --surface:#121213; --surface-2:#191919; --surface-3:#232322;
      --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.15);
      --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.085);
      --glass-line:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.20);
      --veil:rgba(9,9,10,.80); --card-veil:rgba(31,31,34,.74); --card-solid:#1b1b1d;
      --text:#f3f2ef; --text-dim:#9d9c97; --text-mute:#6b6a66;
      --accent:#efece4; --accent-ink:#0b0b0c;
      --pos:#8fbb96; --neg:#cf918a; --warn:#c9a86a;
      --shine:#5aa8ff; --shine-hot:#eaf6ff;
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#f3f4f6; --bg-2:#efeae0;
      --surface:#ffffff; --surface-2:#f7f4ee; --surface-3:#ece4d6;
      --line:rgba(38,34,28,.10); --line-2:rgba(38,34,28,.20);
      --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.78);
      --glass-line:rgba(38,34,28,.13); --glass-hi:rgba(255,255,255,.95);
      --veil:rgba(246,246,246,.84); --card-veil:rgba(255,255,255,.7); --card-solid:#ffffff;
      --text:#241f18; --text-dim:#5d564b; --text-mute:#8b8376;
      --accent:#2a251d; --accent-ink:#f7f4ee;
      --pos:#3a6f4a; --neg:#9d3a30; --warn:#8a6a1e;
      --shine:#6f8cb0; --shine-hot:#243a55;
    }
  }
  html[data-thema="dunkel"]{
      --bg:#09090a; --bg-2:#0d0d0e;
      --surface:#121213; --surface-2:#191919; --surface-3:#232322;
      --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.15);
      --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.085);
      --glass-line:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.20);
      --veil:rgba(9,9,10,.80); --card-veil:rgba(31,31,34,.74); --card-solid:#1b1b1d;
      --text:#f3f2ef; --text-dim:#9d9c97; --text-mute:#6b6a66;
      --accent:#efece4; --accent-ink:#0b0b0c;
      --pos:#8fbb96; --neg:#cf918a; --warn:#c9a86a;
      --shine:#5aa8ff; --shine-hot:#eaf6ff;
  }
  html[data-thema="mondstein"]{
      --bg:#f3f4f6; --bg-2:#efeae0;
      --surface:#ffffff; --surface-2:#f7f4ee; --surface-3:#ece4d6;
      --line:rgba(38,34,28,.10); --line-2:rgba(38,34,28,.20);
      --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.78);
      --glass-line:rgba(38,34,28,.13); --glass-hi:rgba(255,255,255,.95);
      --veil:rgba(246,246,246,.84); --card-veil:rgba(255,255,255,.7); --card-solid:#ffffff;
      --text:#241f18; --text-dim:#5d564b; --text-mute:#8b8376;
      --accent:#2a251d; --accent-ink:#f7f4ee;
      --pos:#3a6f4a; --neg:#9d3a30; --warn:#8a6a1e;
      --shine:#6f8cb0; --shine-hot:#243a55;
  }
  html[data-thema="neon"]{
      --bg:#0a0714; --bg-2:#100a20;
      --surface:#150e28; --surface-2:#1d1436; --surface-3:#291c4a;
      --line:rgba(196,160,255,.16); --line-2:rgba(196,160,255,.3);
      --glass:rgba(160,110,255,.10); --glass-2:rgba(160,110,255,.18);
      --glass-line:rgba(196,160,255,.26); --glass-hi:rgba(255,255,255,.22);
      --veil:rgba(10,7,20,.82); --card-veil:rgba(29,20,54,.78); --card-solid:#1d1436;
      --text:#f6f2ff; --text-dim:#b6a6d6; --text-mute:#8878ad;
      --accent:#c8ff4d; --accent-ink:#150e28;
      --pos:#5ce7a8; --neg:#ff7a9c; --warn:#ffd166;
      --shine:#ff3ba7; --shine-hot:#7df9ff;
  }
  *{box-sizing:border-box}
  html{margin:0;padding:0;background:var(--bg)}
  body{margin:0;padding:0;background:transparent;color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    font-size:16px;line-height:1.55;letter-spacing:-.012em;
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
    min-height:100dvh}
  /* Das Wasserzeichen wird oben verankert, nicht mittig.
     Prozentwerte und Mittelzentrierung beziehen sich auf die sichtbare Fensterhoehe -
     und die aendert sich am Handy, sobald die Adresszeile ein- oder ausfaehrt.
     Genau daher kam das Zucken beim Scrollen. Mit einem festen Abstand von oben
     und einer eigenen Ebene fuer die Grafik bleibt das R ruhig stehen. */
  .wmark{position:fixed;left:50%;top:12vh;
    transform:translate3d(-50%,0,0);backface-visibility:hidden;
    width:min(112vw,660px);z-index:-1;pointer-events:none;opacity:.72;
    contain:layout paint}
  .wmark svg{width:100%;height:auto;display:block}
  body.nowmark .wmark{display:none}
  @media (prefers-color-scheme:light){ .wmark{opacity:.4} }

  .wrap{max-width:620px;margin:0 auto;padding:0 22px}
  main.wrap{padding-bottom:74px;scroll-margin-top:0}
  main:focus{outline:none}
  h1,h2,h3{line-height:1.1;margin:0 0 .5em;letter-spacing:-.035em;font-weight:600}
  h1{font-size:clamp(2.1rem,9vw,2.7rem)}
  h2{font-size:1.3rem}
  h3{font-size:1.02rem}
  p{margin:0 0 .95em}
  a{color:var(--text);text-underline-offset:3px}
  button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--text);outline-offset:3px;border-radius:4px}
  .skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--accent-ink);
    padding:12px 18px;z-index:99;font-weight:600}
  .skip:focus{left:0;top:0}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .micro{font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    font-weight:600;color:var(--text-mute)}

  /* ---------- Kopf ---------- */
  header.app{position:sticky;top:0;z-index:30;background:var(--veil);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:12px;padding:18px 0 15px;min-width:0}
  .blogo{width:24px;height:30px;flex:0 0 auto;display:block;color:var(--text)}
  .blogo svg{width:100%;height:100%;display:block}
  .brand{font-weight:600;font-size:1.06rem;letter-spacing:.24em;text-transform:uppercase;
    margin-right:auto;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis}
  .modebtn{font-size:var(--micro);text-transform:uppercase;letter-spacing:.14em;font-weight:600;
    color:var(--text-dim);white-space:nowrap;background:var(--glass);cursor:pointer;
    border:1px solid var(--glass-line);border-radius:99px;padding:9px 15px;min-height:38px;
    max-width:52vw;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;
    transition:color .2s,background .2s}
  .modebtn:hover{color:var(--text);background:var(--glass-2)}

  .controls{padding:2px 22px 18px;border-bottom:1px solid var(--line)}
  .rng{display:flex;align-items:center;gap:14px;width:100%;margin:8px 0 16px;min-width:0}
  .rng.aus input[type=range]{opacity:.3}
  .rng.aus label,.rng.aus .radval{color:var(--text-mute)}
  .rng label{flex:0 0 auto;font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    font-weight:600;color:var(--text-mute)}
  .geobtn{flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
    border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);
    color:var(--text-mute);transition:color .2s,background .2s,border-color .2s;margin-left:-4px}
  .geobtn svg{width:18px;height:18px}
  .geobtn:hover{color:var(--text)}
  .geobtn[aria-pressed=true]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .tinylink{background:none;border:0;padding:6px 0;font:inherit;font-size:.82rem;cursor:pointer;
    color:var(--text-dim);text-decoration:underline;text-underline-offset:4px;
    text-transform:none;letter-spacing:0;white-space:nowrap;transition:color .2s}
  .tinylink:hover{color:var(--text)}
  input[type=range]{flex:1;min-width:90px;height:30px;appearance:none;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-2)}
  input[type=range]::-moz-range-track{height:2px;background:var(--line-2)}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;margin-top:-7px;
    border-radius:50%;background:var(--text);border:0}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:0}
  .radval{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;
    min-width:58px;text-align:right;flex:0 0 auto;color:var(--text)}
  @media (max-width:360px){
    .rng{gap:10px}
    .rng label{font-size:0;letter-spacing:0}
    .rng label::after{content:"Umkreis";font-size:var(--micro);letter-spacing:.16em}
  }

  .srch{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:0 14px;
    border:1px solid var(--glass-line);border-radius:99px;background:var(--glass);}
  .srch svg{width:17px;height:17px;flex:0 0 auto;color:var(--text-mute)}
  .srch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);
    font:inherit;font-size:.92rem;padding:12px 0;min-height:44px}
  .srch input::placeholder{color:var(--text-mute)}
  .srch input::-webkit-search-cancel-button{display:none}
  .srch button{background:none;border:0;color:var(--text-mute);cursor:pointer;
    font-size:.9rem;padding:8px;line-height:1}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border-radius:99px;padding:8px 15px;cursor:pointer;min-height:38px;
    font-size:.82rem;font-weight:500;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--glass-line);
    box-shadow:inset 0 1px 0 var(--glass-hi);
    transition:color .2s,background .2s,border-color .2s}
  .chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

  /* ---------- Schaltflächen ---------- */
  .btn{position:relative;overflow:hidden;border-radius:99px;padding:12px 20px;cursor:pointer;
    min-height:46px;font-weight:500;font-size:.92rem;color:var(--text);
    background:var(--glass);border:1px solid var(--glass-line);
    box-shadow:inset 0 1px 0 var(--glass-hi);
    transition:background .2s,border-color .2s,opacity .2s}
  .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 52%)}
  .btn:hover{background:var(--glass-2)}
  .btn:active{opacity:.65}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
    font-weight:600;box-shadow:none}
  .btn.primary::after{display:none}
  .btn.sm{padding:8px 15px;min-height:38px;font-size:.8rem}
  .btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--text-dim)}
  .btn.ghost::after{display:none}
  .btn-row{display:flex;gap:9px;margin:18px 0 8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .btn-row::-webkit-scrollbar{display:none}
  .btn-row .btn{flex:0 0 auto;white-space:nowrap}

  /* ---------- Start ---------- */
  .hero{padding:58px 0 10px}
  .welcome{padding:70px 0 10px;max-width:40ch;margin:0 auto;text-align:left;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,
      "Hoefler Text","Times New Roman",serif;
    font-size:1.12rem;line-height:1.68;letter-spacing:0;color:var(--text-dim)}
  .welcome p{margin:0 0 18px}
  .welcome .wgreet{font-size:1.9rem;line-height:1.2;color:var(--text);margin-bottom:20px;
    letter-spacing:-.01em}
  .wact{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px;
    justify-content:center;font-family:var(--font);font-size:1rem}
  .welcome .soon{font-family:var(--font);font-size:var(--micro);text-transform:uppercase;
    letter-spacing:.16em;font-weight:600;color:var(--text-mute);
    margin:26px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
  .evtabs{display:flex;gap:6px;margin:14px 0 0}
  .evtabs button{flex:1 1 0;min-width:0;background:var(--card);color:var(--text-dim);
    border:1px solid var(--line);border-radius:11px;padding:8px 5px;font:inherit;
    font-size:.82rem;line-height:1.25;cursor:pointer;overflow:hidden}
  .evtabs .t1{display:block;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .evtabs .t2{display:block}
  /* Die zweite Zeile darf umbrechen und trennen – „Veranstaltungen“ passt auf
     schmalen Geräten sonst in keinen Drittel-Reiter. */
  .evtabs .t2{font-size:.74rem;opacity:.72;margin-top:1px;white-space:normal;
    hyphens:auto;-webkit-hyphens:auto;text-overflow:clip;overflow:visible}
  @media (max-width:359px){ .evtabs{gap:4px}
    .evtabs button{font-size:.72rem;padding:8px 2px}
    .evtabs .t2{font-size:.66rem} }
  .evtabs button .n{opacity:.6;font-variant-numeric:tabular-nums;margin-left:3px}
  .evtabs button[aria-pressed="true"]{background:var(--text);color:var(--bg);
    border-color:var(--text);font-weight:600}
  .evtabs button[aria-pressed="true"] .n{opacity:.7}
  /* Die zweite Zeile bleibt in normaler Stärke – fett würde sie breiter und
     dann im gewählten Reiter abgeschnitten. */
  .evtabs button[aria-pressed="true"] .t2{font-weight:400;opacity:.82}
  .pill.serie{border-color:color-mix(in srgb,var(--accent) 45%,transparent);
    color:var(--accent);font-weight:600}
  .tkhint{margin:14px 0 0;font-size:.85rem;line-height:1.5;color:var(--text-mute)}
  .schalter{display:flex;align-items:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
  .ohliste{list-style:none;margin:0;padding:0}
  .ohliste li{display:flex;gap:12px;justify-content:space-between;align-items:baseline;
    padding:5px 0;border-top:1px solid var(--line)}
  .ohliste li:first-child{border-top:0;padding-top:0}
  .ohliste .tag{color:var(--text-mute);flex:0 0 auto}
  .ohliste .zeit{text-align:right;font-variant-numeric:tabular-nums}
  .ohliste li.heute .tag,.ohliste li.heute .zeit{color:var(--text);font-weight:600}
  .ohrest{margin:12px 0 4px;font-size:.85rem;color:var(--text-mute);line-height:1.5}
  .ohroh{margin:0;font-size:.8rem;color:var(--text-mute);word-break:break-word}
  .termine{margin:18px 0 4px;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
  .termine h3{margin:0 0 4px;font-size:1rem}
  .termine ul{list-style:none;margin:0;padding:0}
  .termine li{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:9px 0;border-top:1px solid var(--line)}
  .termine li:first-child{border-top:0}
  .termine li span{font-size:.95rem}
  .inlink{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:var(--text);
    text-decoration:underline;text-underline-offset:3px}
  .hero h1{margin-bottom:.24em}
  .hero .lead{color:var(--text-dim);font-size:1.02rem;margin-bottom:42px;max-width:32ch}
  .hero{text-align:center;padding-top:34px}
  .hero .lead{margin-left:auto;margin-right:auto}
  .modes{display:grid;gap:0;border-top:1px solid var(--line)}
  .mode{position:relative;border:0;border-bottom:1px solid var(--line);background:transparent;
    padding:0;cursor:pointer;text-align:left;width:100%;transition:background .2s}
  .mode:hover{background:var(--surface-2)}
  .mode:active{opacity:.6}
  .mode .mi{display:block;padding:24px 12px;text-align:center}

  .mode .mt{font-weight:600;font-size:1.16rem;display:block;letter-spacing:-.03em}
  .mode .ms{font-size:.88rem;color:var(--text-dim);display:block;margin-top:3px}


  /* ---------- Karte ---------- */
  .deck{position:relative;height:var(--card-h);margin:22px 0 20px}
  .card{position:absolute;inset:0;border-radius:var(--r-xl);overflow:hidden;
    background:var(--card-solid);border:1px solid var(--glass-line);
    box-shadow:inset 0 1px 0 var(--glass-hi), 0 30px 70px -26px rgba(0,0,0,.95);
    cursor:pointer;transform:translateZ(0);
    display:flex;flex-direction:column;touch-action:pan-y;user-select:none}
  .card.dragging{will-change:transform}
  .card.behind{transform:scale(.96) translateY(12px);opacity:.3;z-index:1}
  .card.front{z-index:2;animation:cardIn .45s var(--ease)}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .cover{position:relative;height:52%;min-height:180px;flex:0 0 auto;overflow:hidden;background:var(--surface-2)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(5,5,6,.55) 0%,rgba(5,5,6,.05) 30%,
      rgba(5,5,6,.62) 66%,rgba(5,5,6,.96) 100%)}
  .cover .catbadge,.cover .fict{position:absolute;top:18px;z-index:2;
    font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;font-weight:600}
  .cover .catbadge{left:20px;color:#fff}
  .cover .fict{right:20px;color:rgba(255,255,255,.5);text-align:right;max-width:58%}
  .fictadd{display:block;text-transform:none;letter-spacing:.02em;font-weight:400;
    font-size:.72rem;line-height:1.25;margin-top:3px;color:rgba(255,255,255,.42)}
  .ctitle{position:absolute;left:20px;right:20px;bottom:18px;z-index:2}
  .ctitle h2{font-size:clamp(1.6rem,6.6vw,2.1rem);line-height:1.04;margin:0 0 6px;color:#fff;
    letter-spacing:-.04em;font-weight:600}
  .ctitle .desc{margin:0;color:rgba(255,255,255,.72);font-size:.88rem;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cbody{padding:18px 20px 0;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
  .cbody .whyline{margin-top:auto;padding-bottom:2px}
  .cactions{display:flex;align-items:center;gap:4px;flex:0 0 auto;padding:16px 0 18px}
  .cactions button{background:none;border:0;padding:10px 8px;cursor:pointer;border-radius:99px;
    font-size:.86rem;font-weight:500;color:var(--text-mute);
    transition:color .18s,background .18s,opacity .18s}
  .cactions button:hover{color:var(--text-dim)}
  .cactions button:active{opacity:.55}
  .cactions .keep{margin-left:auto;background:var(--accent);color:var(--accent-ink);
    font-weight:600;padding:11px 24px;min-height:42px}
  .whyline{margin:14px 0 0;font-size:.88rem;color:var(--text-dim);line-height:1.5}
  .whyline .micro{display:inline-block;margin-right:9px;color:var(--text-mute)}
  .desc{color:var(--text-dim);font-size:.9rem}
  .meta{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px;align-items:center}
  .pill{font-size:.8rem;font-weight:500;color:var(--text-dim);background:none;border:0;padding:0}
  .pill.dist{color:var(--text);font-weight:600}
  .pill.open{color:var(--pos)}
  .pill.closed{color:var(--neg)}
  .pill.soon{color:var(--text);font-weight:600}
  .edate{font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    font-weight:600;color:#fff;opacity:.92;margin-bottom:9px}
  .why{margin-top:22px;padding:16px 0 2px;border-top:1px solid var(--line)}
  .why h3{font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    color:var(--text-mute);margin-bottom:8px;font-weight:600}

  .pact .btn{width:100%;justify-content:center;text-align:center;padding:12px 8px;

    background-repeat:no-repeat,no-repeat,repeat,repeat}

  /* Mondsteinweiß oben links, sanftes Beige unten rechts – diagonal ineinander. */
  html[data-thema="mondstein"]{background-image:linear-gradient(135deg, #f6f7f9 0%, #f2eee6 38%, #ece2d0 70%, #e4d6bd 100%);background-repeat:no-repeat}

    html:not([data-thema]){background-image:linear-gradient(135deg, #f6f7f9 0%, #f2eee6 38%, #ece2d0 70%, #e4d6bd 100%);background-repeat:no-repeat}
  }

  .themen .tn{font-size:.94rem;font-weight:600;letter-spacing:-.02em}
  .themen .td{display:block;font-size:.78rem;color:var(--text-dim);font-weight:400;margin-top:1px}

  /* ═══════════ Neon: Gitter, Glitch, Scanlines ═══════════
     Alles eigener Code, keine fremden Bilder. Bewegt wird ausschließlich
     über transform – das rechnet die Grafikeinheit, nicht der Hauptprozessor.
     Bei „Bewegung reduzieren" steht alles still (Regel ganz unten). */
  /* Kurzer Bildversatz beim Seitenwechsel */
  html[data-thema="neon"] .glitch{animation:glitch .42s ease-out 1}
  @keyframes glitch{
    0%  {transform:none;filter:none}
    12% {transform:translate3d(-3px,0,0);filter:drop-shadow(3px 0 #ff2e97) drop-shadow(-3px 0 #22e6ff)}
    26% {transform:translate3d(3px,0,0); filter:drop-shadow(-4px 0 #ff2e97) drop-shadow(4px 0 #22e6ff)}
    40% {transform:translate3d(-2px,0,0);filter:drop-shadow(2px 0 #ff2e97) drop-shadow(-2px 0 #22e6ff)}
    55% {transform:translate3d(1px,0,0); filter:drop-shadow(-1px 0 #ff2e97) drop-shadow(1px 0 #22e6ff)}
    70%,100%{transform:none;filter:none}}

  /* Feine Zeilen über den Bildern */
  html[data-thema="neon"] .cover::after,
  html[data-thema="neon"] .shero::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background-image:repeating-linear-gradient(to bottom,
      rgba(0,0,0,.26) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.55}

  /* Kanten leuchten beim Berühren */
  html[data-thema="neon"] .card:active{
    box-shadow:inset 0 1px 0 var(--glass-hi),0 0 0 1px rgba(255,59,167,.55),

  html[data-thema="neon"] .btn:active,
  html[data-thema="neon"] .chip:active,

    box-shadow:0 0 0 1px rgba(125,249,255,.6),0 0 20px -4px rgba(125,249,255,.5)}
  html[data-thema="neon"] .modebtn:active,
  html[data-thema="neon"] .geobtn:active{
    box-shadow:0 0 0 1px rgba(200,255,77,.6),0 0 18px -4px rgba(200,255,77,.5)}

  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

async function loadEvents(){
  try{
    const r = await fetch("events.json", { cache:"no-store" });
    if(r.ok){ const j = await r.json(); if(Array.isArray(j)) EVENTS = j; }
  }catch(e){ /* Grundbestand bleibt */ }

const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli",
                "August","September","Oktober","November","Dezember"];

function evDate(iso){ const d = new Date(iso); return isNaN(d) ? null : d; }
function evLabel(iso){
  const d = evDate(iso); if(!d) return "Termin unbekannt";
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const e = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((e - t) / 86400000);
  const uhr = d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
  if(days === 0) return "Heute, " + uhr + " Uhr";
  if(days === 1) return "Morgen, " + uhr + " Uhr";
  if(days > 1 && days < 7) return DAYS[d.getDay()] + ", " + uhr + " Uhr";
  return DAYS[d.getDay()] + ", " + d.getDate() + ". " + MONTHS[d.getMonth()] + ", " + uhr + " Uhr";
}
function evDaysUntil(iso){
  const d = evDate(iso); if(!d) return 999;
  return Math.max(0, (d.getTime() - Date.now()) / 86400000);
}
/* Manche Veranstaltungen laufen an mehreren Abenden – ein Theaterstück, eine Show,
   ein Zirkus. Elf einzelne Karten für dieselbe Sache wären unbrauchbar. Deshalb wird
   je Titel und Ort nur eine Karte gebaut; sie trägt den nächsten Termin und kennt
   alle weiteren. Wer an dem einen Abend nicht kann, findet die anderen im Detail. */
function serienBilden(liste){
  const gruppen = new Map();
  for(const e of liste){
    const k = norm(e.n) + "|" + norm(e.t);
    if(!gruppen.has(k)) gruppen.set(k, []);
    gruppen.get(k).push(e);
  }
  const out = [];
  for(const g of gruppen.values()){
    g.sort((a,b) => String(a.start).localeCompare(String(b.start)));
    const erste = { ...g[0] };
    erste.alle = g.map(x => x.start);
    out.push(erste);
  }
  return out;
}

function eventsAsPlaces(){
  const now = Date.now();
  const einzeln = EVENTS
    .filter(e => { const d = evDate(e.start); return d && d.getTime() > now - 3*3600*1000; })
    .map(e => {
      let lat=+e.lat, lon=+e.lon, approx=!!e.approx;
      /* Ist der Veranstaltungsort unter gleichem Namen aus OpenStreetMap geladen,
         wird dessen genaue Lage übernommen. */
      if(approx && e.v){
        const hit = S.places.find(x => norm(x.n) && norm(e.v).includes(norm(x.n)) && norm(x.n).length>4);
        if(hit){ lat=hit.lat; lon=hit.lon; approx=false; }
      }
      return { n:e.t, c:"event", lat, lon, oh:"", approx,
               t:e.v || "", start:e.start, url:e.u || "", tk:e.tk || "",
               src:e.src || "", adr:"" };
    });
  return serienBilden(einzeln);
}

/* Wohin führt ein Verweis? Wer auf „Tickets“ tippt, verlässt Radiux und landet bei
   einem fremden Anbieter. Das gehört sichtbar dazugeschrieben – nicht weil ein Gesetz
   es Wort für Wort verlangt, sondern weil sonst der Eindruck entstünde, Radiux verkaufe
   selbst. Genau dieser Eindruck wäre das Problem (§ 5a UWG). */
function ziel(u){
  try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; }
}

/* Läuft diese Veranstaltung an mehr als einem Abend? */
function istSerie(p){ return Array.isArray(p.alle) && p.alle.length > 1; }

/* ---------- Neutrale Fläche, falls kein Foto vorliegt ---------- */
function hashOf(x){ let h=2166136261; for(let i=0;i<x.length;i++){ h^=x.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

/* Liest eine Farbe aus der aktuellen Farbwelt, damit die Ersatzflaeche dazu passt. */
function cssFarbe(name, ersatz){
  try{
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || ersatz;
  }catch(e){ return ersatz; }
}
function plate(name, cat, w, h){
  const label = esc(String(CATMAP[cat] || "Ort").toUpperCase());
  const id = "p" + (hashOf(name + cat) % 9999);
  const fs = Math.round(h * 0.115);
  const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`
    + `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">`
    + `<stop offset="0" stop-color="${cssFarbe("--surface-3","#1d1d1e")}"/>`
    + `<stop offset="1" stop-color="${cssFarbe("--surface","#0d0d0e")}"/></linearGradient></defs>`
    + `<rect width="${w}" height="${h}" fill="url(#${id})"/>`
    + `<text x="${w/2}" y="${h/2}" fill="${cssFarbe("--text","#ffffff")}" fill-opacity="0.13"`
    + ` font-family="system-ui,-apple-system,sans-serif" font-size="${fs}" font-weight="600"`
    + ` letter-spacing="${Math.round(fs*0.16)}" text-anchor="middle" dominant-baseline="central">${label}</text>`
    + `</svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.replace(/\s+/g," "));
}

/* ---------- Bilder ----------------------------------------------------
   Alle Bilder liegen neben der index.html. Lizenz: Pexels License, freie
   kommerzielle Nutzung.

   Die Zuordnung folgt seit dieser Fassung dem Namensschema und nicht mehr
   einer festen Liste im Quelltext. Damit lassen sich Bilder austauschen,
   ergänzen oder weglassen, ohne dass am Code etwas geändert werden muss.

     ort-<ort>.jpg        gehört zu genau einem Ort des Startbestands
     kat-<kategorie>-N.jpg  steht für eine ganze Kategorie, N ab 1

   Gefunden wird das erste Bild, das sich laden lässt: erst das Ortsbild,
   dann die Kategoriebilder, zuletzt eine im Gerät gezeichnete Fläche.
   Ein fehlendes Bild ist deshalb kein Fehler, sondern ein Schritt weiter
   in derselben Kette. ------------------------------------------------ */

/* Wie viele Varianten je Kategorie höchstens gesucht werden. Höher heißt
   nur: mehr Bilder möglich, dafür beim ersten Laden ein paar vergebliche
   Anfragen. Sechs ist ein guter Mittelwert. */
const KAT_MAX = 5;

/* Zweitschreibweisen, die trotzdem gefunden werden sollen. */
const KAT_ALIAS = { sehenswuerdigkeit: "sehenswuerdigkeiten" };

/* Die Ortsbilder des Startbestands. Der Dateiname folgt nicht überall
   stur dem Ortsnamen – „Zoo Magdeburg“ heißt als Datei nur ort-zoo.jpg.
   Deshalb steht die Zuordnung hier ausgeschrieben. Alles, was hier nicht
   steht, bekommt seinen Namen automatisch. */
const ORT_BILD = {
  "Magdeburger Dom":               "magdeburger-dom",
  "Grüne Zitadelle von Magdeburg": "gruene-zitadelle",
  "Kloster Unser Lieben Frauen":   "kloster-unser-lieben-frauen",
  "Kulturhistorisches Museum":     "kulturhistorisches-museum",

  "Elbauenpark":                   "elbauenpark",
  "Jahrtausendturm":               "jahrtausendturm",
  "Klosterbergegarten":            "klosterbergegarten",
  "Rotehornpark":                  "rotehornpark",
  "Herrenkrugpark":                "herrenkrugpark",
  "Elbuferpromenade":              "elbuferpromenade",
  "Zoo Magdeburg":                 "zoo",
  "Gruson-Gewächshäuser":          "gruson-gewaechshaeuser",
  "Opernhaus Magdeburg":           "opernhaus",
  "Puppentheater Magdeburg":       "puppentheater",
  "Festung Mark":                  "festung-mark",
  "Hasselbachplatz":               "hasselbachplatz",
  "Allee-Center Magdeburg":        "allee-center",
  "Hauptbahnhof Magdeburg":        "hauptbahnhof",
  "Otto-von-Guericke-Universität": "universitaet",
  "Wissenschaftshafen":            "wissenschaftshafen",
  "Sternbrücke":                   "sternbruecke",
  "Schiffshebewerk Rothensee":     "schiffshebewerk"
};

/* Orte, von denen eigene Aufnahmen vorliegen. Nur diese dürfen „Foto“
   heißen. Ein Bild aus einer Bilddatenbank bleibt ein Symbolbild, auch
   wenn die Datei nach dem Ort benannt ist – es zeigt eben irgendeinen
   Dom und nicht den Magdeburger. Etwas anderes zu behaupten wäre eine
   irreführende Angabe nach § 5 UWG. */
const EIGENE_FOTOS = [];

/* ---------- Welches Motiv passt? ----------------------------------------
   „Sehenswürdigkeit“ ist eine weite Kategorie: Sie enthält Kirchen, Brücken,
   Denkmäler – und den Domfelsen, ein Stück Gestein in der Elbe. Ein zufälliges
   Bild aus dieser Kategorie kann dort gründlich danebenliegen.

   Was im Namen steht, sagt darüber oft mehr aus als die Kategorie. Diese
   Liste liest den Namen und wählt danach den Bildbestand – aber nur bei den
   drei weiten Kategorien. Bei einem Café oder einem Museum ist die Kategorie
   bereits die beste Auskunft, dort wird nichts umgelenkt.

   Es bleibt ein Symbolbild. Diese Regel verhindert grobe Fehlgriffe; sie
   kann nicht dafür sorgen, dass das Bild den Ort zeigt. ------------------ */
const MOTIV_WEIT = ["sehenswuerdigkeit", "alltag", "erleben"];
const MOTIV = [
  /* Erst das Eindeutige: Namen, die für sich selbst sprechen. */
  [/bahnhof|haltestelle|stra(ss|ß)enbahn|tankstelle|rathaus|bibliothek/i,        "alltag"],
  [/universit|hochschule|campus|\bschule\b|institut|fakult/i,                    "alltag"],
  [/stadion|arena|\bhalle\b|schwimm|sportplatz|kletter|\bbad\b|therme/i,          "erleben"],
  [/markt(?!platz\s*der)|center\b|passage|kaufhaus|einkaufszentrum/i,            "einkaufen"],
  /* Bauwerke */
  [/br(ue|ü)cke|\bsteg\b|(ue|ü)berf(ue|ü)hrung|viadukt/i,                        "sehenswuerdigkeit"],
  [/kirche|\bdom\b|kloster|kathedrale|kapelle|m(ue|ü)nster|abtei|synagoge/i,     "sehenswuerdigkeit"],
  [/turm|\btor\b|\bfestung\b|\bburg\b|schloss|denkmal|mahnmal|gedenk|palais/i,   "sehenswuerdigkeit"],
  [/schiffshebewerk|schleuse|werft|wasserstra(ss|ß)e|leuchtturm/i,               "sehenswuerdigkeit"],
  /* Natur und Wasser */
  [/fels|klippe|steinbruch|geschiebe/i,                                        "park"],
  [/ufer|promenade|\belbe\b|strand|anleger|bootsh|hafen(?!bahn)/i,             "park"],
  [/\bsee\b|\bseen\b|teich|weiher|\binsel|werder\b|\baue\b|\bauen\b/i,          "park"],
  [/park\b|garten|g(ae|ä)rten|allee\b|\bwald|wiese|friedhof|gr(ue|ü)nzug/i,      "park"]
];

/* „Veranstaltungen" passt auf schmalen Geräten nicht in einen Drittel-Reiter.
   Ein weiches Trennzeichen gibt dem Browser eine Stelle zum Umbrechen; steht
   genug Platz zur Verfügung, ist davon nichts zu sehen. Auf die automatische
   Silbentrennung ist kein Verlass – nicht jeder Browser bringt ein deutsches
   Trennwörterbuch mit. */
function trennbar(t){ return t.replace(/^Veranstal/, "Veranstal&shy;"); }

/* Aus welchem Bildbestand wird gewählt? */
function bildKat(p){
  const c = p.c || "alltag";
  if(!MOTIV_WEIT.includes(c)) return c;
  for(const [muster, ziel] of MOTIV) if(muster.test(p.n || "")) return ziel;
  return c;
}

function bildSlug(x){ return norm(x).replace(/ /g,"-"); }

/* Welche Bilddateien es nicht gibt, merkt sich die App für die Dauer des
   Besuchs. Dadurch läuft jede vergebliche Anfrage höchstens einmal – danach
   wird die Datei gar nicht mehr angefragt. Nichts davon wird gespeichert;
   beim nächsten Öffnen fängt die Liste wieder leer an. */
const BILD_FEHLT = new Set();

/* Alle Bildadressen, die für diesen Ort in Frage kommen – in der Reihenfolge,
   in der sie ausprobiert werden. */
function bildKandidaten(p){
  const cat = bildKat(p);
  const out = [];
  /* Ein eigenes Ortsbild kommt nur für Orte in Frage, nicht für Veranstaltungen –
     „ort-mono-inc-open-air-2026.jpg“ wird es nie geben. */
  if(cat !== "event"){
    const ort = ORT_BILD[p.n] || bildSlug(p.n);
    if(ort) out.push("ort-" + ort + ".jpg");
  }
  /* Damit nicht alle Restaurants dasselbe Bild tragen, hängt der Startpunkt
     am Namen. Von dort wird im Kreis weitergesucht. */
  const start = hashOf(p.n + cat) % KAT_MAX;
  for(let i=0;i<KAT_MAX;i++) out.push("kat-" + cat + "-" + ((start+i)%KAT_MAX + 1) + ".jpg");
  /* Schreibweisen, die naheliegend sind, aber nicht dem Schema entsprechen –
     etwa die Mehrzahl bei „Sehenswürdigkeiten“. Sie stehen hinten in der Kette:
     Wer sich an das Schema hält, merkt nichts davon; wer sich vertut, bekommt
     trotzdem sein Bild. Ein Fehlversuch je Kategorie und Besuch, mehr nicht. */
  const auch = KAT_ALIAS[cat];
  if(auch) for(let i=0;i<KAT_MAX;i++) out.push("kat-" + auch + "-" + ((start+i)%KAT_MAX + 1) + ".jpg");
  const uebrig = out.filter(f => !BILD_FEHLT.has(f));
  return uebrig.length ? uebrig : out.slice(-1);
}

function media(p, w, h, cls){
  const kand = bildKandidaten(p);
  const alt = EIGENE_FOTOS.includes(p.n)
    ? "Foto von " + p.n
    : `Symbolbild für die Kategorie ${CATMAP[p.c]||"Ort"} – zeigt nicht den Ort selbst`;
  return `<img src="${encodeURI(kand[0])}" alt="${esc(alt)}" loading="lazy" decoding="async"
    data-kand="${esc(kand.join("|"))}" data-i="0"
    data-n="${esc(p.n)}" data-c="${esc(p.c)}" data-w="${w}" data-h="${h}"
    onerror="imgFallback(this)"${cls?` class="${cls}"`:""}>`;
}

/* Ein Bild ließ sich nicht laden – das nächste aus der Kette versuchen.
   Ist die Kette zu Ende, wird eine Fläche im Gerät gezeichnet. */
function imgFallback(img){
  const kand = (img.dataset.kand||"").split("|").filter(Boolean);
  let i = (+img.dataset.i||0);
  if(kand[i]) BILD_FEHLT.add(kand[i]);
  i += 1;
  if(i < kand.length){
    img.dataset.i = i;
    img.src = encodeURI(kand[i]);
    return;
  }
  img.onerror = null;
  img.src = plate(img.dataset.n, img.dataset.c, +img.dataset.w||600, +img.dataset.h||400);
  const badge = img.parentElement && img.parentElement.querySelector(".fict");
  if(badge) badge.textContent = "Illustration";
}

function badgeFor(p){
  return EIGENE_FOTOS.includes(p.n) ? "Foto" : "Symbolbild";
}
/* Der Zusatz, der aus der Kennzeichnung erst eine Auskunft macht. „Symbolbild“
   allein versteht nicht jeder – der Klammerzusatz sagt es in Worten. Bei
   eigenen Aufnahmen entfällt er, dort stimmt das Bild ja. */
function badgeZusatz(p){
  return EIGENE_FOTOS.includes(p.n) ? "" : "kein echtes Foto der Gegend";
}

const store = {
  ok:(()=>{ try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return true; }catch(e){ return false; } })(),
  P:"radiux.", OLD:"radius.",
  get(k,d){ if(!this.ok) return d; try{ const v=localStorage.getItem(this.P+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ if(!this.ok) return; try{ localStorage.setItem(this.P+k,JSON.stringify(v)); }catch(e){} },
  clear(){ if(!this.ok) return;
    Object.keys(localStorage).filter(k=>k.startsWith(this.P)||k.startsWith(this.OLD))
      .forEach(k=>localStorage.removeItem(k)); },
  /* Fruehere Fassungen hiessen noch "Radius". Wer damals etwas gemerkt hat,
     soll es nach der Umbenennung nicht verlieren - einmalig uebernehmen. */
  migrate(){ if(!this.ok) return;
    try{
      Object.keys(localStorage).filter(k=>k.startsWith(this.OLD)).forEach(k=>{
        const neu = this.P + k.slice(this.OLD.length);
        if(localStorage.getItem(neu)===null) localStorage.setItem(neu, localStorage.getItem(k));
        localStorage.removeItem(k);
      });
    }catch(e){}
  }
};

function dist(a,b){
  const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const fmtDist = m => m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const fmtRad  = m => m<1000 ? m+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const walkMin = m => Math.max(1, Math.round(m/80));
const walkTxt = m => { const n=walkMin(m); return n===1 ? "1 Minute" : n+" Minuten"; };

/* ---------- Öffnungszeiten ------------------------------------------------
   OpenStreetMap speichert Öffnungszeiten in einer eigenen Schreibweise:
   „Mo 11:00-15:30,19:00-24:00; Tu 11:00-13:00; We 06:30-22:00“. Das ist für
   Maschinen gedacht und für Menschen mühsam – erst recht, weil die Wochentage
   englisch abgekürzt sind.

   ohParse zerlegt die Angabe einmal sauber. Davon leben beide Anzeigen: die
   Zeile „Jetzt geöffnet“ und die ausgeschriebene Liste in der Detailansicht.
   Was sich nicht sicher deuten lässt – Monatsangaben, Sonnenauf- und
   -untergang, Feiertagsregeln –, wird nicht geraten, sondern unverändert
   stehen gelassen. Eine falsche Öffnungszeit ist schlimmer als eine
   unbequeme. ------------------------------------------------------------ */

const TAG_KURZ = ["Mo","Tu","We","Th","Fr","Sa","Su"];   /* wie in OpenStreetMap */
const TAG_LANG = ["Montag","Dienstag","Mittwoch","Donnerstag",
                  "Freitag","Samstag","Sonntag"];

function ohParse(oh){
  const roh = String(oh || "").trim();
  if(!roh) return null;
  const erg = { tage: [null,null,null,null,null,null,null], durchgehend:false, ok:true };

  if(/^24\/7$/i.test(roh)){
    erg.durchgehend = true;
    for(let i=0;i<7;i++) erg.tage[i] = [{von:0, bis:1440}];
    return erg;
  }

  for(let regel of roh.split(";")){
    regel = regel.trim();
    if(!regel) continue;
    /* Anmerkungen in Anführungszeichen tragen keine Zeit – aber sie zeigen an,
       dass hier mehr steht, als die Liste wiedergeben kann. */
    if(/"/.test(regel)){ erg.ok = false; continue; }

    const m = regel.match(/^([A-Za-z]{2}(?:\s*[-,]\s*[A-Za-z]{2})*)?\s*(.*)$/);
    if(!m){ erg.ok = false; continue; }
    const tagTeil  = (m[1] || "").trim();
    const zeitTeil = (m[2] || "").trim();

    /* Welche Tage sind gemeint? Ohne Angabe: alle. */
    let tage = [];
    if(!tagTeil){
      tage = [0,1,2,3,4,5,6];
    } else {
      for(const tok of tagTeil.split(",")){
        const t = tok.trim();
        if(t.includes("-")){
          const [a,b] = t.split("-").map(x=>x.trim());
          const ia = TAG_KURZ.indexOf(a), ib = TAG_KURZ.indexOf(b);
          if(ia<0 || ib<0){ erg.ok = false; continue; }
          if(ia<=ib) for(let i=ia;i<=ib;i++) tage.push(i);
          else { for(let i=ia;i<7;i++) tage.push(i); for(let i=0;i<=ib;i++) tage.push(i); }
        } else {
          const i = TAG_KURZ.indexOf(t);
          if(i<0){ erg.ok = false; continue; }   /* PH, SH und anderes */
          tage.push(i);
        }
      }
    }
    if(!tage.length) continue;

    if(/^(off|closed)$/i.test(zeitTeil)){
      tage.forEach(i => { erg.tage[i] = []; });
      continue;
    }

    const spannen = [];
    let sauber = true;
    for(const st of zeitTeil.split(",")){
      const z = st.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
      if(!z){ sauber = false; break; }
      const von = +z[1]*60 + +z[2];
      let  bis = +z[3]*60 + +z[4];
      if(bis <= von) bis += 1440;              /* über Mitternacht */
      spannen.push({von, bis});
    }
    if(!sauber || !spannen.length){ erg.ok = false; continue; }
    tage.forEach(i => { erg.tage[i] = spannen; });
  }

  if(erg.tage.every(t => t === null)) return null;
  return erg;
}

function uhr(m){
  m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
}
/* Für das Ende einer Spanne: Mitternacht heißt „24:00“ und nicht „00:00“ –
   sonst liest sich „19:00–00:00“ wie eine Zeitreise. */
function uhrEnde(m){ return (m > 0 && m % 1440 === 0) ? "24:00" : uhr(m); }

/* Ausgeschriebene Liste für die Detailansicht. */
function ohListe(oh){
  const p = ohParse(oh);
  if(!p) return "";
  if(p.durchgehend) return `<p class="ohzeile" style="margin:0">Durchgehend geöffnet, Tag und Nacht.</p>`;
  const zeilen = p.tage.map((spannen,i)=>{
    const heute = (new Date().getDay() + 6) % 7 === i;   /* Sonntag ist in JS die 0 */
    let text;
    if(spannen === null) text = "keine Angabe";
    else if(!spannen.length) text = "geschlossen";
    else text = spannen.map(s => uhr(s.von) + "–" + uhrEnde(s.bis)
        + (s.bis > 1440 ? " (am Folgetag)" : "")).join(", ");
    return `<li${heute ? ' class="heute"' : ''}>
      <span class="tag">${TAG_LANG[i]}</span><span class="zeit">${esc(text)}</span></li>`;
  }).join("");
  return `<ul class="ohliste">${zeilen}</ul>${p.ok ? "" :
    `<p class="ohrest">Zu diesen Zeiten gibt es in OpenStreetMap weitere Angaben,
     etwa zu Feiertagen oder einzelnen Monaten. Sie stehen unverändert darunter,
     weil eine geratene Übersetzung schlechter wäre als gar keine.</p>
     <p class="ohroh">${esc(String(oh))}</p>`}`;
}

function openState(oh){
  const p = ohParse(oh);
  if(!p) return {s:"unknown", t:"Zeiten unbekannt"};
  if(p.durchgehend) return {s:"open", t:"Durchgehend offen"};
  const now = new Date();
  const heute = (now.getDay() + 6) % 7;
  const gestern = (heute + 6) % 7;
  const min = now.getHours()*60 + now.getMinutes();
  const auf = (spannen, m) => !!spannen && spannen.some(s => m >= s.von && m < s.bis);
  /* Auch der Vortag zählt, solange seine Zeit über Mitternacht reicht. */
  if(auf(p.tage[heute], min) || auf(p.tage[gestern], min + 1440))
    return {s:"open", t:"Jetzt geöffnet"};
  if(p.tage[heute] === null && p.tage[gestern] === null)
    return {s:"unknown", t:"Zeiten unbekannt"};
  return {s:"closed", t:"Jetzt geschlossen"};
}


/* ---------------- Suche ----------------
   Sucht im geladenen Ortsbestand. Suchbegriffe werden nicht gespeichert
   und fließen nicht in das Interessenprofil ein.
   Begriffe mit Gesundheitsbezug werden abgewiesen – siehe Blueprint 9.4. */
const BLOCKED_TERMS = ["apothek","arzt","aerzt","ärzt","doktor","klinik","krankenhaus",
  "zahnarzt","hausarzt","facharzt","praxis","therap","psycho","physio","sanitaets",
  "sanitäts","pflegeheim","notaufnahme","rezept","medizin"];

function norm(x){
  return String(x||"").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
}
function queryBlocked(q){
  const n = norm(q);
  return n.length >= 3 && BLOCKED_TERMS.some(t => n.includes(norm(t)));
}
function matches(p, q){
  const n = norm(q);
  if(!n) return true;
  const hay = norm(`${p.n} ${p.t||""} ${p.adr||""} ${CATMAP[p.c]||""}`);
  return n.split(" ").every(w => hay.includes(w));
}

/* ---------------- Empfehlungslogik ---------------- */
const W = { dist:0.40, interest:0.30, open:0.20, info:0.10 };

function score(p){
  const sd = Math.max(0, 1 - p._d / Math.max(S.radius,1));
  if(p.start){
    const days = evDaysUntil(p.start);
    const st = Math.max(0, 1 - days/28);
    if(!S.profilAn) return 0.53*st + 0.35*sd + 0.12*(p.t?1:0);
    const prof0 = S.profile.event || 0;
    const maxP0 = Math.max(1, ...Object.values(S.profile).map(Math.abs));
    const si0 = Math.max(0, Math.min(1, (prof0/maxP0 + 1)/2));
    return 0.45*st + 0.30*sd + 0.15*si0 + 0.10*(p.t?1:0);
  }
  const os = p._o.s==="open" ? 1 : p._o.s==="unknown" ? 0.5 : 0.05;
  const inf = (p.oh?0.5:0) + (p.t?0.5:0);
  /* Ist die Anpassung aus, gibt es kein Interesse zu gewichten. Die 30 Prozent
     gehen dann an Nähe und Öffnungsstatus – die Reihenfolge bleibt erklärbar. */
  if(!S.profilAn) return 0.55*sd + 0.32*os + 0.13*inf;
  const prof = S.profile[p.c] || 0;
  const maxProf = Math.max(1, ...Object.values(S.profile).map(Math.abs));
  const si = Math.max(0, Math.min(1, (prof/maxProf + 1)/2));
  return W.dist*sd + W.interest*si + W.open*os + W.info*inf;
}

/* ---------------- „Überrasch mich“ ----------------
   Radiux hat keinen Assistenten, der jemanden überraschen könnte. Was es aber
   kann, ist die eigene Rangfolge bewusst umzudrehen: Was die normale Sortierung
   nach oben schiebt – nah, geöffnet, passt zu den bisherigen Vorlieben –, wird
   hier gerade nicht bevorzugt.
   Die Regel lautet: seltene Kategorien vor häufigen, Unbekanntes vor Gemerktem,
   geschlossene Orte bleiben trotzdem hinten. Innerhalb gleich bewerteter Orte
   entscheidet der Zufall, damit zweimal Antippen nicht dieselbe Reihe ergibt. */
function ueberraschen(list){
  if(list.length < 2) return list;
  /* Wie oft kommt jede Kategorie in der aktuellen Liste vor? */
  const haeufig = {};
  list.forEach(p => { haeufig[p.c] = (haeufig[p.c] || 0) + 1; });
  const maxH = Math.max(1, ...Object.values(haeufig));
  const maxProf = Math.max(1, ...Object.values(S.profile).map(Math.abs));

  return list.map(p => {
    /* selten = überraschend */
    const selten = 1 - (haeufig[p.c] || 1) / maxH;
    /* Kategorien, die bisher oft gemerkt wurden, sind gerade nicht überraschend */
    const prof = S.profile[p.c] || 0;
    const fremd = Math.max(0, Math.min(1, (1 - prof / maxProf) / 2));
    /* Schon Gemerktes kennt man bereits */
    const neu = isSaved(p.n) ? 0 : 1;
    /* Ein Ort mit Beschreibung lohnt die Überraschung eher */
    const erklaert = p.i ? 1 : p.t || p.art ? 0.5 : 0;
    /* Geschlossenes bleibt hinten – eine Überraschung vor verschlossener Tür ist keine */
    const offen = p._o.s === "closed" ? 0 : 1;
    const u = offen * (0.34*selten + 0.26*fremd + 0.22*neu + 0.18*erklaert)
            + Math.random() * 0.28;
    return { p, u: offen ? u : u - 1 };
  }).sort((a,b) => b.u - a.u).map(x => x.p);
}

function reasons(p){
  if(S.mode==="ueberrasch" && !p.start){
    const o = [`Zufallsvorschlag aus „${CATMAP[p.c]||"Ort"}“ – in diesem Vorhaben zählt nicht die Nähe`,
               `${fmtDist(p._d)} entfernt – etwa ${walkTxt(p._d)} zu Fuß`];
    const prof = S.profile[p.c] || 0;
    o.push(prof > 0
      ? `„${CATMAP[p.c]}“ hast du schon gemerkt – hier steht es trotzdem weiter hinten`
      : `„${CATMAP[p.c]}“ hast du bisher selten gewählt – deshalb dieser Vorschlag`);
    if(p._o.s==="closed") o.push("Hat gerade geschlossen – deshalb weiter unten");
    if(p.i) o.push("Beschreibung vorhanden – tippen für Details");
    o.push("Kein Assistent, keine Auswertung: Radiux dreht hier nur seine eigene Rangfolge um");
    return o;
  }
  if(p.start){
    const days = Math.round(evDaysUntil(p.start));
    const o = [evLabel(p.start)];
    o.push(days <= 0 ? "Findet heute statt" : days === 1 ? "Findet morgen statt" : `In ${days} Tagen`);
    o.push(p.approx
      ? `${p.t ? p.t + " · " : ""}Lage noch nicht bekannt – Entfernung fließt nicht in die Reihenfolge ein`
      : `${p.t ? p.t + " · " : ""}${fmtDist(p._d)} entfernt`);
    if(p.src) o.push(`Angabe laut ${p.src} – bitte beim Veranstalter prüfen`);
    return o;
  }
  const out=[`${fmtDist(p._d)} entfernt – etwa ${walkTxt(p._d)} zu Fuß`];
  if(p.i) out.push("Beschreibung vorhanden – tippen für Details");
  if(p._o.s==="open") out.push("Hat aktuell geöffnet");
  else if(p._o.s==="closed") out.push("Hat gerade geschlossen – deshalb weiter unten");
  else out.push("Öffnungszeiten liegen nicht vor – neutral bewertet");
  if(!S.profilAn){
    out.push("Die Anpassung an deine Entscheidungen ist ausgeschaltet – sortiert wird "
      + "nach Nähe und Öffnungszeit");
    return out;
  }
  const prof=S.profile[p.c]||0;
  if(prof>0) out.push(`Passt zu „${CATMAP[p.c]}“ – ${prof===1?"einmal":prof+"-mal"} gemerkt`);
  else if(prof<0) out.push(`„${CATMAP[p.c]}“ hast du bisher eher ausgeblendet`);
  else out.push(`„${CATMAP[p.c]}“ – noch keine Vorlieben hinterlegt`);
  return out;
}


/* ---------------- Was für ein Ort ist das? ----------------
   OpenStreetMap beschreibt jeden Ort mit Merkmalen. Bisher hat Radiux daraus nur
   eine grobe Kategorie gemacht – auf der Karte stand dann „Sehenswürdigkeit" und

/* Reihenfolge: das Genaueste zuerst. */
function artOf(t){
  const kette = [t.artwork_type, t.historic, t.man_made, t.natural, t.sport,
                 t.tourism, t.amenity, t.leisure, t.shop];
  for(const k of kette){ if(k && ART[k]) return ART[k]; }
  for(const k of kette){ if(k) return String(k).replace(/_/g," "); }
  return "";
}

/* Kurzbeschreibung aus dem, was OpenStreetMap hergibt. */
function beschreibung(t){
  const art = artOf(t);
  const zus = [];
  if(t.artist_name) zus.push("von " + t.artist_name);
  if(t.start_date && /^\d{3,4}/.test(t.start_date)) zus.push("seit " + t.start_date.slice(0,4));
  if(t.material && !t.artwork_type) {} else if(t.material) zus.push("aus " + t.material.replace(/_/g," "));
  const kopf = [art, zus.join(", ")].filter(Boolean).join(" · ");
  const frei = t["description:de"] || t.description || t.inscription || "";
  if(frei && kopf) return kopf + " – " + frei;
  return frei || kopf;
}

/* ---------------- Datenaufbereitung ---------------- */
function catOf(tags){
  const vals=[tags.amenity,tags.tourism,tags.leisure,tags.shop,
              tags.historic,tags.man_made,tags.natural,tags.sport].filter(Boolean);
  for(const c of CATS) if(vals.some(v=>c.m.includes(v))) return c.k;
  return null;
}
function allowed(tags){
  if(tags.healthcare) return false;
  if(BLOCKED_SHOP.includes(tags.shop)) return false;
  if(tags.adult === "yes" || tags["min_age"]) return false;
  if(BLOCKED_AMENITY.includes(tags.amenity))
    return !!tags.tourism && tags.amenity!=="pharmacy" && tags.amenity!=="doctors";
  return true;
}
/* Wie prepare(), aber ohne den Reiter-Filter – damit die Zähler an den Reitern
   nicht von der gerade gewählten Auswahl abhängen. */
function prepareRoh(){
  const merk = S.evFilter; S.evFilter = "alle";
  try { return prepare(); } finally { S.evFilter = merk; }
}

function prepare(){
  const raw=S.places.concat(eventsAsPlaces()).map(p=>({...p}));
  const ref = bezug();
  raw.forEach(p=>{ p._d=dist(ref,p);
    p._o = p.start ? { s:"soon", t:evLabel(p.start) } : openState(p.oh); });
  const cats = S.activeCats.length ? S.activeCats : CATS.map(c=>c.k);
  const q = S.q.trim();
  if(q && queryBlocked(q)) return [];
  /* Bei aktiver Suche gelten weder Umkreis noch Kategorie- oder Vorhaben-Filter –
     wer einen Namen eingibt, will diesen Ort finden, egal in welchem Vorhaben er steckt. */
  const fern = istFern();
  let list = raw.filter(p => (q || fern)
    ? ((q ? matches(p,q) : cats.includes(p.c)) && !S.hidden.includes(p.n))
    : (p._d<=S.radius && cats.includes(p.c) && !S.hidden.includes(p.n)));
  list.forEach(p=>{ p._s=score(p); });
  list.sort((a,b)=>b._s-a._s);
  if(S.mode==="ueberrasch") list = ueberraschen(list);
  /* Reiter im Vorhaben „Was ist los?“ – wer an einem Abend nicht kann, sucht
     gezielt nach dem, was mehrmals läuft; wer nur diesen einen Abend hat, nach
     dem Gegenteil. Beides ist derselbe Bestand, nur anders gefiltert. */
  if(S.mode==="event" && S.evFilter!=="alle")
    list = list.filter(p => S.evFilter==="serie" ? istSerie(p) : !istSerie(p));
  return list;
}

/* ---------------- OpenStreetMap ---------------- */
const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"
];

async function loadLive(){
  if(S.loading) return;
  S.loading=true; say("Orte werden geladen …"); render();
  /* Radiux kennt bisher nur Magdeburg. Wer von außerhalb lädt, bekäme sonst ein
     leeres Ergebnis – deshalb wird in dem Fall um die Stadtmitte herum geladen. */
  const far = istFern();
  const c = bezug();
  const r=Math.max(S.radius,4000)/111000;
  /* Das abgefragte Rechteck wird auf ein festes Raster von etwa zwei Kilometern
     gerundet, bevor es das Gerät verlässt. Der Kartendienst erfährt dadurch das
     Stadtviertel, nicht den Standort: Wer im selben Viertel steht, erzeugt
     dieselbe Anfrage. Die genaue Position bleibt im Gerät und wird nur dort für
     Entfernungen benutzt. Kostet nichts – die Antwort wird ohnehin lokal
     gefiltert. */
  const RASTER = 0.02;                       /* rund 2,2 km */
  const ab = (x, auf) => (auf ? Math.ceil(x/RASTER) : Math.floor(x/RASTER)) * RASTER;
  const bb=[ab(c.lat-r,false), ab(c.lon-r*1.6,false), ab(c.lat+r,true), ab(c.lon+r*1.6,true)]
    .map(n=>n.toFixed(2)).join(",");
  if(far) say("Du bist weit von Magdeburg entfernt – Radiux lädt die Orte der Stadtmitte.");
  const q=`[out:json][timeout:90];(
    nwr(${bb})["amenity"~"^(restaurant|cafe|bar|pub|fast_food|ice_cream|biergarten|theatre|cinema|arts_centre|library|nightclub|fuel|events_venue|community_centre|music_venue|marketplace|food_court|university|college|public_bath)$"]["name"];
    nwr(${bb})["tourism"~"^(attraction|museum|artwork|viewpoint|gallery|zoo|theme_park|aquarium|picnic_site)$"]["name"];
    nwr(${bb})["leisure"~"^(park|fitness_centre|sports_centre|swimming_pool|garden|dance|escape_game|bowling_alley|water_park|beach_resort|marina|sauna|miniature_golf|horse_riding|sports_hall|nature_reserve)$"]["name"];
    nwr(${bb})["historic"~"^(monument|castle|city_gate|ruins|tower)$"]["name"];
    nwr(${bb})["man_made"~"^(tower|water_tower|lighthouse)$"]["name"];
    nwr(${bb})["natural"="beach"]["name"];
    nwr(${bb})["sport"~"^(climbing|skateboard)$"]["name"];
    nwr(${bb})["shop"~"^(supermarket|mall|bakery|books|clothes|greengrocer|music|second_hand|charity|video_games)$"]["name"];
  );out center 2000;`;

  let lastErr="unbekannter Fehler";
  for(const url of OVERPASS){
    try{
      const res=await fetch(url,{ method:"POST",
        body:"data="+encodeURIComponent(q),
        headers:{"Content-Type":"application/x-www-form-urlencoded"} });
      if(!res.ok){ lastErr="Server antwortete mit Code "+res.status; continue; }
      const j=await res.json();
      const seen=new Set(), out=[];
      for(const el of (j.elements||[])){
        const t=el.tags||{};
        const lat = el.lat!=null ? el.lat : (el.center ? el.center.lat : null);
        const lon = el.lon!=null ? el.lon : (el.center ? el.center.lon : null);
        if(!t.name || lat==null || lon==null || !allowed(t)) continue;
        const c=catOf(t); if(!c) continue;
        const key=t.name+"|"+c; if(seen.has(key)) continue; seen.add(key);
        const wp = t.wikipedia || t["wikipedia:de"] || "";
        out.push({ n:t.name, c, lat, lon, oh:t.opening_hours||"",
          t: beschreibung(t) || (t.cuisine ? t.cuisine.replace(/[_;]/g," ") : ""),
          art: artOf(t),
          osm: (el.type||"node") + "/" + el.id,
          wp: wp ? "https://de.wikipedia.org/wiki/" + encodeURIComponent(wp.replace(/^de:/,"")) : "",
          adr:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" "),
          web:t.website||t["contact:website"]||"",
          tel:t.phone||t["contact:phone"]||"",
          wc:t.wheelchair||"" });
      }
      if(out.length){
        S.places=out; S.loaded=true;
        S.dataSource="OpenStreetMap, "+out.length+" Orte";
        say(out.length+" Orte aus OpenStreetMap geladen.");
        S.loading=false; S.idx=0; render(); return;
      }
      lastErr="Antwort enthielt keine passenden Orte";
    }catch(e){ lastErr = e && e.message ? e.message : "Verbindung fehlgeschlagen"; }
  }
  S.dataSource="Startbestand – Abruf fehlgeschlagen";
  say("Abruf nicht möglich: "+lastErr);
  S.loading=false; render();
}

/* Der Browser fragt beim ersten Mal selbst nach – aber erst, nachdem Radiux
   erklärt hat, was passiert. Eine Einwilligung, die erst im Systemdialog des
   Browsers erklärt wird, ist keine informierte Einwilligung. Deshalb steht die
   Erklärung sichtbar davor, und der Systemdialog kommt erst beim zweiten Tippen. */
function geoErklaert(){
  const alt = document.getElementById("geonote");
  if(alt){ alt.remove(); return true; }
  const leiste = document.getElementById("controls");
  if(!leiste) return true;
  const box = document.createElement("div");
  box.id = "geonote"; box.className = "note"; box.style.margin = "10px 0 0";
  box.innerHTML = `<strong>Standort verwenden.</strong> Radiux fragt gleich den Standort
    dieses Geräts ab. Er wird nur im Gerät verwendet, um Entfernungen zu berechnen –
    nicht gespeichert, nicht übertragen, nicht ausgewertet. Ohne Antwort bleibt die
    Magdeburger Stadtmitte der Bezugspunkt.
    Du kannst jederzeit widerrufen – in den Einstellungen deines Browsers für diese Seite.
    Ohne Standort funktioniert Radiux weiter, Bezugspunkt bleibt die Stadtmitte.
    Ausführlich steht das unter „Mehr → Rechtliches → Datenschutzerklärung“.
    <span style="display:block;margin-top:10px">
      <button type="button" class="btn sm" id="bGeoOk">Standort abfragen</button>
      <button type="button" class="btn sm ghost" id="bGeoNo">Lieber nicht</button></span>`;
  leiste.insertAdjacentElement("afterend", box);
  box.querySelector("#bGeoOk").addEventListener("click", ()=>{ box.remove(); useGeo(true); });
  box.querySelector("#bGeoNo").addEventListener("click", ()=>{
    box.remove(); say("Es bleibt bei Magdeburg, Stadtmitte."); });
  return false;
}

function useGeo(bestaetigt){
  if(!navigator.geolocation){ say("Standortbestimmung wird nicht unterstützt."); return; }
  if(!bestaetigt && !S.geoErklaert){ if(!geoErklaert()) return; }
  S.geoErklaert = true; store.set("geoErklaert", true);
  say("Standort wird ermittelt …");
  navigator.geolocation.getCurrentPosition(
    pos=>{ S.origin={lat:pos.coords.latitude, lon:pos.coords.longitude, label:"Dein Standort"};
      S.idx=0;
      const w = dist(S.origin, MD);
      say(w > FERN
        ? `Standort übernommen – du bist ${fmtDist(w)} von Magdeburg entfernt. Radiux zeigt dir die Stadt im Überblick.`
        : "Standort übernommen.");
      render(); },
    ()=>say("Standort nicht verfügbar. Es bleibt bei Magdeburg, Stadtmitte."),
    {enableHighAccuracy:false, timeout:8000, maximumAge:300000});
}

/* ---------------- Rückgängig ---------------- */
const HIST = [];
function remember(entry){ HIST.push(entry); if(HIST.length > 40) HIST.shift(); }

function undo(){
  const h = HIST.pop();
  if(!h){ say("Nichts zum Zurücknehmen."); render(); return; }
  if(h.type === "hide"){
    S.hidden = S.hidden.filter(n => n !== h.name);
    store.set("hidden", S.hidden);
    S.profile[h.cat] = (S.profile[h.cat] || 0) + 0.5;
    store.set("profile", S.profile);
    say(`„${h.name}“ ist wieder da.`);
  } else if(h.type === "save"){
    S.saved = S.saved.filter(x => x.n !== h.name);
    store.set("saved", S.saved);
    S.profile[h.cat] = (S.profile[h.cat] || 0) - 1;
    store.set("profile", S.profile);
    say(`„${h.name}“ nicht mehr gemerkt.`);
  } else if(h.type === "unsave"){
    S.saved.push(h.item); store.set("saved", S.saved);
    say(`„${h.name}“ wieder gemerkt.`);
  } else if(h.type === "skip"){
    say("Einen Schritt zurück.");
  }
  S.idx = Math.max(0, h.idx);
  render();
}

/* ---------------- Teilen -------------------------------------------------
   Radiux baut keinen eigenen Nachrichtendienst. Zum Weitergeben wird der
   Teilen-Dialog des Geräts benutzt: Dort stehen WhatsApp, Signal, Threema,
   E-Mail und alles andere, was der Nutzer installiert hat.

   Das ist auch der datenschutzfreundlichere Weg. Ein eingebauter
   WhatsApp-Knopf würde einen Anbieter bevorzugen und beim Antippen eine
   Adresse bei Meta aufrufen. Beim Teilen-Dialog entscheidet das Gerät, und
   es wird nichts geladen, solange niemand etwas auswählt.

   Kann der Browser das nicht – ältere Rechner vor allem –, wird der Text in
   die Zwischenablage gelegt. Ein WhatsApp-Verweis steht zusätzlich bereit,
   damit der Weg auch dort einen Namen hat. -------------------------------- */
function teilenLink(p){
  return location.origin + location.pathname + "?ort=" + encodeURIComponent(p.n);
}
function teilenText(p){
  const teile = [p.n];
  if(p.start) teile.push(evLabel(p.start));
  if(p.t) teile.push(p.t);
  else if(p.art) teile.push(p.art);
  if(istSerie(p)) teile.push("läuft an " + p.alle.length + " Abenden");
  return teile.join(" · ") + "\n" + teilenLink(p);
}
async function teilen(p){
  const text = teilenText(p);
  if(navigator.share){
    try{ await navigator.share({ title: p.n, text }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  try{
    await navigator.clipboard.writeText(text);
    say("In die Zwischenablage kopiert – jetzt in eine Nachricht einfügen.");
  }catch(e){
    say("Teilen wird von diesem Browser nicht unterstützt.");
  }
}
function waLink(p){ return "https://wa.me/?text=" + encodeURIComponent(teilenText(p)); }

/* ---------------- Aktionen ---------------- */
const isSaved = n => S.saved.some(x=>x.n===n);
function bump(p,v){
  if(!S.profilAn) return;                 /* ausgeschaltet: es wird nichts gezählt */
  S.profile[p.c]=(S.profile[p.c]||0)+v; store.set("profile",S.profile);
}
/* Ein- und ausschalten. Beim Ausschalten werden die Zähler gelöscht – sonst
   bliebe ein Profil liegen, das niemand mehr wollte. */
function setProfil(an){
  S.profilAn = !!an; store.set("profilAn", S.profilAn);
  if(!S.profilAn){ S.profile = {}; store.set("profile", {}); }
  S.idx = 0;
  say(S.profilAn
    ? "Vorschläge werden ab jetzt an deine Entscheidungen angepasst."
    : "Anpassung aus. Die gezählten Vorlieben wurden gelöscht.");
  render();
}
function save(p){
  if(!isSaved(p.n)){
    const item = {n:p.n,c:p.c,lat:p.lat,lon:p.lon,t:p.t||"",adr:p.adr||"",oh:p.oh||"",
                  start:p.start||"",url:p.url||"",src:p.src||""};
    S.saved.push(item); store.set("saved",S.saved); bump(p,1);
    remember({type:"save", name:p.n, cat:p.c, idx:S.idx});
    say(`„${p.n}“ gemerkt.`);
  } else {
    const item = S.saved.find(x=>x.n===p.n);
    S.saved=S.saved.filter(x=>x.n!==p.n); store.set("saved",S.saved);
    remember({type:"unsave", name:p.n, cat:p.c, item, idx:S.idx});
    say(`„${p.n}“ entfernt.`);
  }
}
function hide(p){
  if(!S.hidden.includes(p.n)){
    S.hidden.push(p.n); store.set("hidden",S.hidden); bump(p,-0.5);
    remember({type:"hide", name:p.n, cat:p.c, idx:S.idx});
    say(`„${p.n}“ ausgeblendet.`);
  }
}

/* ---------------- Bausteine ---------------- */
function whyLine(p){
  const prof = S.profile[p.c] || 0;
  if(p.start){
    const d = Math.round(evDaysUntil(p.start));
    return d <= 0 ? "Findet heute statt, ganz in der Nähe"
         : d === 1 ? "Findet morgen statt"
         : `In ${d} Tagen · ${p.t || "in deinem Umkreis"}`;
  }
  if(S.mode === "ueberrasch")
    return prof > 0 ? `Zufallsvorschlag – „${CATMAP[p.c]}“ kennst du schon`
         : `Zufallsvorschlag – „${CATMAP[p.c]}“ wählst du sonst selten`;
  if(!S.profilAn && p._o.s === "open") return "Nah und jetzt geöffnet";
  if(!S.profilAn) return "Sortiert nach Nähe und Öffnungszeit";
  if(prof > 0) return `Passt zu „${CATMAP[p.c]}“ – ${prof === 1 ? "einmal" : prof + "-mal"} gemerkt`;
  if(p._o.s === "open" && p._d < S.radius * 0.4) return "Ganz in der Nähe und jetzt geöffnet";
  if(p._o.s === "open") return "Hat jetzt geöffnet";
  if(p._o.s === "closed") return "Gerade geschlossen – deshalb weiter hinten";
  return "Sortiert nach Nähe – noch keine Vorlieben hinterlegt";
}
function whyShort(p){
  return `<p class="whyline"><span class="micro">Warum</span>${esc(whyLine(p))}</p>`;
}

function whyBlock(p){
  return `<div class="why"><h3>Warum dieser Vorschlag</h3><ul>${
    reasons(p).map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
}
function pills(p){
  const o=p._o;
  return `<div class="meta">
    <span class="pill dist">${p.approx ? "Ort im Stadtgebiet"
      : `${fmtDist(p._d)} · ${walkMin(p._d)} Min`}</span>
    <span class="pill ${o.s==="open"?"open":o.s==="closed"?"closed":o.s==="soon"?"soon":""}">${esc(o.t)}</span>
    ${istSerie(p)?`<span class="pill serie">läuft an ${p.alle.length} Abenden</span>`:""}
    ${p.adr?`<span class="pill">${esc(p.adr)}</span>`:""}
  </div>`;
}

      ohne Umkreisgrenze.</div>` : ""}
    ${bestandHinweis(list)}
    ${S.q.trim() ? `<p class="counter" style="text-align:left;margin:14px 0 0">${
        queryBlocked(S.q) ? "Zu diesem Begriff zeigt Radiux bewusst keine Ergebnisse."
        : `${list.length} Treffer für „${esc(S.q.trim())}“ · sucht in allen Kategorien, ohne Umkreis`}</p>` : ""}
    ${(S.vmode==="karten"||!p) ? body : listView(list.slice(0,40), S.mode==="event"
        ? (S.evFilter==="serie" ? "Läuft an mehreren Abenden"
         : S.evFilter==="einzeln" ? "Nur an einem Abend" : "Alle Termine")
        : "Alle Vorschläge", list.length)}`;

  main().querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",()=>{
    S.vmode=b.dataset.v; store.set("vmode",S.vmode); render();
  }));
  main().querySelectorAll("[data-ev]").forEach(b=>b.addEventListener("click",()=>{
    S.evFilter=b.dataset.ev; S.idx=0; render(); main().focus({preventScroll:true});
  }));
  $("#bLive")?.addEventListener("click",loadLive);
  $("#bLive2")?.addEventListener("click",loadLive);
  $("#bLive3")?.addEventListener("click",loadLive);
  $("#reset")?.addEventListener("click",()=>{ S.hidden=[]; store.set("hidden",[]); S.idx=0;
    say("Ausgeblendete Orte wurden zurückgeholt."); render(); });
  $("#bUndo")?.addEventListener("click",undo);
  $("#bUndo2")?.addEventListener("click",undo);
  $("#bBack")?.addEventListener("click",()=>{ S.mode=null; store.set("mode",null);
    S.q=""; S.idx=0; window.scrollTo({top:0}); render(); });
  if(p && !S.loading && $("#card")){
    $("#bYes")?.addEventListener("click",()=>{ if(!isSaved(p.n)) save(p); S.idx++; render(); });
    $("#bNo")?.addEventListener("click",()=>{ hide(p); render(); });
    $("#bSkip")?.addEventListener("click",()=>{ remember({type:"skip", idx:S.idx}); S.idx++; render(); });
    swipe($("#card"),
      ()=>{ if(!isSaved(p.n)) save(p); S.idx++; render(); },
      ()=>{ hide(p); render(); },
      ()=>openDetail(p.n));
  }
  bindList();
}

/* ---------------- Listenansicht (gleichwertige Alternative) ---------------- */
function listView(list,title,total){
  if(!list.length) return "";
  return `<div class="sechead"><h2>${esc(title)}</h2><span class="cnt">${total??list.length} Treffer · ${esc(S.dataSource)}
    · <button type="button" class="inlink" data-view="how">Wie sortiert wird</button></span></div>
  <ul class="list">${list.map((p,i)=>`
    <li>
      <button type="button" class="lrow" data-act="detail" data-n="${esc(p.n)}"
              aria-label="${esc(p.n)} – Details öffnen">
        <span class="lthumb">${media(p,320,420)}</span>
        <span class="lmain">
          <span class="lname">${esc(p.n)}</span>
          ${(p.t||p.art)?`<span class="desc" style="display:block;margin-bottom:8px">${esc(p.t||p.art)}</span>`:""}
          ${pills(p)}
        </span>
      </button>
      ${whyShort(p)}
      <div class="lact">
        <button class="btn sm" data-act="save" data-n="${esc(p.n)}">${isSaved(p.n)?"Gemerkt ✓":"Merken"}</button>
        <button class="btn sm ghost" data-act="hide" data-n="${esc(p.n)}">Ausblenden</button>
        ${p.tk?`<a class="btn sm" href="${esc(p.tk)}" target="_blank" rel="noopener noreferrer">Tickets ↗</a>`
          :p.url?`<a class="btn sm ghost" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Zur Ankündigung ↗</a>`:""}
      </div>
    </li>`).join("")}</ul>`;
}
function bindList(){
  main().querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{
    S.view=b.dataset.view; S.detail=null; window.scrollTo({top:0}); render();
    main().focus({preventScroll:true});
  }));
  main().querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.act==="detail"){ openDetail(b.dataset.n); return; }
    const list=prepare();
    const p=list.find(x=>x.n===b.dataset.n) || S.saved.find(x=>x.n===b.dataset.n);
    if(!p) return;
    if(b.dataset.act==="save") save(p); else hide(p);
    render();
  }));
}

/* ---------------- Rankingtransparenz (§ 5b Abs. 2 UWG) ---------------- */
function viewHow(){
  const rows=[
    ["Entfernung",40,"Je näher am Bezugspunkt, desto weiter vorne. Orte außerhalb des eingestellten Umkreises erscheinen gar nicht."],
    ["Deine bisherigen Entscheidungen",30,"Gemerkte Orte stärken ihre Kategorie, ausgeblendete schwächen sie. Ohne Interaktionen wirkt das Kriterium neutral."],
    ["Aktuell geöffnet",20,"Geöffnet wird bevorzugt, geschlossen deutlich abgewertet. Fehlen Öffnungszeiten, wird neutral bewertet statt geraten."],
    ["Vollständigkeit der Angaben",10,"Orte mit Beschreibung und Öffnungszeiten sind verlässlicher."]
  ];
  main().innerHTML=`<div aria-live="polite" class="sr" id="live"></div>
  <div class="legal">
  <h1>Wie Radiux empfiehlt</h1>
  <p>Die Reihenfolge der Vorschläge entsteht aus einer festen Rechenregel. Sie wird hier
  vollständig und mit ihrer Gewichtung offengelegt.</p>
  <p><strong>Solange die Anpassung ausgeschaltet ist</strong> – und das ist sie, bis du sie
  einschaltest – entfällt das Kriterium „deine bisherigen Entscheidungen“. Dann gilt:
  Entfernung 55 %, Öffnungsstatus 32 %, Vollständigkeit der Angaben 13 %. Die Tabelle unten
  beschreibt die Reihenfolge <em>mit</em> eingeschalteter Anpassung.</p>
  <table>
    <colgroup><col style="width:38%"><col style="width:20%"><col style="width:42%"></colgroup>
    <thead><tr><th>Kriterium</th><th>Gewicht</th><th>Wirkung</th></tr></thead>
    <tbody>${rows.map(([k,w,d])=>`<tr>
      <td><strong>${esc(k)}</strong></td>
      <td><div style="font-weight:800;margin-bottom:5px">${w} %</div>
          <div class="wbar"><i style="width:${w}%"></i></div></td>
      <td>${esc(d)}</td></tr>`).join("")}</tbody>
  </table>
  <h2>Aussehen</h2>
  <p>Unter „Mehr → Aussehen“ lässt sich die Farbwelt wechseln: automatisch nach
  Geräteeinstellung, ruhig dunkel, Mondstein oder Neon. Neon bringt zusätzlich ein ruhendes
  Raster im Hintergrund, einen kurzen Bildversatz auf Überschriften und feine Zeilen über
  den Bildern mit; alles davon ist selbst gezeichnet, es werden keine fremden Bilder geladen.
  Wer im Gerät „Bewegung reduzieren“ eingestellt hat, bekommt dieselbe Farbwelt ohne
  Bewegung. Die Wahl bleibt in deinem Browser
  gespeichert und wird nicht übertragen. Sie ändert nur Farben – nicht, welche Orte
  du siehst und in welcher Reihenfolge.</p>

  <h2>Welche Orte Radiux lädt</h2>
  <p>Über „aktuelle Orte laden“ fragt Radiux OpenStreetMap nach allem ab, was im Umkreis
  liegt und einen Namen trägt: Gaststätten, Bars und Clubs, Bühnen und Kinos, Museen und
  Galerien, Denkmäler, Türme und Kunst im öffentlichen Raum, Parks, Naturschutzgebiete und
  Badestellen, Sport- und Kletterhallen, Schwimmbäder, Bowling und Escape-Räume,
  Hochschulen, Märkte, Läden.</p>
  <p>Nicht geladen werden Orte des Gesundheitswesens, Gotteshäuser, Kindertagesstätten,
  soziale Einrichtungen, Bestattungshallen und Krematorien, altersbeschränkte Betriebe
  sowie Tabak-, Waffen- und E-Zigarettenläden – die Gründe stehen in den Abschnitten
  weiter unten. Wie viel dabei herauskommt, hängt davon ab,
  wie gut die Stadt in OpenStreetMap erfasst ist. Fehlt etwas, kann es jeder eintragen.</p>

  <h2>Beschreibungen</h2>
  <p>Zu einigen bekannten Orten steht in der Detailansicht ein längerer Text. Diese Texte
  sind von Hand geschrieben und anhand öffentlicher Quellen geprüft – Wikipedia, die Seiten
  der Landeshauptstadt Magdeburg und die Websites der Häuser selbst. Sie sind weder bezahlt
  noch von den Betrieben gestellt, und sie beeinflussen die Reihenfolge der Vorschläge nicht.</p>
  <p>Fällt dir ein Fehler auf, sag Bescheid – siehe „Mitmachen“ unter „Über Radiux“.</p>

  <h2>Jugendschutz</h2>
  <p>Radiux prüft kein Alter. Deshalb zeigt Radiux keine Orte, deren Geschäftszweck selbst
  an ein Mindestalter gebunden ist: Erotikbetriebe, Bordelle, Spielhallen, Spielbanken und
  Wettbüros werden beim Laden, in der Anzeige und in der Suche verworfen. Bars, Kneipen und
  Clubs bleiben enthalten – auch dort gibt es Altersgrenzen, aber sie betreffen den Einlass
  und den Ausschank, und dafür ist der Betrieb zuständig, nicht ein Verzeichnis.</p>
  <p>Verwiesen wird außerdem auf Veranstaltungen, die eine Altersgrenze haben können. Die
  Angabe dazu steht beim Veranstalter, nicht hier. Rechtlich ist das kein Fall für den
  Jugendmedienschutz: Der knüpft an den Inhalt eines Angebots an, nicht an das Mindestalter
  für einen beschriebenen Ort. Der Ausschluss oben ist deshalb freiwillige Vorsorge und
  keine Pflicht – er bleibt trotzdem.</p>

  <h2>Suche</h2>
  <p>Die Suche durchsucht Namen, Beschreibung, Adresse und Kategorie der geladenen Orte.
  Ist ein Suchbegriff eingegeben, gelten weder der eingestellte Umkreis noch der Kategorie-
  oder Vorhaben-Filter: Wer einen Namen eintippt, sucht diesen Ort und nicht eine Kategorie.
  Sortiert wird weiterhin nach Nähe.</p>
  <p>Suchbegriffe werden weder gespeichert noch übertragen und fließen nicht in dein
  Interessenprofil ein. Begriffe mit Gesundheitsbezug führen bewusst zu keinem Ergebnis –
  aus demselben Grund, aus dem Arztpraxen und Apotheken gar nicht erst geladen werden.</p>

  <h2>Veranstaltungen</h2>
  <p>Veranstaltungen werden nach einer eigenen Regel sortiert, weil bei ihnen die Zeit
  wichtiger ist als die Entfernung: Termin 45 %, Entfernung 30 %, deine bisherigen
  Entscheidungen 15 %, Vollständigkeit der Angaben 10 %. Ist die Anpassung ausgeschaltet:
  Termin 53 %, Entfernung 35 %, Vollständigkeit 12 %. Vergangene Termine verschwinden
  automatisch drei Stunden nach Beginn.</p>
  <p>Bei jeder Veranstaltung steht, aus welcher Quelle die Angabe stammt. Termine ändern
  sich kurzfristig — verbindlich ist immer der Veranstalter, nicht diese Anwendung.</p>
  <p>Neben der Termindatei gibt es einen zweiten Knopf „Google Kalender“. Der öffnet
  lediglich das Eintragsformular von Google in einem neuen Tab, mit vorausgefülltem Titel und
  Termin. Radiux greift dabei nicht auf dein Konto zu und überträgt nichts im Hintergrund –
  der Aufruf findet nur statt, wenn du den Knopf antippst, und dann gelten die
  Datenschutzbestimmungen von Google.</p>
  <p>Über „In den Kalender“ erzeugt Radiux eine Termindatei im Gerät, die sich in der
  gewohnten Kalender-App öffnet. Dabei wird keine Verbindung zu einem Kalenderdienst
  hergestellt und kein Konto verknüpft.</p>

  <h2>Was das Ranking nicht beeinflusst</h2>
  <ul>
    <li><strong>Bezahlung.</strong> Dieser Prototyp enthält keine bezahlten Platzierungen, keine Werbung und keine Provisionen. Sollte sich das ändern, würde jede bezahlte Platzierung am einzelnen Ergebnis gekennzeichnet.</li>
    <li><strong>Gesundheitsbezogene und medizinische Merkmale.</strong> Arztpraxen, Apotheken, Kliniken und alles, was in OpenStreetMap als Gesundheitseinrichtung geführt ist, wird gar nicht erst abgerufen. Gotteshäuser ebenso wenig. Historische Bauten mit religiösem Ursprung, die heute Museum oder Konzertort sind, können vorkommen – das Kloster Unser Lieben Frauen etwa. Eine Kategorie „Religion“ gibt es nicht.</li>
    <li><strong>Weitere ausgeschlossene Orte.</strong> Kindertagesstätten, soziale Einrichtungen, Bestattungshallen und Krematorien sowie Tabak-, Waffen- und E-Zigarettenläden werden ebenfalls nicht geladen. Nicht weil ein Gesetz es verlangt, sondern weil sie nicht zu einer Freizeit-App gehören.</li>
    <li><strong>Künstliche Intelligenz.</strong> Die Empfehlungen entstehen aus der oben beschriebenen Rechenregel. Es ist kein KI-Modell beteiligt und es werden keine Texte generiert.</li>
  </ul>
  <h2>Bildmotive</h2>
  <p>Die Bilder stammen aus einer freien Bilddatenbank und stehen unter einer Lizenz,
  die die kostenlose kommerzielle Nutzung erlaubt. Sie zeigen <strong>nicht</strong> den
  jeweiligen Ort, sondern stehen stellvertretend für die Kategorie. Deshalb trägt jedes
  Bild die Kennzeichnung „Symbolbild“.</p>
  <p>Läge für einen Ort eine eigene Aufnahme vor, stünde dort „Foto“ – bisher gibt es keine.
  Fehlt ein Bild,
  erscheint eine neutrale Fläche mit dem Kategorienamen — es wird nie ein Bild gezeigt,
  das einen falschen Eindruck vom Ort erwecken könnte.</p>
  <h2 id="anpassung">Vorschläge an meine Entscheidungen anpassen</h2>
  <p>Radiux kann sich merken, welche Kategorien du oft merkst und welche du ausblendest,
  und die Reihenfolge danach verschieben. <strong>Das ist ausgeschaltet, bis du es
  einschaltest.</strong> Ausgeschaltet siehst du dieselben Orte – nur nach Nähe und
  Öffnungszeit sortiert statt nach Vorlieben.</p>
  <p>Die Zähler bleiben in jedem Fall in deinem Gerät. Schaltest du wieder aus, werden
  sie gelöscht.</p>
  <div class="schalter">
    <button type="button" class="btn ${S.profilAn?"":"primary"}" id="profAus"
      aria-pressed="${!S.profilAn}">Aus</button>
    <button type="button" class="btn ${S.profilAn?"primary":""}" id="profAn"
      aria-pressed="${S.profilAn}">Anpassen</button>
    <span class="micro">${S.profilAn?"eingeschaltet":"ausgeschaltet"}</span>
  </div>
  <h2>Dein Profil</h2>
  <p>Aktuell gespeicherte Vorlieben: ${!S.profilAn ? "keine – die Anpassung ist aus"
    : (Object.keys(S.profile).length
      ? Object.entries(S.profile).map(([k,v])=>`${esc(CATMAP[k]||k)} (${v>0?"+":""}${v})`).join(", ")
      : "noch keine")}.</p>
  <button class="btn" id="wipe">Alle lokal gespeicherten Daten löschen</button>
  </div>`;
  $("#profAn")?.addEventListener("click",()=>setProfil(true));
  $("#profAus")?.addEventListener("click",()=>setProfil(false));
  $("#wipe").addEventListener("click",()=>{
    store.clear(); S.saved=[]; S.hidden=[]; S.profile={}; S.profilAn=false; S.mode=null;
    say("Alle lokal gespeicherten Daten wurden gelöscht."); render();
  });
}
