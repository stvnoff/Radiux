<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0b10">
<title>Radiux – Magdeburg entdecken</title>
<style>
  :root{
    --bg:#07080d; --bg-2:#0c0e16;
    --glass:rgba(255,255,255,.065);
    --glass-2:rgba(255,255,255,.10);
    --glass-3:rgba(255,255,255,.15);
    --glass-line:rgba(255,255,255,.16);
    --glass-hi:rgba(255,255,255,.34);
    --surface:rgba(20,23,34,.62);
    --surface-2:rgba(255,255,255,.07);
    --surface-3:rgba(255,255,255,.13);
    --line:rgba(255,255,255,.14);
    --line-soft:rgba(255,255,255,.08);
    --text:#f6f8fe; --text-dim:#b3bccf; --text-mute:#8a94aa;
    --brand-1:#8b5cff; --brand-2:#22d3ee;
    --pos:#4ade80; --neg:#ff7a8a; --warn:#ffcc4d;
    --r-md:18px; --r-lg:24px; --r-xl:30px;
    --shadow:0 24px 60px -20px rgba(0,0,0,.85);
    --sheen:inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(255,255,255,.05);
    --card-h:clamp(360px,50vh,470px);
    --ease:cubic-bezier(.22,1,.36,1);
    --blur:blur(18px) saturate(170%);
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#eef1f9; --bg-2:#e3e8f5;
      --glass:rgba(255,255,255,.58);
      --glass-2:rgba(255,255,255,.72);
      --glass-3:rgba(255,255,255,.85);
      --glass-line:rgba(255,255,255,.9);
      --glass-hi:rgba(255,255,255,.95);
      --surface:rgba(255,255,255,.74);
      --surface-2:rgba(255,255,255,.62);
      --surface-3:rgba(255,255,255,.9);
      --line:rgba(16,19,34,.13);
      --line-soft:rgba(16,19,34,.08);
      --text:#0d1020; --text-dim:#48526a; --text-mute:#69738b;
      --brand-1:#6d3ff0; --brand-2:#0e8fa8;
      --pos:#0f9d63; --neg:#d92543; --warn:#a06a00;
      --shadow:0 22px 50px -22px rgba(16,19,34,.35);
      --sheen:inset 0 1px 0 rgba(255,255,255,.95);
    }
  }
  *{box-sizing:border-box}
  html{margin:0;padding:0;background:var(--bg)}
  body{margin:0;padding:0}
  body{
    background:transparent; color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    font-size:16.5px; line-height:1.55; letter-spacing:-.011em;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
    min-height:100dvh; overflow-x:hidden;
  }
  /* Fließender Farbverlauf im Hintergrund */
  .bgfx{position:fixed;inset:-25%;z-index:-1;pointer-events:none;filter:blur(60px);opacity:.85}
  .bgfx i{position:absolute;display:block;border-radius:50%}
  .bgfx i:nth-child(1){width:58vw;height:58vw;left:-8%;top:2%;
    background:radial-gradient(circle,var(--brand-1),transparent 68%);opacity:.55;
    animation:drift1 26s var(--ease) infinite alternate}
  .bgfx i:nth-child(2){width:52vw;height:52vw;right:-10%;top:-4%;
    background:radial-gradient(circle,var(--brand-2),transparent 68%);opacity:.42;
    animation:drift2 32s var(--ease) infinite alternate}
  .bgfx i:nth-child(3){width:46vw;height:46vw;left:22%;bottom:-6%;
    background:radial-gradient(circle,#ff5fa2,transparent 70%);opacity:.28;
    animation:drift3 38s var(--ease) infinite alternate}
  @keyframes drift1{to{transform:translate3d(14vw,10vh,0) scale(1.18)}}
  @keyframes drift2{to{transform:translate3d(-12vw,14vh,0) scale(1.12)}}
  @keyframes drift3{to{transform:translate3d(10vw,-12vh,0) scale(1.22)}}

  .wrap{max-width:580px;margin:0 auto;padding:0 18px}
  main.wrap{padding-bottom:30px}
  h1,h2,h3{line-height:1.18;margin:0 0 .5em;letter-spacing:-.03em}
  h1{font-size:1.72rem;font-weight:800}
  h2{font-size:1.22rem;font-weight:750}
  h3{font-size:1.02rem;font-weight:750}
  p{margin:0 0 .9em}
  a{color:var(--brand-2)}
  button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2.5px solid var(--brand-2);outline-offset:3px;border-radius:14px}
  .skip{position:absolute;left:-9999px;top:0;background:var(--brand-1);color:#fff;
    padding:12px 18px;z-index:99;border-radius:0 0 14px 0;font-weight:750}
  .skip:focus{left:0;top:0}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- Glas-Grundrezept ---------- */
  .glass{
    background:linear-gradient(157deg,var(--glass-2),var(--glass));
    border:1px solid var(--glass-line);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    box-shadow:var(--sheen), var(--shadow);
  }

  /* ---------- Kopfbereich ---------- */
  header.app{position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 82%,transparent),
      color-mix(in srgb,var(--bg) 58%,transparent));
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border-bottom:1px solid var(--line-soft)}
  .bar{display:flex;align-items:center;gap:10px;padding:14px 0 11px}
  .brand{font-weight:850;font-size:1.36rem;letter-spacing:-.05em;margin-right:auto;
    background:linear-gradient(100deg,var(--brand-1),var(--brand-2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-size:.67rem;font-weight:750;letter-spacing:.015em;color:var(--brand-2);
    padding:6px 12px;border-radius:99px;white-space:nowrap;
    background:linear-gradient(157deg,var(--glass-2),var(--glass));
    border:1px solid var(--glass-line);box-shadow:var(--sheen)}

  .controls{padding:4px 18px 15px;border-bottom:1px solid var(--line-soft)}
  .rng{display:flex;align-items:center;gap:13px;width:100%;margin:6px 0 13px}
  .rng label{flex:0 0 auto;font-size:.85rem;font-weight:700;color:var(--text-dim)}
  input[type=range]{flex:1;min-width:100px;height:36px;appearance:none;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;
    background:linear-gradient(90deg,var(--brand-1),var(--brand-2));
    box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
  input[type=range]::-moz-range-track{height:8px;border-radius:99px;
    background:linear-gradient(90deg,var(--brand-1),var(--brand-2))}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;margin-top:-8px;
    border-radius:50%;background:linear-gradient(160deg,#fff,#dfe4f5);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 4px 14px rgba(0,0,0,.55), inset 0 1px 0 #fff}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;
    border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.55)}
  .radval{font-variant-numeric:tabular-nums;font-weight:800;font-size:1rem;
    min-width:66px;text-align:right;flex:0 0 auto;
    background:linear-gradient(100deg,var(--brand-1),var(--brand-2));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .chips{display:flex;gap:9px;overflow-x:auto;padding:3px 0 6px;
    scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{position:relative;white-space:nowrap;border-radius:99px;padding:10px 16px;
    cursor:pointer;min-height:42px;font-size:.85rem;font-weight:750;color:var(--text-dim);
    background:linear-gradient(157deg,var(--glass-2),var(--glass));
    border:1px solid var(--glass-line);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--sheen);
    transition:transform .2s var(--ease),color .2s,box-shadow .2s,background .2s}
  .chip:active{transform:scale(.93)}
  .chip[aria-pressed=true]{color:#fff;border-color:transparent;
    background:linear-gradient(140deg,var(--brand-1),var(--brand-2));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),
      0 8px 22px -8px color-mix(in srgb,var(--brand-1) 80%,transparent)}

  /* ---------- Glasknöpfe ---------- */
  .btn{position:relative;overflow:hidden;border-radius:99px;padding:13px 19px;
    cursor:pointer;min-height:48px;font-weight:750;color:var(--text);
    background:linear-gradient(157deg,var(--glass-2),var(--glass));
    border:1px solid var(--glass-line);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--sheen), 0 10px 28px -16px rgba(0,0,0,.9);
    transition:transform .18s var(--ease),box-shadow .22s,background .22s,filter .22s}
  .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 46%)}
  .btn:hover{filter:brightness(1.12)}
  .btn:active{transform:scale(.96)}
  .btn.primary{color:#fff;border-color:transparent;
    background:linear-gradient(140deg,var(--brand-1),var(--brand-2));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),
      0 12px 30px -12px color-mix(in srgb,var(--brand-1) 85%,transparent)}
  .btn.sm{padding:9px 15px;min-height:42px;font-size:.83rem}
  .btn.ghost{background:linear-gradient(157deg,var(--glass),transparent)}
  .btn-row{display:flex;gap:9px;margin:14px 0 6px;overflow-x:auto;
    scrollbar-width:none;padding-bottom:3px}
  .btn-row::-webkit-scrollbar{display:none}
  .btn-row .btn{flex:0 0 auto;white-space:nowrap}

  /* ---------- Startauswahl ---------- */
  .hero{padding:28px 0 6px}
  .hero h1{font-size:2.05rem;margin-bottom:.3em}
  .hero .lead{color:var(--text-dim);font-size:1.02rem;margin-bottom:22px}
  .modes{display:grid;gap:13px}
  .mode{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:0;
    cursor:pointer;text-align:left;
    background:linear-gradient(157deg,var(--glass-2),var(--glass));
    border:1px solid var(--glass-line);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--sheen), var(--shadow);
    transition:transform .22s var(--ease),filter .22s}
  .mode::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%)}
  .mode:active{transform:scale(.98)}
  .mode:hover{filter:brightness(1.1)}
  .mode .mi{display:flex;align-items:center;gap:15px;padding:17px 19px;position:relative;z-index:2}
  .mode .orb{width:50px;height:50px;border-radius:17px;flex:0 0 auto;position:relative;
    box-shadow:0 10px 26px -8px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.55)}
  .mode .mt{font-weight:800;font-size:1.08rem;display:block}
  .mode .ms{font-size:.85rem;color:var(--text-dim);display:block;margin-top:1px}
  .mode .arw{margin-left:auto;color:var(--text-mute);font-size:1.25rem}

  /* ---------- Entdeckungskarten ---------- */
  .deck{position:relative;height:var(--card-h);margin:16px 0 14px}
  .card{position:absolute;inset:0;border-radius:var(--r-xl);overflow:hidden;
    background:var(--surface);
    border:1px solid var(--glass-line);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--sheen), var(--shadow);
    display:flex;flex-direction:column;touch-action:pan-y;user-select:none}
  .card.behind{transform:scale(.94) translateY(16px);opacity:.45;z-index:1;box-shadow:none}
  .card.front{z-index:2;animation:cardIn .4s var(--ease)}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .cover{position:relative;height:40%;min-height:130px;flex:0 0 auto;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 42%,
      color-mix(in srgb,var(--bg) 42%,transparent) 100%)}
  .cover .catbadge,.cover .fict{position:absolute;top:14px;z-index:2;color:#fff;
    border-radius:99px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:rgba(10,12,20,.42);border:1px solid rgba(255,255,255,.24);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .cover .catbadge{left:15px;font-size:.65rem;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;padding:7px 12px}
  .cover .fict{right:15px;font-size:.6rem;font-weight:700;padding:6px 10px;color:rgba(255,255,255,.88)}
  .cbody{padding:15px 21px 19px;display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto}
  .cbody h2{font-size:1.52rem;margin-bottom:6px}
  .desc{color:var(--text-dim);font-size:.92rem;margin-bottom:11px}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
  .pill{font-size:.76rem;font-weight:700;border-radius:99px;padding:6px 12px;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--sheen)}
  .pill.open{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 42%,transparent);
    background:color-mix(in srgb,var(--pos) 13%,transparent)}
  .pill.closed{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 42%,transparent);
    background:color-mix(in srgb,var(--neg) 13%,transparent)}
  .pill.dist{color:var(--text);background:var(--glass-3)}
  .why{margin-top:auto;border-radius:var(--r-md);padding:14px 16px;
    background:linear-gradient(157deg,color-mix(in srgb,var(--brand-1) 20%,transparent),
      color-mix(in srgb,var(--brand-2) 8%,transparent));
    border:1px solid color-mix(in srgb,var(--brand-1) 30%,transparent);
    box-shadow:var(--sheen)}
  .why h3{font-size:.67rem;text-transform:uppercase;letter-spacing:.11em;
    color:var(--brand-2);margin-bottom:8px;font-weight:800}
  .why ul{margin:0;padding-left:17px;font-size:.87rem;color:var(--text-dim)}
  .why li{margin-bottom:4px}
  .why li::marker{color:var(--brand-2)}
  .hint{font-size:.74rem;color:var(--text-mute);margin:11px 0 0;text-align:center}

  .stamp{position:absolute;top:28px;z-index:5;font-size:1.45rem;font-weight:900;
    letter-spacing:.08em;padding:10px 20px;border-radius:16px;opacity:0;
    border:3px solid currentColor;pointer-events:none;transition:opacity .12s;
    backdrop-filter:blur(6px);background:rgba(8,10,16,.28)}
  .stamp.yes{left:20px;color:var(--pos);transform:rotate(-13deg)}
  .stamp.no{right:20px;color:var(--neg);transform:rotate(13deg)}

  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
  .actions .btn{text-align:center;padding:15px 6px;font-size:.88rem}
  .act-no{border-color:color-mix(in srgb,var(--neg) 45%,transparent);color:var(--neg);
    background:linear-gradient(157deg,color-mix(in srgb,var(--neg) 22%,transparent),
      color-mix(in srgb,var(--neg) 8%,transparent))}
  .act-yes{border-color:color-mix(in srgb,var(--pos) 45%,transparent);color:var(--pos);
    background:linear-gradient(157deg,color-mix(in srgb,var(--pos) 22%,transparent),
      color-mix(in srgb,var(--pos) 8%,transparent))}
  .counter{font-size:.78rem;color:var(--text-mute);text-align:center;margin:0 0 4px}

  /* ---------- Listen ---------- */
  .sechead{display:flex;align-items:baseline;gap:10px;margin:32px 0 13px}
  .sechead h2{margin:0;font-size:1.05rem}
  .sechead .cnt{font-size:.78rem;color:var(--text-mute);margin-left:auto}
  .list{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:13px}
  .list > li{border-radius:var(--r-lg);overflow:hidden;
    background:var(--surface);border:1px solid var(--glass-line);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--sheen), 0 14px 34px -24px rgba(0,0,0,.9)}
  .lrow{display:flex;gap:0}
  .lthumb{width:96px;flex:0 0 auto;position:relative;min-height:122px}
  .lthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .lmain{padding:14px 16px;flex:1;min-width:0}
  .lmain h3{margin-bottom:5px}
  .lact{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
  .list .why{margin:0 16px 14px}

  .empty{border-radius:var(--r-lg);padding:36px 22px;text-align:center;color:var(--text-dim);
    background:linear-gradient(157deg,var(--glass-2),var(--glass));
    border:1px dashed var(--glass-line);box-shadow:var(--sheen)}

  /* ---------- Navigation ---------- */
  nav.tabs{position:sticky;bottom:0;z-index:30;
    background:linear-gradient(0deg,color-mix(in srgb,var(--bg) 88%,transparent),
      color-mix(in srgb,var(--bg) 60%,transparent));
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px 10px}
  nav.tabs button{background:none;border:1px solid transparent;padding:9px 4px 8px;
    min-height:54px;cursor:pointer;font-size:.7rem;font-weight:750;color:var(--text-mute);
    border-radius:17px;display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:color .2s,background .2s,border-color .2s}
  nav.tabs button svg{width:22px;height:22px;stroke-width:1.9}
  nav.tabs button[aria-current=page]{color:var(--text);
    background:linear-gradient(157deg,var(--glass-2),var(--glass));
    border-color:var(--glass-line);box-shadow:var(--sheen)}
  nav.tabs button[aria-current=page] svg{stroke:url(#navgrad)}

  /* ---------- Rechtstexte ---------- */
  .legal{font-size:.93rem}
  .legal h1{margin-top:.4em}
  .legal h2{margin-top:1.7em}
  .legal h3{margin-top:1.2em;color:var(--text-dim);font-size:.95rem}
  .legal table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;
    font-size:.83rem;margin:0 0 1.2em;border:1px solid var(--glass-line);
    border-radius:var(--r-md);overflow:hidden;background:var(--glass)}
  .legal th,.legal td{padding:11px 12px;text-align:left;vertical-align:top;hyphens:auto;
    border-bottom:1px solid var(--line-soft)}
  .legal th{background:var(--glass-2);font-weight:800}
  .legal tr:last-child td{border-bottom:0}
  .legal ul{padding-left:19px}
  .legal li{margin-bottom:5px}
  .note,.todo{border-radius:var(--r-md);padding:15px 17px;margin:0 0 1.2em;font-size:.88rem;
    border:1px solid;box-shadow:var(--sheen);backdrop-filter:var(--blur)}
  .note{background:linear-gradient(157deg,color-mix(in srgb,var(--brand-1) 20%,transparent),
      color-mix(in srgb,var(--brand-1) 7%,transparent));
    border-color:color-mix(in srgb,var(--brand-1) 34%,transparent)}
  .todo{background:linear-gradient(157deg,color-mix(in srgb,var(--warn) 20%,transparent),
      color-mix(in srgb,var(--warn) 7%,transparent));
    border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
  .wbar{height:10px;border-radius:99px;background:var(--glass-3);overflow:hidden;min-width:56px;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
  .wbar i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--brand-1),var(--brand-2));
    box-shadow:0 0 14px color-mix(in srgb,var(--brand-2) 60%,transparent)}
  footer.attrib{border-top:1px solid var(--line-soft);margin-top:26px;padding:17px 0 28px;
    font-size:.76rem;color:var(--text-mute)}

  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);
    z-index:60;max-width:min(92vw,520px);text-align:center;color:var(--text);
    padding:12px 20px;border-radius:99px;font-size:.85rem;font-weight:700;
    background:linear-gradient(157deg,var(--glass-3),var(--glass-2));
    border:1px solid var(--glass-line);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:var(--sheen), var(--shadow);
    opacity:0;pointer-events:none;
    transition:opacity .24s var(--ease),transform .24s var(--ease)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<a class="skip" href="#main">Zum Hauptinhalt springen</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="navgrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#22d3ee"/>
  </linearGradient>
</defs></svg>

<header class="app">
  <div class="wrap">
    <div class="bar">

<script>
/* Startbestand Magdeburg – bekannte Orte, dient als Grundlage, solange keine

const FALLBACK_PLACES = [

  {n:"Grüne Zitadelle von Magdeburg",c:"sehenswuerdigkeit",lat:52.12683,lon:11.63797,t:"Letzter Entwurf von Friedensreich Hundertwasser"},

  {n:"Elbuferpromenade",c:"park",lat:52.12800,lon:11.63900,t:"Uferweg mit Blick auf die Altstadt"}
];

/* ------------------------------------------------------------------
   Radiux – Prototyp Magdeburg
   Regelbasierte Empfehlungslogik, keine KI, keine Serververbindung
   außer der optionalen, vom Nutzer ausgelösten OpenStreetMap-Abfrage.
   Alle Bildmotive werden im Gerät erzeugt – keine Fotos, keine Lizenzen.
------------------------------------------------------------------- */

const MD = { lat: 52.1274, lon: 11.6392, label: "Magdeburg, Stadtmitte" };

const CATS = [
  { k:"restaurant",       l:"Essen gehen",       m:["restaurant","biergarten"] },
  { k:"cafe",             l:"Café & Bäckerei",   m:["cafe","ice_cream","bakery"] },
  { k:"bar",              l:"Bar & Kneipe",      m:["bar","pub","nightclub"] },
  { k:"schnell",          l:"Schnell & günstig", m:["fast_food"] },
  { k:"sehenswuerdigkeit",l:"Sehenswürdigkeit",  m:["attraction","viewpoint","artwork"] },
  { k:"museum",           l:"Museum & Galerie",  m:["museum","gallery"] },
  { k:"theater",          l:"Bühne & Kino",      m:["theatre","cinema","arts_centre"] },
  { k:"park",             l:"Park & Natur",      m:["park","garden"] },
  { k:"erleben",          l:"Freizeit & Sport",  m:["fitness_centre","sports_centre","swimming_pool","zoo","theme_park"] },
  { k:"einkaufen",        l:"Einkaufen",         m:["supermarket","mall","books"] },
  { k:"alltag",           l:"Alltag",            m:["fuel","library"] }
];
const CATMAP = Object.fromEntries(CATS.map(c => [c.k, c.l]));

/* Farbwelten je Kategorie: Himmel oben, Himmel unten, drei Silhouettenebenen */
const PAL = {
  restaurant:       ["#ff9a3d","#ff4d6d","#a02b52","#7a1f43","#4d1230"],
  cafe:             ["#ffc46b","#ff7a45","#a34a2c","#7d3520","#4f2013"],
  bar:              ["#a855f7","#4f46e5","#3b2a8c","#2a1d66","#181040"],
  schnell:          ["#fbbf24","#f43f5e","#a12a44","#7a1e33","#4d1220"],
  sehenswuerdigkeit:["#5eead4","#3b82f6","#1e4fa3","#173b7a","#0f2450"],
  museum:           ["#c084fc","#ec4899","#8e2b6b","#6b1f52","#431334"],
  theater:          ["#f9a8d4","#a855f7","#6d2f8f","#52226c","#341545"],
  park:             ["#86efac","#059669","#0b6b4a","#08533a","#053424"],
  erleben:          ["#7dd3fc","#4f46e5","#2a3f9e","#1f2f7a","#131c4d"],
  einkaufen:        ["#fde68a","#f59e0b","#a86a08","#805006","#523304"],
  alltag:           ["#cbd5e1","#64748b","#42506b","#323c52","#1f2634"]
};
const SCENE = {
  park:"natur", erleben:"natur", sehenswuerdigkeit:"natur",
  museum:"kultur", theater:"kultur",
  restaurant:"stadt", cafe:"stadt", bar:"stadt", schnell:"stadt",
  einkaufen:"stadt", alltag:"stadt"
};

/* Aus Datenschutzgründen niemals geladene Kategorien – siehe Blueprint 3 und 9.4 */
const BLOCKED_AMENITY = ["doctors","pharmacy","hospital","clinic","dentist","veterinary",
  "nursing_home","social_facility","childcare","place_of_worship","funeral_hall","crematorium"];

const MODES = {
  essen:     { l:"Etwas essen",     s:"Restaurants, Cafés und Bars in der Nähe", cats:["restaurant","cafe","bar","schnell"], g:["#ff9a3d","#ff4d6d"] },
  erleben:   { l:"Etwas erleben",   s:"Kultur, Sehenswürdigkeiten und Parks",    cats:["sehenswuerdigkeit","museum","theater","park","erleben"], g:["#5eead4","#3b82f6"] },
  stoebern:  { l:"Einfach stöbern", s:"Alles, was in deinem Umkreis liegt",      cats:CATS.map(c=>c.k), g:["#c084fc","#ec4899"] },
  ueberrasch:{ l:"Überrasch mich",  s:"Zufällige Auswahl aus den besten Treffern",cats:CATS.map(c=>c.k), g:["#fbbf24","#7c5cff"] }
};

/* ---------------- Bildmotive im Gerät erzeugen ---------------- */
function hashOf(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function prng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- Bildmotive: pro Kategorie eine eigene Szene, im Gerät gezeichnet ---------- */
const NIGHT = { bar:1, theater:1, schnell:0 };
const NATURE = { park:1, erleben:1, sehenswuerdigkeit:1 };

function cover(name, cat, w, h){
  const p = PAL[cat] || PAL.alltag;
  const rnd = prng(hashOf(name + "|" + cat));
  const R = (a,b)=> a + rnd()*(b-a);
  const N = n => (Math.round(n*10)/10);
  const u = "s" + (hashOf(name+cat) % 99999);
  const night = !!NIGHT[cat];
  const gy = h*0.80;
  const warm = "#ffd9a0";
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;

  /* Verläufe und Weichzeichner */
  s += `<defs>
    <linearGradient id="${u}sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient>
    <radialGradient id="${u}glow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="${u}warm"><stop offset="0" stop-color="${warm}" stop-opacity=".85"/>
      <stop offset="1" stop-color="${warm}" stop-opacity="0"/></radialGradient>
    <linearGradient id="${u}gnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${p[4]}"/><stop offset="1" stop-color="${p[3]}"/></linearGradient>
    <filter id="${u}b" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="${N(h*0.02)}"/></filter>
  </defs>`;

  /* Himmel */
  s += `<rect width="${w}" height="${h}" fill="url(#${u}sky)"/>`;

  /* Sterne oder Wolken */
  if(night){
    for(let i=0;i<16;i++)
      s += `<circle cx="${N(R(0,w))}" cy="${N(R(0,gy*0.62))}" r="${N(R(0.8,2.1))}" fill="#fff" opacity="${N(R(.35,.95))}"/>`;
  } else {
    for(let i=0;i<3;i++){
      const cx=R(0,w), cy=R(h*.10,h*.40), cw=R(w*.16,w*.34);
      s += `<g opacity="${N(R(.10,.20))}" fill="#fff">
        <ellipse cx="${N(cx)}" cy="${N(cy)}" rx="${N(cw)}" ry="${N(cw*.24)}"/>
        <ellipse cx="${N(cx-cw*.3)}" cy="${N(cy-cw*.12)}" rx="${N(cw*.42)}" ry="${N(cw*.26)}"/>
        <ellipse cx="${N(cx+cw*.28)}" cy="${N(cy-cw*.08)}" rx="${N(cw*.34)}" ry="${N(cw*.22)}"/></g>`;
    }
  }

  /* Sonne oder Mond */
  const sx=R(w*.16,w*.84), sy=R(h*.12,h*.30), sr=h*(night?.055:.075);
  s += `<circle cx="${N(sx)}" cy="${N(sy)}" r="${N(sr*3.4)}" fill="url(#${u}glow)" opacity=".34"/>`;
  if(night){
    s += `<path d="M${N(sx)} ${N(sy-sr)} a${N(sr)} ${N(sr)} 0 1 0 ${N(sr*.72)} ${N(sr*1.85)} a${N(sr*.86)} ${N(sr*.86)} 0 1 1 ${N(-sr*.72)} ${N(-sr*1.85)} Z" fill="#fff" opacity=".92"/>`;
  } else {
    s += `<circle cx="${N(sx)}" cy="${N(sy)}" r="${N(sr)}" fill="#fff" opacity=".9"/>`;
  }

  /* Hintergrundebenen */
  if(NATURE[cat]){
    for(let L=0;L<2;L++){
      const base = gy - h*(0.16 - L*0.09), amp = h*(0.13 - L*0.045);
      let d = `M0 ${N(gy)} L0 ${N(base)}`;
      const st = 4 + Math.floor(rnd()*3);
      for(let i=1;i<=st;i++){
        const x=(w/st)*i, y=base - Math.sin(i*1.6+L*2)*amp*R(.5,1.1);
        d += ` Q ${N(x-w/st/2)} ${N(y-amp*.7)} ${N(x)} ${N(y)}`;
      }
      s += d ? `<path d="${d} L${w} ${N(gy)} Z" fill="${p[2+L]}" opacity="${L?.95:.8}"/>` : "";
    }
  } else {
    for(let L=0;L<2;L++){
      const base = gy - h*(0.10 - L*0.06);
      let x=0;
      while(x<w){
        const bw=R(w*.05,w*.11), bh=R(h*.10, h*(.34-L*.10)), y=base-bh;
        s += `<rect x="${N(x)}" y="${N(y)}" width="${N(bw)}" height="${N(gy-y)}" fill="${p[2+L]}" opacity="${L?.95:.75}"/>`;
        if(L===1 && rnd()>.4){
          for(let wy=y+9; wy<base-12; wy+=15)
            for(let wx=x+6; wx<x+bw-8; wx+=13)
              if(rnd()>.55) s += `<rect x="${N(wx)}" y="${N(wy)}" width="4.5" height="6.5" fill="${warm}" opacity="${N(R(.25,.85))}"/>`;
        }
        x += bw + w*.005;
      }
    }
  }

  /* Boden */
  s += `<rect x="0" y="${N(gy)}" width="${w}" height="${N(h-gy)}" fill="url(#${u}gnd)"/>`;

  /* ---------- Kategoriemotiv ---------- */
  const cx = w*R(.42,.58), sc = h/400;
  const M = p[4], A = p[3], HL = "#ffffff";

  if(cat==="restaurant"){
    const tw=w*.34, th=h*.05;
    for(let i=0;i<3;i++){
      const lx=cx-tw*.42+i*tw*.42, ly=gy-h*.30;
      s += `<line x1="${N(lx)}" y1="0" x2="${N(lx)}" y2="${N(ly)}" stroke="${M}" stroke-width="2" opacity=".85"/>
        <path d="M${N(lx-14*sc)} ${N(ly+13*sc)} L${N(lx-6*sc)} ${N(ly)} L${N(lx+6*sc)} ${N(ly)} L${N(lx+14*sc)} ${N(ly+13*sc)} Z" fill="${M}"/>
        <ellipse cx="${N(lx)}" cy="${N(ly+22*sc)} " rx="${N(26*sc)}" ry="${N(20*sc)}" fill="url(#${u}warm)" opacity=".75"/>
        <circle cx="${N(lx)}" cy="${N(ly+15*sc)}" r="${N(4*sc)}" fill="${warm}"/>`;
    }
    s += `<rect x="${N(cx-tw/2)}" y="${N(gy-th)}" width="${N(tw)}" height="${N(th)}" rx="${N(th*.35)}" fill="${M}"/>
      <ellipse cx="${N(cx-tw*.22)}" cy="${N(gy-th-3*sc)}" rx="${N(15*sc)}" ry="${N(4.5*sc)}" fill="${HL}" opacity=".55"/>
      <ellipse cx="${N(cx+tw*.22)}" cy="${N(gy-th-3*sc)}" rx="${N(15*sc)}" ry="${N(4.5*sc)}" fill="${HL}" opacity=".55"/>`;
  }

  else if(cat==="cafe"){
    const cw=w*.20, ch=h*.15, top=gy-ch-h*.03;
    s += `<ellipse cx="${N(cx)}" cy="${N(gy-h*.02)}" rx="${N(cw*.82)}" ry="${N(ch*.13)}" fill="${M}"/>
      <path d="M${N(cx-cw/2)} ${N(top)} h${N(cw)} v${N(ch*.55)} a${N(cw/2)} ${N(ch*.45)} 0 0 1 ${N(-cw)} 0 Z" fill="${HL}" opacity=".92"/>
      <path d="M${N(cx+cw/2)} ${N(top+ch*.16)} a${N(ch*.24)} ${N(ch*.24)} 0 0 1 0 ${N(ch*.46)}" fill="none" stroke="${HL}" stroke-width="${N(6*sc)}" opacity=".92"/>
      <ellipse cx="${N(cx)}" cy="${N(top)}" rx="${N(cw/2)}" ry="${N(ch*.10)}" fill="${A}"/>`;
    for(let i=0;i<3;i++){
      const stx=cx-cw*.26+i*cw*.26;
      s += `<path d="M${N(stx)} ${N(top-h*.03)} q${N(10*sc)} ${N(-14*sc)} 0 ${N(-28*sc)} q${N(-10*sc)} ${N(-14*sc)} 0 ${N(-26*sc)}" fill="none" stroke="${HL}" stroke-width="${N(3.4*sc)}" opacity=".5" stroke-linecap="round"/>`;
    }
  }

  else if(cat==="bar"){
    const bw=w*.42;
    s += `<rect x="${N(cx-bw/2)}" y="${N(gy-h*.06)}" width="${N(bw)}" height="${N(h*.06)}" rx="${N(4*sc)}" fill="${M}"/>`;
    for(let i=0;i<4;i++){
      const bx=cx-bw*.36+i*bw*.24, bh=h*(.11+rnd()*.05);
      s += `<rect x="${N(bx-5*sc)}" y="${N(gy-h*.06-bh)}" width="${N(10*sc)}" height="${N(bh*.72)}" rx="${N(3*sc)}" fill="${A}" opacity=".95"/>
        <rect x="${N(bx-2.4*sc)}" y="${N(gy-h*.06-bh-8*sc)}" width="${N(4.8*sc)}" height="${N(10*sc)}" fill="${A}"/>`;
    }
    const nx=cx, ny=gy-h*.34, nw=w*.30, nh=h*.13;
    s += `<g filter="url(#${u}b)" opacity=".85"><rect x="${N(nx-nw/2)}" y="${N(ny-nh/2)}" width="${N(nw)}" height="${N(nh)}" rx="${N(nh*.4)}" fill="none" stroke="${warm}" stroke-width="${N(9*sc)}"/></g>
      <rect x="${N(nx-nw/2)}" y="${N(ny-nh/2)}" width="${N(nw)}" height="${N(nh)}" rx="${N(nh*.4)}" fill="none" stroke="#fff" stroke-width="${N(3*sc)}" opacity=".95"/>
      <circle cx="${N(nx)}" cy="${N(ny)}" r="${N(nh*.22)}" fill="#fff" opacity=".9"/>`;
  }

  else if(cat==="schnell"){
    const bw=w*.44, bh=h*.26;
    s += `<rect x="${N(cx-bw/2)}" y="${N(gy-bh)}" width="${N(bw)}" height="${N(bh)}" fill="${M}"/>
      <rect x="${N(cx-bw*.36)}" y="${N(gy-bh*.62)}" width="${N(bw*.72)}" height="${N(bh*.34)}" fill="${warm}" opacity=".8"/>`;
    const aw=bw*1.06, ah=h*.055, ay=gy-bh;
    s += `<path d="M${N(cx-aw/2)} ${N(ay)} h${N(aw)} l${N(-aw*.06)} ${N(ah)} h${N(-aw*.88)} Z" fill="${A}"/>`;
    for(let i=0;i<7;i++){
      if(i%2) continue;
      const x0=cx-aw/2+i*(aw/7);
      s += `<path d="M${N(x0)} ${N(ay)} h${N(aw/7)} l${N(-aw*.06/7*7/7-aw/7*0)} ${N(ah)} h${N(-aw/7)} Z" fill="#fff" opacity=".55"/>`;
    }
  }

  else if(cat==="sehenswuerdigkeit"){
    const bw=w*.30, bh=h*.34, x0=cx-bw/2, y0=gy-bh;
    s += `<rect x="${N(x0)}" y="${N(y0)}" width="${N(bw)}" height="${N(bh)}" fill="${M}"/>`;
    for(const side of [-1,1]){
      const tx=cx+side*bw*.62, tw2=bw*.30, th2=bh*1.30;
      s += `<rect x="${N(tx-tw2/2)}" y="${N(gy-th2)}" width="${N(tw2)}" height="${N(th2)}" fill="${M}"/>
        <path d="M${N(tx-tw2/2-3*sc)} ${N(gy-th2)} L${N(tx)} ${N(gy-th2-h*.16)} L${N(tx+tw2/2+3*sc)} ${N(gy-th2)} Z" fill="${A}"/>
        <rect x="${N(tx-tw2*.16)}" y="${N(gy-th2*.72)}" width="${N(tw2*.32)}" height="${N(th2*.22)}" rx="${N(tw2*.16)}" fill="${warm}" opacity=".75"/>`;
    }
    s += `<circle cx="${N(cx)}" cy="${N(y0+bh*.34)}" r="${N(bw*.15)}" fill="${warm}" opacity=".85"/>
      <circle cx="${N(cx)}" cy="${N(y0+bh*.34)}" r="${N(bw*.15)}" fill="none" stroke="${A}" stroke-width="${N(3*sc)}"/>
      <path d="M${N(cx-bw*.11)} ${N(gy)} v${N(-bh*.34)} a${N(bw*.11)} ${N(bw*.11)} 0 0 1 ${N(bw*.22)} 0 V${N(gy)} Z" fill="${A}"/>`;
  }

  else if(cat==="museum"){
    const bw=w*.46, y0=gy-h*.05;
    s += `<rect x="${N(cx-bw/2-8*sc)}" y="${N(y0)}" width="${N(bw+16*sc)}" height="${N(h*.05)}" fill="${A}"/>`;
    const n=5, gap=bw/(n-1);
    for(let i=0;i<n;i++){
      const px2=cx-bw/2+i*gap;
      s += `<rect x="${N(px2-6*sc)}" y="${N(y0-h*.20)}" width="${N(12*sc)}" height="${N(h*.20)}" fill="${M}"/>
        <rect x="${N(px2-8.5*sc)}" y="${N(y0-h*.205)}" width="${N(17*sc)}" height="${N(5*sc)}" fill="${A}"/>`;
    }
    s += `<rect x="${N(cx-bw/2-10*sc)}" y="${N(y0-h*.235)}" width="${N(bw+20*sc)}" height="${N(h*.032)}" fill="${A}"/>
      <path d="M${N(cx-bw/2-14*sc)} ${N(y0-h*.235)} L${N(cx)} ${N(y0-h*.335)} L${N(cx+bw/2+14*sc)} ${N(y0-h*.235)} Z" fill="${M}"/>
      <circle cx="${N(cx)}" cy="${N(y0-h*.268)}" r="${N(7*sc)}" fill="${warm}" opacity=".8"/>`;
  }

  else if(cat==="theater"){
    const aw=w*.52, ah=h*.42, x0=cx-aw/2, y0=gy-ah;
    s += `<path d="M${N(x0)} ${N(gy)} V${N(y0+ah*.28)} Q${N(cx)} ${N(y0-ah*.14)} ${N(x0+aw)} ${N(y0+ah*.28)} V${N(gy)} Z" fill="${M}" opacity=".9"/>`;
    s += `<path d="M${N(cx)} ${N(y0-h*.02)} L${N(cx-aw*.44)} ${N(gy)} L${N(cx+aw*.44)} ${N(gy)} Z" fill="${warm}" opacity=".22"/>`;
    for(const side of [-1,1]){
      const bx=cx+side*aw*.42;
      s += `<path d="M${N(bx)} ${N(y0+ah*.12)} q${N(side*-aw*.16)} ${N(ah*.30)} ${N(side*-aw*.05)} ${N(ah*.88)} L${N(bx)} ${N(gy)} Z" fill="${A}"/>
        <path d="M${N(bx)} ${N(y0+ah*.12)} q${N(side*-aw*.09)} ${N(ah*.32)} ${N(side*-aw*.02)} ${N(ah*.88)}" fill="none" stroke="${HL}" stroke-width="${N(2.4*sc)}" opacity=".28"/>`;
    }
    s += `<circle cx="${N(cx)}" cy="${N(y0-h*.03)}" r="${N(9*sc)}" fill="${warm}"/>
      <circle cx="${N(cx)}" cy="${N(y0-h*.03)}" r="${N(26*sc)}" fill="url(#${u}warm)" opacity=".7"/>`;
  }

  else if(cat==="park"){
    s += `<path d="M${N(w*.30)} ${N(h)} Q${N(cx)} ${N(gy+h*.06)} ${N(w*.62)} ${N(gy)} L${N(w*.74)} ${N(gy)} Q${N(cx+w*.06)} ${N(gy+h*.08)} ${N(w*.52)} ${N(h)} Z" fill="${A}" opacity=".55"/>`;
    const trees=5;
    for(let i=0;i<trees;i++){
      const tx=w*(.10+i*.19)+R(-w*.03,w*.03), ty=gy+R(-h*.02,h*.02), ts=sc*R(.8,1.25);
      s += `<rect x="${N(tx-3.5*ts)}" y="${N(ty-34*ts)}" width="${N(7*ts)}" height="${N(34*ts)}" rx="${N(2*ts)}" fill="${M}"/>
        <circle cx="${N(tx)}" cy="${N(ty-46*ts)}" r="${N(20*ts)}" fill="${A}"/>
        <circle cx="${N(tx-14*ts)}" cy="${N(ty-36*ts)}" r="${N(14*ts)}" fill="${A}" opacity=".9"/>
        <circle cx="${N(tx+14*ts)}" cy="${N(ty-37*ts)}" r="${N(13*ts)}" fill="${A}" opacity=".9"/>
        <circle cx="${N(tx-5*ts)}" cy="${N(ty-52*ts)}" r="${N(11*ts)}" fill="${HL}" opacity=".12"/>`;
    }
    for(let i=0;i<4;i++)
      s += `<ellipse cx="${N(R(0,w))}" cy="${N(gy+R(0,h*.14))}" rx="${N(R(12,26)*sc)}" ry="${N(R(6,11)*sc)}" fill="${M}" opacity=".6"/>`;
  }

  else if(cat==="erleben"){
    const cy2=gy-h*.30, rad=h*.24;
    s += `<line x1="${N(cx-rad*.55)}" y1="${N(gy)}" x2="${N(cx)}" y2="${N(cy2)}" stroke="${M}" stroke-width="${N(5*sc)}"/>
      <line x1="${N(cx+rad*.55)}" y1="${N(gy)}" x2="${N(cx)}" y2="${N(cy2)}" stroke="${M}" stroke-width="${N(5*sc)}"/>
      <circle cx="${N(cx)}" cy="${N(cy2)}" r="${N(rad)}" fill="none" stroke="${M}" stroke-width="${N(4*sc)}"/>
      <circle cx="${N(cx)}" cy="${N(cy2)}" r="${N(rad*.62)}" fill="none" stroke="${M}" stroke-width="${N(2*sc)}" opacity=".7"/>`;
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4, ex=cx+Math.cos(a)*rad, ey=cy2+Math.sin(a)*rad;
      s += `<line x1="${N(cx)}" y1="${N(cy2)}" x2="${N(ex)}" y2="${N(ey)}" stroke="${M}" stroke-width="${N(2*sc)}" opacity=".8"/>
        <circle cx="${N(ex)}" cy="${N(ey)}" r="${N(6.5*sc)}" fill="${warm}" opacity=".9"/>`;
    }
    s += `<circle cx="${N(cx)}" cy="${N(cy2)}" r="${N(8*sc)}" fill="${A}"/>`;
  }

  else if(cat==="einkaufen"){
    const uw=w*.20;
    for(let i=0;i<3;i++){
      const x0=cx-uw*1.55+i*uw*1.08, bh=h*(.20+rnd()*.05), y0=gy-bh;
      s += `<rect x="${N(x0)}" y="${N(y0)}" width="${N(uw)}" height="${N(bh)}" fill="${M}"/>
        <rect x="${N(x0+uw*.12)}" y="${N(y0+bh*.42)}" width="${N(uw*.44)}" height="${N(bh*.40)}" fill="${warm}" opacity=".75"/>
        <rect x="${N(x0+uw*.66)}" y="${N(y0+bh*.36)}" width="${N(uw*.22)}" height="${N(bh*.64)}" rx="${N(uw*.05)}" fill="${A}"/>`;
      const ay=y0+bh*.30, aw=uw*1.04;
      s += `<path d="M${N(x0-uw*.02)} ${N(ay)} h${N(aw)} l${N(-aw*.08)} ${N(h*.035)} h${N(-aw*.84)} Z" fill="${A}"/>`;
      for(let k=0;k<4;k+=2)
        s += `<path d="M${N(x0-uw*.02+k*(aw/4))} ${N(ay)} h${N(aw/4)} l${N(-aw*.02)} ${N(h*.035)} h${N(-aw/4)} Z" fill="#fff" opacity=".45"/>`;
    }
  }

  else { /* alltag */
    s += `<path d="M${N(w*.34)} ${N(h)} L${N(w*.46)} ${N(gy)} L${N(w*.56)} ${N(gy)} L${N(w*.70)} ${N(h)} Z" fill="${M}" opacity=".85"/>`;
    for(let i=0;i<4;i++){
      const t=i/4, yy=gy+(h-gy)*t, xx=w*.51+(w*.01)*t;
      s += `<rect x="${N(xx-2.2*sc-3*t*sc)}" y="${N(yy)}" width="${N(4.5*sc+6*t*sc)}" height="${N(9*sc+8*t*sc)}" fill="#fff" opacity=".55"/>`;
    }
    for(const side of [-1,1]){
      const lx=cx+side*w*.28, lh=h*.30;
      s += `<rect x="${N(lx-2.5*sc)}" y="${N(gy-lh)}" width="${N(5*sc)}" height="${N(lh)}" fill="${M}"/>
        <path d="M${N(lx)} ${N(gy-lh)} q0 ${N(-14*sc)} ${N(side*-20*sc)} ${N(-14*sc)}" fill="none" stroke="${M}" stroke-width="${N(5*sc)}"/>
        <circle cx="${N(lx+side*-20*sc)}" cy="${N(gy-lh-14*sc)}" r="${N(6*sc)}" fill="${warm}"/>
        <circle cx="${N(lx+side*-20*sc)}" cy="${N(gy-lh-14*sc)}" r="${N(24*sc)}" fill="url(#${u}warm)" opacity=".65"/>`;
    }
  }

  /* Randabdunklung */
  s += `<rect width="${w}" height="${h}" fill="none"/></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.replace(/\s+/g," "));
}

/* ---------------- Speicher (§ 25 Abs. 2 Nr. 2 TDDDG) ---------------- */
const store = {
  ok:(()=>{ try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return true; }catch(e){ return false; } })(),
  get(k,d){ if(!this.ok) return d; try{ const v=localStorage.getItem("radius."+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ if(!this.ok) return; try{ localStorage.setItem("radius."+k,JSON.stringify(v)); }catch(e){} },
  clear(){ if(!this.ok) return; Object.keys(localStorage).filter(k=>k.startsWith("radius.")).forEach(k=>localStorage.removeItem(k)); }
};

const S = {
  view:"discover", radius:store.get("radius",3000), mode:null, origin:MD,
  places:[], idx:0, saved:store.get("saved",[]), hidden:store.get("hidden",[]),
  profile:store.get("profile",{}), activeCats:[], loaded:false, loading:false,
  dataSource:"Startbestand"
};

/* ---------------- Hilfsfunktionen ---------------- */
const $ = s => document.querySelector(s);
const main = () => $("#main");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = t => {
  const l=$("#live"); if(l){ l.textContent=""; setTimeout(()=>l.textContent=t,60); }
  const tt=document.getElementById("toast");
  if(tt){ tt.textContent=t; tt.classList.add("on");
    clearTimeout(tt._h); tt._h=setTimeout(()=>tt.classList.remove("on"),4500); }
};

function dist(a,b){
  const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const fmtDist = m => m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const fmtRad  = m => m<1000 ? m+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const walkMin = m => Math.max(1, Math.round(m/80));
const walkTxt = m => { const n=walkMin(m); return n===1 ? "1 Minute" : n+" Minuten"; };

function openState(oh){
  if(!oh) return {s:"unknown", t:"Zeiten unbekannt"};
  const v=oh.trim();
  if(/^24\/7$/.test(v)) return {s:"open", t:"Durchgehend offen"};
  const days=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const now=new Date(), today=days[now.getDay()], mins=now.getHours()*60+now.getMinutes();
  let known=false, open=false;
  for(const part of v.split(";")){
    const m=part.trim().match(/^([A-Za-z,\-]+)\s+(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if(!m) continue;
    const spec=m[1], from=+m[2]*60+ +m[3]; let to=+m[4]*60+ +m[5];
    if(to<=from) to+=1440;
    let hit=false;
    for(const tok of spec.split(",")){
      if(tok.includes("-")){
        const [a,b]=tok.split("-"), ia=days.indexOf(a), ib=days.indexOf(b), it=days.indexOf(today);
        if(ia<0||ib<0) continue;
        if(ia<=ib ? (it>=ia&&it<=ib) : (it>=ia||it<=ib)) hit=true;
      } else if(tok===today) hit=true;
    }
    if(hit){ known=true; if(mins>=from && mins<to) open=true; }
  }
  if(!known) return {s:"unknown", t:"Zeiten unbekannt"};
  return open ? {s:"open", t:"Jetzt geöffnet"} : {s:"closed", t:"Jetzt geschlossen"};
}

/* ---------------- Empfehlungslogik ---------------- */
const W = { dist:0.40, interest:0.30, open:0.20, info:0.10 };

function score(p){
  const sd = Math.max(0, 1 - p._d / Math.max(S.radius,1));
  const prof = S.profile[p.c] || 0;
  const maxProf = Math.max(1, ...Object.values(S.profile).map(Math.abs));
  const si = Math.max(0, Math.min(1, (prof/maxProf + 1)/2));
  const os = p._o.s==="open" ? 1 : p._o.s==="unknown" ? 0.5 : 0.05;
  const inf = (p.oh?0.5:0) + (p.t?0.5:0);
  return W.dist*sd + W.interest*si + W.open*os + W.info*inf;
}

function reasons(p){
  const out=[`${fmtDist(p._d)} entfernt – etwa ${walkTxt(p._d)} zu Fuß`];
  if(p._o.s==="open") out.push("Hat aktuell geöffnet");
  else if(p._o.s==="closed") out.push("Hat gerade geschlossen – deshalb weiter unten");
  else out.push("Öffnungszeiten liegen nicht vor – neutral bewertet");
  const prof=S.profile[p.c]||0;
  if(prof>0) out.push(`Passt zu „${CATMAP[p.c]}“ – ${prof===1?"einmal":prof+"-mal"} gemerkt`);
  else if(prof<0) out.push(`„${CATMAP[p.c]}“ hast du bisher eher ausgeblendet`);
  else out.push(`„${CATMAP[p.c]}“ – noch keine Vorlieben hinterlegt`);
  return out;
}

/* ---------------- Datenaufbereitung ---------------- */
function catOf(tags){
  const vals=[tags.amenity,tags.tourism,tags.leisure,tags.shop].filter(Boolean);
  for(const c of CATS) if(vals.some(v=>c.m.includes(v))) return c.k;
  return null;
}
function allowed(tags){
  if(tags.healthcare) return false;
  if(BLOCKED_AMENITY.includes(tags.amenity))
    return !!tags.tourism && tags.amenity!=="pharmacy" && tags.amenity!=="doctors";
  return true;
}
function prepare(){
  const raw=S.places.map(p=>({...p}));
  raw.forEach(p=>{ p._d=dist(S.origin,p); p._o=openState(p.oh); });
  const cats = S.activeCats.length ? S.activeCats : CATS.map(c=>c.k);
  let list = raw.filter(p => p._d<=S.radius && cats.includes(p.c) && !S.hidden.includes(p.n));
  list.forEach(p=>{ p._s=score(p); });
  list.sort((a,b)=>b._s-a._s);
  if(S.mode==="ueberrasch"){
    const top=list.slice(0,Math.max(8,Math.ceil(list.length*0.4)));
    for(let i=top.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [top[i],top[j]]=[top[j],top[i]]; }
    list=top.concat(list.slice(top.length));
  }
  return list;
}

/* ---------------- OpenStreetMap ---------------- */
const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"
];

async function loadLive(){
  if(S.loading) return;
  S.loading=true; say("Orte werden geladen …"); render();
  const r=Math.max(S.radius,2000)/111000;
  const bb=[S.origin.lat-r, S.origin.lon-r*1.6, S.origin.lat+r, S.origin.lon+r*1.6]
    .map(n=>n.toFixed(4)).join(",");
  const q=`[out:json][timeout:60];(
    nwr(${bb})["amenity"~"^(restaurant|cafe|bar|pub|fast_food|ice_cream|biergarten|theatre|cinema|arts_centre|library|nightclub|fuel)$"]["name"];
    nwr(${bb})["tourism"~"^(attraction|museum|artwork|viewpoint|gallery|zoo|theme_park)$"]["name"];
    nwr(${bb})["leisure"~"^(park|fitness_centre|sports_centre|swimming_pool|garden)$"]["name"];
    nwr(${bb})["shop"~"^(supermarket|mall|bakery|books|clothes|greengrocer)$"]["name"];
  );out center 1500;`;

  let lastErr="unbekannter Fehler";
  for(const url of OVERPASS){
    try{
      const res=await fetch(url,{ method:"POST",
        body:"data="+encodeURIComponent(q),
        headers:{"Content-Type":"application/x-www-form-urlencoded"} });
      if(!res.ok){ lastErr="Server antwortete mit Code "+res.status; continue; }
      const j=await res.json();
      const seen=new Set(), out=[];
      for(const el of (j.elements||[])){
        const t=el.tags||{};
        const lat = el.lat!=null ? el.lat : (el.center ? el.center.lat : null);
        const lon = el.lon!=null ? el.lon : (el.center ? el.center.lon : null);
        if(!t.name || lat==null || lon==null || !allowed(t)) continue;
        const c=catOf(t); if(!c) continue;
        const key=t.name+"|"+c; if(seen.has(key)) continue; seen.add(key);
        out.push({ n:t.name, c, lat, lon, oh:t.opening_hours||"",
          t:t.cuisine ? t.cuisine.replace(/[_;]/g," ") : (t.description||""),
          adr:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ") });
      }
      if(out.length){
        S.places=out; S.loaded=true;
        S.dataSource="OpenStreetMap, "+out.length+" Orte";
        say(out.length+" Orte aus OpenStreetMap geladen.");
        S.loading=false; S.idx=0; render(); return;
      }
      lastErr="Antwort enthielt keine passenden Orte";
    }catch(e){ lastErr = e && e.message ? e.message : "Verbindung fehlgeschlagen"; }
  }
  S.dataSource="Startbestand – Abruf fehlgeschlagen";
  say("Abruf nicht möglich: "+lastErr);
  S.loading=false; render();
}

function useGeo(){
  if(!navigator.geolocation){ say("Standortbestimmung wird nicht unterstützt."); return; }
  say("Standort wird ermittelt …");
  navigator.geolocation.getCurrentPosition(
    pos=>{ S.origin={lat:pos.coords.latitude, lon:pos.coords.longitude, label:"Dein Standort"};
      S.idx=0; say("Standort übernommen."); render(); },
    ()=>say("Standort nicht verfügbar. Es bleibt bei Magdeburg, Stadtmitte."),
    {enableHighAccuracy:false, timeout:8000, maximumAge:300000});
}

/* ---------------- Aktionen ---------------- */
const isSaved = n => S.saved.some(x=>x.n===n);
function bump(p,v){ S.profile[p.c]=(S.profile[p.c]||0)+v; store.set("profile",S.profile); }
function save(p){
  if(!isSaved(p.n)){ S.saved.push({n:p.n,c:p.c,lat:p.lat,lon:p.lon,t:p.t||"",adr:p.adr||"",oh:p.oh||""});
    store.set("saved",S.saved); bump(p,1); say(`„${p.n}“ gemerkt.`); }
  else { S.saved=S.saved.filter(x=>x.n!==p.n); store.set("saved",S.saved); say(`„${p.n}“ entfernt.`); }
}
function hide(p){
  if(!S.hidden.includes(p.n)){ S.hidden.push(p.n); store.set("hidden",S.hidden); bump(p,-0.5); say(`„${p.n}“ ausgeblendet.`); }
}

/* ---------------- Bausteine ---------------- */
function altOf(p){
  return `Stilisierte Illustration in den Farben der Kategorie ${CATMAP[p.c]||"Ort"} – kein Foto des Ortes`;
}
function whyBlock(p){
  return `<div class="why"><h3>Warum dieser Vorschlag</h3><ul>${
    reasons(p).map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
}
function pills(p){
  const o=p._o;
  return `<div class="meta">
    <span class="pill dist">${fmtDist(p._d)} · ${walkMin(p._d)} Min</span>
    <span class="pill ${o.s==="open"?"open":o.s==="closed"?"closed":""}">${esc(o.t)}</span>
    ${p.adr?`<span class="pill">${esc(p.adr)}</span>`:""}
  </div>`;
}

  $("#bMode")?.addEventListener("click",()=>{ S.mode=null; render(); });
  $("#reset")?.addEventListener("click",()=>{ S.hidden=[]; store.set("hidden",[]); S.idx=0;
    say("Ausgeblendete Orte wurden zurückgeholt."); render(); });
  if(p && !S.loading && $("#card")){
    $("#bYes")?.addEventListener("click",()=>{ save(p); render(); });
    $("#bNo")?.addEventListener("click",()=>{ hide(p); render(); });
    $("#bSkip")?.addEventListener("click",()=>{ S.idx++; render(); });
    swipe($("#card"), ()=>{ save(p); render(); }, ()=>{ hide(p); render(); });
  }
  bindList();
}

/* ---------------- Listenansicht (gleichwertige Alternative) ---------------- */
function listView(list,title,total){
  if(!list.length) return "";
  return `<div class="sechead"><h2>${esc(title)}</h2><span class="cnt">${total??list.length} Treffer</span></div>
  <ul class="list">${list.map((p,i)=>`
    <li>
      <div class="lrow">
        <div class="lthumb"><img src="${cover(p.n,p.c,240,320)}" alt="${esc(altOf(p))}"></div>
        <div class="lmain">
          <h3>${esc(p.n)}</h3>
          ${p.t?`<p class="desc" style="margin-bottom:8px">${esc(p.t)}</p>`:""}
          ${pills(p)}
        </div>
      </div>
      ${whyBlock(p)}
      <div class="lact">
        <button class="btn sm" data-act="save" data-n="${esc(p.n)}">${isSaved(p.n)?"Gemerkt ✓":"Merken"}</button>
        <button class="btn sm" data-act="hide" data-n="${esc(p.n)}">Ausblenden</button>
        <button class="btn sm ghost" data-act="jump" data-i="${i}">Als Karte zeigen</button>
      </div>
    </li>`).join("")}</ul>`;
}
function bindList(){
  main().querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.act==="jump"){ S.idx=+b.dataset.i; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
    const list=prepare();
    const p=list.find(x=>x.n===b.dataset.n) || S.saved.find(x=>x.n===b.dataset.n);
    if(!p) return;
    if(b.dataset.act==="save") save(p); else hide(p);
    render();
  }));
}

/* ---------------- Wischgesten (stets mit Schaltflächen-Alternative) ---------------- */
function swipe(el,onRight,onLeft){
  if(!el) return;
  const sy=$("#stampY"), sn=$("#stampN");
  let x0=null,y0=null,dx=0,lock=null;
  el.addEventListener("pointerdown",e=>{ x0=e.clientX; y0=e.clientY; dx=0; lock=null;
    el.style.transition="none"; el.setPointerCapture?.(e.pointerId); });
  el.addEventListener("pointermove",e=>{
    if(x0===null) return;
    dx=e.clientX-x0; const dy=e.clientY-y0;
    if(lock===null && (Math.abs(dx)>8||Math.abs(dy)>8)) lock=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(lock!=="x") return;
    el.style.transform=`translateX(${dx}px) rotate(${dx/26}deg)`;
    const t=Math.min(Math.abs(dx)/95,1);
    if(sy) sy.style.opacity = dx>0 ? t : 0;
    if(sn) sn.style.opacity = dx<0 ? t : 0;
  });
  const end=()=>{
    if(x0===null) return;
    const d=dx; x0=null;
    if(sy) sy.style.opacity=0; if(sn) sn.style.opacity=0;
    el.style.transition="transform .28s cubic-bezier(.22,1,.36,1)";
    if(lock==="x" && Math.abs(d)>90){
      el.style.transform=`translateX(${d>0?600:-600}px) rotate(${d>0?24:-24}deg)`;
      setTimeout(()=> d>0?onRight():onLeft(), 150);
    } else el.style.transform="";
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"){ e.preventDefault(); onRight(); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); onLeft(); }
  });
}

/* ---------------- Steuerung ---------------- */
function renderControls(){
  const show = S.view==="discover" && S.mode;
  $("#controls").classList.toggle("hidden", !show);
  if(!show) return;
  const chips=$("#chips");
  const ordered=[...CATS].sort((a,b)=>
    (S.activeCats.includes(b.k)?1:0)-(S.activeCats.includes(a.k)?1:0));
  chips.innerHTML=ordered.map(c=>
    `<button type="button" class="chip" data-c="${c.k}" aria-pressed="${S.activeCats.includes(c.k)}">${esc(c.l)}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.c;
    S.activeCats = S.activeCats.includes(k) ? S.activeCats.filter(x=>x!==k) : [...S.activeCats,k];
    S.idx=0; render();
  }));
  $("#rad").value=S.radius;
  $("#radval").textContent=fmtRad(S.radius);
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    if(b.dataset.view===S.view) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  if(S.view==="discover" && !S.mode) viewStart();
  else if(S.view==="discover") viewDiscover();
  else if(S.view==="saved") viewSaved();
  else if(S.view==="how") viewHow();
  else viewLegal();
  renderControls();
}

function init(){
  if(!S.places.length) S.places=FALLBACK_PLACES.map(p=>({...p,oh:p.oh||""}));
  S.mode=store.get("mode",null);
  if(S.mode && MODES[S.mode]) S.activeCats=[...MODES[S.mode].cats]; else S.mode=null;
  document.querySelectorAll("nav.tabs button").forEach(b=>
    b.addEventListener("click",()=>{ S.view=b.dataset.view; window.scrollTo({top:0}); render(); main().focus(); }));
  $("#rad").addEventListener("input",e=>{
    S.radius=+e.target.value; $("#radval").textContent=fmtRad(S.radius); store.set("radius",S.radius); });
  $("#rad").addEventListener("change",()=>{ S.idx=0; render(); });
  render();
}
document.addEventListener("DOMContentLoaded",init);
</script>
