<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0b10">
<title>Radiux – Magdeburg entdecken</title>
<style>
  /* ---------- Farbwelten ----------
     Alle Farben stecken in Variablen. Ein Wechsel des Erscheinungsbildes tauscht
     nur diese Werte aus – kein zweites Stilblatt, kein Nachladen.
     Ohne eigene Wahl richtet sich Radiux nach der Einstellung des Geräts. */
  :root{
    --blur:blur(22px) saturate(125%);
    --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
    --card-h:clamp(320px,47vh,452px);
    --ease:cubic-bezier(.2,.8,.2,1);
    --micro:.68rem;
      --bg:#09090a; --bg-2:#0d0d0e;
      --surface:#121213; --surface-2:#191919; --surface-3:#232322;
      --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.15);
      --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.085);
      --glass-line:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.20);
      --veil:rgba(9,9,10,.80); --card-veil:rgba(31,31,34,.74); --card-solid:#1b1b1d;
      --text:#f3f2ef; --text-dim:#9d9c97; --text-mute:#6b6a66;
      --accent:#efece4; --accent-ink:#0b0b0c;
      --pos:#8fbb96; --neg:#cf918a; --warn:#c9a86a;
      --shine:#5aa8ff; --shine-hot:#eaf6ff;
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#f4f3f0; --bg-2:#eceae5;
      --surface:#ffffff; --surface-2:#f7f6f3; --surface-3:#eceae5;
      --line:rgba(18,18,16,.10); --line-2:rgba(18,18,16,.2);
      --glass:rgba(255,255,255,.5); --glass-2:rgba(255,255,255,.7);
      --glass-line:rgba(18,18,16,.12); --glass-hi:rgba(255,255,255,.9);
      --veil:rgba(244,243,240,.82); --card-veil:rgba(255,255,255,.66); --card-solid:#ffffff;
      --text:#121210; --text-dim:#575652; --text-mute:#7d7c77;
      --accent:#16150f; --accent-ink:#ffffff;
      --pos:#3a7a49; --neg:#a63a30; --warn:#8a6a1e;
      --shine:#2f6fd0; --shine-hot:#0d2b52;
    }
  }
  html[data-thema="dunkel"]{
      --bg:#09090a; --bg-2:#0d0d0e;
      --surface:#121213; --surface-2:#191919; --surface-3:#232322;
      --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.15);
      --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.085);
      --glass-line:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.20);
      --veil:rgba(9,9,10,.80); --card-veil:rgba(31,31,34,.74); --card-solid:#1b1b1d;
      --text:#f3f2ef; --text-dim:#9d9c97; --text-mute:#6b6a66;
      --accent:#efece4; --accent-ink:#0b0b0c;
      --pos:#8fbb96; --neg:#cf918a; --warn:#c9a86a;
      --shine:#5aa8ff; --shine-hot:#eaf6ff;
  }
  html[data-thema="hell"]{
      --bg:#f4f3f0; --bg-2:#eceae5;
      --surface:#ffffff; --surface-2:#f7f6f3; --surface-3:#eceae5;
      --line:rgba(18,18,16,.10); --line-2:rgba(18,18,16,.2);
      --glass:rgba(255,255,255,.5); --glass-2:rgba(255,255,255,.7);
      --glass-line:rgba(18,18,16,.12); --glass-hi:rgba(255,255,255,.9);
      --veil:rgba(244,243,240,.82); --card-veil:rgba(255,255,255,.66); --card-solid:#ffffff;
      --text:#121210; --text-dim:#575652; --text-mute:#7d7c77;
      --accent:#16150f; --accent-ink:#ffffff;
      --pos:#3a7a49; --neg:#a63a30; --warn:#8a6a1e;
      --shine:#2f6fd0; --shine-hot:#0d2b52;
  }
  html[data-thema="neon"]{
      --bg:#0a0714; --bg-2:#100a20;
      --surface:#150e28; --surface-2:#1d1436; --surface-3:#291c4a;
      --line:rgba(196,160,255,.16); --line-2:rgba(196,160,255,.3);
      --glass:rgba(160,110,255,.10); --glass-2:rgba(160,110,255,.18);
      --glass-line:rgba(196,160,255,.26); --glass-hi:rgba(255,255,255,.22);
      --veil:rgba(10,7,20,.82); --card-veil:rgba(29,20,54,.78); --card-solid:#1d1436;
      --text:#f6f2ff; --text-dim:#b6a6d6; --text-mute:#8878ad;
      --accent:#c8ff4d; --accent-ink:#150e28;
      --pos:#5ce7a8; --neg:#ff7a9c; --warn:#ffd166;
      --shine:#b06bff; --shine-hot:#e8ff9e;
  }
  *{box-sizing:border-box}
  html{margin:0;padding:0;background:var(--bg)}
  body{margin:0;padding:0;background:transparent;color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    font-size:16px;line-height:1.55;letter-spacing:-.012em;
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
    min-height:100dvh}
  /* Das Wasserzeichen wird oben verankert, nicht mittig.
     Prozentwerte und Mittelzentrierung beziehen sich auf die sichtbare Fensterhoehe -
     und die aendert sich am Handy, sobald die Adresszeile ein- oder ausfaehrt.
     Genau daher kam das Zucken beim Scrollen. Mit einem festen Abstand von oben
     und einer eigenen Ebene fuer die Grafik bleibt das R ruhig stehen. */
  .wmark{position:fixed;left:50%;top:12vh;
    transform:translate3d(-50%,0,0);backface-visibility:hidden;
    width:min(112vw,660px);z-index:-1;pointer-events:none;opacity:.72;
    contain:layout paint}
  .wmark svg{width:100%;height:auto;display:block}
  body.nowmark .wmark{display:none}
  @media (prefers-color-scheme:light){ .wmark{opacity:.4} }

  .wrap{max-width:620px;margin:0 auto;padding:0 22px}
  main.wrap{padding-bottom:74px;scroll-margin-top:0}
  main:focus{outline:none}
  h1,h2,h3{line-height:1.1;margin:0 0 .5em;letter-spacing:-.035em;font-weight:600}
  h1{font-size:clamp(2.1rem,9vw,2.7rem)}
  h2{font-size:1.3rem}
  h3{font-size:1.02rem}
  p{margin:0 0 .95em}
  a{color:var(--text);text-underline-offset:3px}
  button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--text);outline-offset:3px;border-radius:4px}
  .skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--accent-ink);
    padding:12px 18px;z-index:99;font-weight:600}
  .skip:focus{left:0;top:0}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .micro{font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    font-weight:600;color:var(--text-mute)}

  /* ---------- Kopf ---------- */
  header.app{position:sticky;top:0;z-index:30;background:var(--veil);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:12px;padding:18px 0 15px;min-width:0}
  .blogo{width:24px;height:30px;flex:0 0 auto;display:block;color:var(--text)}
  .blogo svg{width:100%;height:100%;display:block}
  .brand{font-weight:600;font-size:1.06rem;letter-spacing:.24em;text-transform:uppercase;
    margin-right:auto;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis}
  .modebtn{font-size:var(--micro);text-transform:uppercase;letter-spacing:.14em;font-weight:600;
    color:var(--text-dim);white-space:nowrap;background:var(--glass);cursor:pointer;
    border:1px solid var(--glass-line);border-radius:99px;padding:9px 15px;min-height:38px;
    max-width:52vw;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;
    transition:color .2s,background .2s}
  .modebtn:hover{color:var(--text);background:var(--glass-2)}

  .controls{padding:2px 22px 18px;border-bottom:1px solid var(--line)}
  .rng{display:flex;align-items:center;gap:14px;width:100%;margin:8px 0 16px;min-width:0}
  .rng.aus input[type=range]{opacity:.3}
  .rng.aus label,.rng.aus .radval{color:var(--text-mute)}
  .rng label{flex:0 0 auto;font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    font-weight:600;color:var(--text-mute)}
  .geobtn{flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
    border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);
    color:var(--text-mute);transition:color .2s,background .2s,border-color .2s;margin-left:-4px}
  .geobtn svg{width:18px;height:18px}
  .geobtn:hover{color:var(--text)}
  .geobtn[aria-pressed=true]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .tinylink{background:none;border:0;padding:6px 0;font:inherit;font-size:.82rem;cursor:pointer;
    color:var(--text-dim);text-decoration:underline;text-underline-offset:4px;
    text-transform:none;letter-spacing:0;white-space:nowrap;transition:color .2s}
  .tinylink:hover{color:var(--text)}
  input[type=range]{flex:1;min-width:90px;height:30px;appearance:none;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-2)}
  input[type=range]::-moz-range-track{height:2px;background:var(--line-2)}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;margin-top:-7px;
    border-radius:50%;background:var(--text);border:0}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:0}
  .radval{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;
    min-width:58px;text-align:right;flex:0 0 auto;color:var(--text)}
  @media (max-width:360px){
    .rng{gap:10px}
    .rng label{font-size:0;letter-spacing:0}
    .rng label::after{content:"Umkreis";font-size:var(--micro);letter-spacing:.16em}
  }

  .srch{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:0 14px;
    border:1px solid var(--glass-line);border-radius:99px;background:var(--glass);}
  .srch svg{width:17px;height:17px;flex:0 0 auto;color:var(--text-mute)}
  .srch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);
    font:inherit;font-size:.92rem;padding:12px 0;min-height:44px}
  .srch input::placeholder{color:var(--text-mute)}
  .srch input::-webkit-search-cancel-button{display:none}
  .srch button{background:none;border:0;color:var(--text-mute);cursor:pointer;
    font-size:.9rem;padding:8px;line-height:1}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border-radius:99px;padding:8px 15px;cursor:pointer;min-height:38px;
    font-size:.82rem;font-weight:500;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--glass-line);
    box-shadow:inset 0 1px 0 var(--glass-hi);
    transition:color .2s,background .2s,border-color .2s}
  .chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

  /* ---------- Schaltflächen ---------- */
  .btn{position:relative;overflow:hidden;border-radius:99px;padding:12px 20px;cursor:pointer;
    min-height:46px;font-weight:500;font-size:.92rem;color:var(--text);
    background:var(--glass);border:1px solid var(--glass-line);
    box-shadow:inset 0 1px 0 var(--glass-hi);
    transition:background .2s,border-color .2s,opacity .2s}
  .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 52%)}
  .btn:hover{background:var(--glass-2)}
  .btn:active{opacity:.65}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
    font-weight:600;box-shadow:none}
  .btn.primary::after{display:none}
  .btn.sm{padding:8px 15px;min-height:38px;font-size:.8rem}
  .btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--text-dim)}
  .btn.ghost::after{display:none}
  .btn-row{display:flex;gap:9px;margin:18px 0 8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .btn-row::-webkit-scrollbar{display:none}
  .btn-row .btn{flex:0 0 auto;white-space:nowrap}

  /* ---------- Start ---------- */
  .hero{padding:58px 0 10px}
  .welcome{padding:70px 0 10px;max-width:40ch;margin:0 auto;text-align:left;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,
      "Hoefler Text","Times New Roman",serif;
    font-size:1.12rem;line-height:1.68;letter-spacing:0;color:var(--text-dim)}
  .welcome p{margin:0 0 18px}
  .welcome .wgreet{font-size:1.9rem;line-height:1.2;color:var(--text);margin-bottom:20px;
    letter-spacing:-.01em}
  .wact{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px;
    font-family:var(--font);font-size:1rem}
  .welcome .soon{font-family:var(--font);font-size:var(--micro);text-transform:uppercase;
    letter-spacing:.16em;font-weight:600;color:var(--text-mute);
    margin:26px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
  .inlink{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:var(--text);
    text-decoration:underline;text-underline-offset:3px}
  .hero h1{margin-bottom:.24em}
  .hero .lead{color:var(--text-dim);font-size:1.02rem;margin-bottom:42px;max-width:32ch}
  .hero{text-align:center;padding-top:34px}
  .hero .lead{margin-left:auto;margin-right:auto}
  .modes{display:grid;gap:0;border-top:1px solid var(--line)}
  .mode{position:relative;border:0;border-bottom:1px solid var(--line);background:transparent;
    padding:0;cursor:pointer;text-align:left;width:100%;transition:background .2s}
  .mode:hover{background:var(--surface-2)}
  .mode:active{opacity:.6}
  .mode .mi{display:block;padding:24px 12px;text-align:center}

  .mode .mt{font-weight:600;font-size:1.16rem;display:block;letter-spacing:-.03em}
  .mode .ms{font-size:.88rem;color:var(--text-dim);display:block;margin-top:3px}


  /* ---------- Karte ---------- */
  .deck{position:relative;height:var(--card-h);margin:22px 0 20px}
  .card{position:absolute;inset:0;border-radius:var(--r-xl);overflow:hidden;
    background:var(--card-solid);border:1px solid var(--glass-line);
    box-shadow:inset 0 1px 0 var(--glass-hi), 0 30px 70px -26px rgba(0,0,0,.95);
    cursor:pointer;transform:translateZ(0);
    display:flex;flex-direction:column;touch-action:pan-y;user-select:none}
  .card.dragging{will-change:transform}
  .card.behind{transform:scale(.96) translateY(12px);opacity:.3;z-index:1}
  .card.front{z-index:2;animation:cardIn .45s var(--ease)}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .cover{position:relative;height:52%;min-height:180px;flex:0 0 auto;overflow:hidden;background:var(--surface-2)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(5,5,6,.55) 0%,rgba(5,5,6,.05) 30%,
      rgba(5,5,6,.62) 66%,rgba(5,5,6,.96) 100%)}
  .cover .catbadge,.cover .fict{position:absolute;top:18px;z-index:2;
    font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;font-weight:600}
  .cover .catbadge{left:20px;color:#fff}
  .cover .fict{right:20px;color:rgba(255,255,255,.5)}
  .ctitle{position:absolute;left:20px;right:20px;bottom:18px;z-index:2}
  .ctitle h2{font-size:clamp(1.6rem,6.6vw,2.1rem);line-height:1.04;margin:0 0 6px;color:#fff;
    letter-spacing:-.04em;font-weight:600}
  .ctitle .desc{margin:0;color:rgba(255,255,255,.72);font-size:.88rem;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cbody{padding:18px 20px 0;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
  .cbody .whyline{margin-top:auto;padding-bottom:2px}
  .cactions{display:flex;align-items:center;gap:4px;flex:0 0 auto;padding:16px 0 18px}
  .cactions button{background:none;border:0;padding:10px 8px;cursor:pointer;border-radius:99px;
    font-size:.86rem;font-weight:500;color:var(--text-mute);
    transition:color .18s,background .18s,opacity .18s}
  .cactions button:hover{color:var(--text-dim)}
  .cactions button:active{opacity:.55}
  .cactions .keep{margin-left:auto;background:var(--accent);color:var(--accent-ink);
    font-weight:600;padding:11px 24px;min-height:42px}
  .whyline{margin:14px 0 0;font-size:.88rem;color:var(--text-dim);line-height:1.5}
  .whyline .micro{display:inline-block;margin-right:9px;color:var(--text-mute)}
  .desc{color:var(--text-dim);font-size:.9rem}
  .meta{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px;align-items:center}
  .pill{font-size:.8rem;font-weight:500;color:var(--text-dim);background:none;border:0;padding:0}
  .pill.dist{color:var(--text);font-weight:600}
  .pill.open{color:var(--pos)}
  .pill.closed{color:var(--neg)}
  .pill.soon{color:var(--text);font-weight:600}
  .edate{font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    font-weight:600;color:#fff;opacity:.92;margin-bottom:9px}
  .why{margin-top:22px;padding:16px 0 2px;border-top:1px solid var(--line)}
  .why h3{font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    color:var(--text-mute);margin-bottom:8px;font-weight:600}
  .why ul{margin:0;padding-left:0;list-style:none;font-size:.86rem;color:var(--text-dim)}
  .why li{margin-bottom:5px;padding-left:14px;position:relative}
  .why li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:1px;background:var(--text-mute)}
  .hint{font-size:.76rem;color:var(--text-mute);margin:14px 0 0;text-align:center}
  .undo{background:none;border:0;padding:2px 4px;cursor:pointer;font:inherit;
    color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px}

  .stamp{position:absolute;top:26px;z-index:5;font-size:.82rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.2em;padding:9px 16px;border-radius:99px;opacity:0;
    border:1px solid currentColor;pointer-events:none;transition:opacity .12s;
    background:rgba(8,8,10,.78)}
  .stamp.yes{left:20px;color:#fff}
  .stamp.no{right:20px;color:#fff}

  .counter{font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    color:var(--text-mute);text-align:center;margin:0 0 4px;font-weight:600}

  /* ---------- Liste ---------- */
  .sechead{display:flex;align-items:baseline;gap:10px;margin:52px 0 4px;
    padding-bottom:14px;border-bottom:1px solid var(--line)}
  .sechead h2{margin:0;font-size:1.02rem;font-weight:600;letter-spacing:-.02em}
  .sechead .cnt{font-size:var(--micro);text-transform:uppercase;letter-spacing:.16em;
    color:var(--text-mute);margin-left:auto;font-weight:600}
  .list{list-style:none;margin:0;padding:0;display:block}
  .list > li{content-visibility:auto;contain-intrinsic-size:auto 150px;border-bottom:1px solid var(--line);padding:20px 0;background:none;border-radius:0;
    opacity:0;transform:translateY(10px);animation:rise .5s var(--ease) forwards}
  .list > li:nth-child(1){animation-delay:.02s} .list > li:nth-child(2){animation-delay:.06s}
  .list > li:nth-child(3){animation-delay:.10s} .list > li:nth-child(4){animation-delay:.14s}
  .list > li:nth-child(n+5){animation-delay:.18s}
  @keyframes rise{to{opacity:1;transform:none}}
  .lrow{display:flex;gap:16px;align-items:flex-start;
    width:100%;background:none;border:0;padding:0;text-align:left;font:inherit;
    color:inherit;cursor:pointer;border-radius:var(--r-md);
    transition:opacity .18s}
  .lrow:active{opacity:.6}
  .lname{display:block;margin-bottom:5px;font-size:1.08rem;font-weight:600;
    letter-spacing:-.028em;line-height:1.25;color:var(--text)}
  .lthumb{width:96px;height:96px;flex:0 0 auto;position:relative;overflow:hidden;
    border-radius:var(--r-md);background:var(--glass);
    box-shadow:inset 0 0 0 1px var(--glass-line)}
  .lthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .lmain{padding:0;flex:1;min-width:0}
  .lmain h3{margin-bottom:5px;font-size:1.08rem;font-weight:600;letter-spacing:-.028em}
  .lact{display:flex;gap:9px;padding:14px 0 0;flex-wrap:wrap;align-items:center}
  .lact a.btn{text-decoration:none;display:inline-flex;align-items:center}
  .list .why{margin:14px 0 0;padding-top:12px}

  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<script>
/* Startbestand Magdeburg – bekannte Orte, dient als Grundlage, solange keine
   Live-Abfrage bei OpenStreetMap erfolgt ist.
   Quelle: OpenStreetMap-Mitwirkende, ODbL. Angaben ungeprüft. */
const FALLBACK_PLACES = [
  {n:"Magdeburger Dom",c:"sehenswuerdigkeit",lat:52.12472,lon:11.63472,t:"Gotische Kathedrale, Wahrzeichen der Stadt",oh:"Mo-Sa 10:00-17:00",i:"Baubeginn 1209, fertig erst 1520 – über drei Jahrhunderte Bauzeit. Es ist die erste Kirche auf deutschem Boden, die von Anfang an gotisch geplant wurde, und die erste, die fertig wurde. Hier liegt Kaiser Otto der Große begraben, zusammen mit seiner ersten Frau Editha, deren Gebeine 2008 in einem Bleisarg wiedergefunden wurden. Der Nordturm misst rund 101 Meter; die Aussichtsplattform auf 81,5 Metern erreicht man über 433 Stufen."},
  {n:"Grüne Zitadelle von Magdeburg",c:"sehenswuerdigkeit",lat:52.12683,lon:11.63797,t:"Letzter Entwurf von Friedensreich Hundertwasser",i:"Der letzte Entwurf von Friedensreich Hundertwasser. Er starb im Jahr 2000, fünf Jahre vor der Eröffnung 2005. Krumme Linien, keine geraden Fenster, Bäume auf und im Gebäude – gebaut als Gegenentwurf zur Rasterarchitektur ringsum. Drinnen: Läden, ein Café, ein Restaurant, ein Theater, ein Hotel und über fünfzig Wohnungen. Man darf hineingehen."},
  {n:"Kloster Unser Lieben Frauen",c:"museum",lat:52.12583,lon:11.63700,t:"Kunstmuseum und Konzerthalle",oh:"Tu-Su 10:00-17:00",i:"Um 1015 gegründet und damit älter als fast alles andere in der Stadt – eines der bedeutendsten romanischen Bauwerke Deutschlands. Heute ist es zweierlei: Kunstmuseum mit den Sammlungen der Stadt und, in der ehemaligen Klosterkirche, die Konzerthalle Georg Philipp Telemann. Nach langer Sanierung 2022 wieder geöffnet."},
  {n:"Kulturhistorisches Museum",c:"museum",lat:52.12900,lon:11.63200,t:"Stadtgeschichte und Magdeburger Halbkugeln",oh:"Tu-Su 10:00-17:00",i:"Eröffnet 1906, damals als Kaiser-Friedrich-Museum. Das bekannteste Stück ist der Magdeburger Reiter – die älteste freistehende Reiterstatue nördlich der Alpen, das Original steht hier im Kaiser-Otto-Saal. Die Sammlung reicht von Archäologie über Stadtgeschichte bis zu Malerei und Textilien."},
  {n:"Technikmuseum Magdeburg",c:"museum",lat:52.13600,lon:11.63900,t:"Technikgeschichte zum Anfassen",oh:"Tu-Su 10:00-17:00",i:"Magdeburg war jahrzehntelang Schwermaschinenstadt. Das Museum zeigt, was hier gebaut wurde: Dampfmaschinen, Werkzeugmaschinen, Alltagstechnik. Vieles darf man anfassen und in Bewegung setzen – gedacht für Leute, die wissen wollen, wie etwas funktioniert."},
  {n:"Elbauenpark",c:"park",lat:52.13550,lon:11.67200,t:"Großer Landschaftspark mit Seebühne",i:"Entstanden 1999 zur Bundesgartenschau auf einem ehemaligen Militärgelände. Rund hundert Hektar Wiesen, Gärten und Wege, dazu die Seebühne für Konzerte im Sommer und ein Schmetterlingshaus. Der große Park der Stadt für alles, was draußen stattfindet."},
  {n:"Jahrtausendturm",c:"sehenswuerdigkeit",lat:52.13500,lon:11.67100,t:"Aussichts- und Ausstellungsturm im Elbauenpark",i:"60 Meter hoch und aus Holz – nach Angaben des Betreibers das höchste Holzgebäude seiner Art weltweit. Innen liegt auf fünf Ebenen eine Ausstellung zu 6000 Jahren Technik- und Wissenschaftsgeschichte, mit rund 200 Exponaten, davon 150 zum Ausprobieren. Eine 450 Meter lange Rampe führt spiralförmig nach oben zur Plattform auf 43 Metern."},
  {n:"Zoo Magdeburg",c:"erleben",lat:52.15600,lon:11.61000,t:"Zoologischer Garten",oh:"Mo-Su 09:00-18:00",i:"Einer der größeren Zoos Ostdeutschlands, bekannt vor allem für die Afrika-Anlagen. Genug für einen ganzen Nachmittag, und ein verlässlicher Plan, wenn das Wetter nicht mitspielt oder Kinder dabei sind."},
  {n:"Rotehornpark",c:"park",lat:52.12000,lon:11.64500,t:"Stadtpark auf dem Werder",i:"Der Stadtpark auf dem Werder, einer Insel zwischen Elbe und Alter Elbe. Alte Bäume, weite Wiesen, das Pferdetor und die Stadthalle. Wer nur eine Stunde Zeit hat und wirklich raus will, geht hierher."},
  {n:"Herrenkrugpark",c:"park",lat:52.14500,lon:11.67000,t:"Landschaftspark an der Elbe",i:"Landschaftspark im englischen Stil am rechten Elbufer, angelegt im 19. Jahrhundert. Weitläufig, ruhig, mit altem Baumbestand – der Park, in dem man niemandem begegnen muss."},
  {n:"Gruson-Gewächshäuser",c:"erleben",lat:52.12100,lon:11.64300,t:"Botanische Schauhäuser",oh:"Tu-Su 10:00-16:00",i:"1896 eröffnet, gestiftet vom Magdeburger Industriellen Hermann Gruson aus seiner eigenen Pflanzensammlung. Zehn Schauhäuser, rund 4000 Quadratmeter unter Glas, etwa 4900 Pflanzenarten von fünf Kontinenten. Im 16 Meter hohen Palmenhaus führt ein Steg durch die Baumkronen. Seit der Sanierung 2021 wieder offen."},
  {n:"Opernhaus Magdeburg",c:"theater",lat:52.13000,lon:11.63500,t:"Oper und Schauspiel",i:"Das große Haus des Theaters Magdeburg: Oper, Ballett und Konzerte. Wer schauen will, was läuft, findet den Spielplan auf der Website des Hauses – Radiux zeigt Termine bisher nur ausschnittweise."},

async function loadEvents(){
  try{
    const r = await fetch("events.json", { cache:"no-store" });
    if(r.ok){ const j = await r.json(); if(Array.isArray(j)) EVENTS = j; }
  }catch(e){ /* Grundbestand bleibt */ }
  render();
}

const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli",
                "August","September","Oktober","November","Dezember"];

function evDate(iso){ const d = new Date(iso); return isNaN(d) ? null : d; }
function evLabel(iso){
  const d = evDate(iso); if(!d) return "Termin unbekannt";
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const e = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((e - t) / 86400000);
  const uhr = d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
  if(days === 0) return "Heute, " + uhr + " Uhr";
  if(days === 1) return "Morgen, " + uhr + " Uhr";
  if(days > 1 && days < 7) return DAYS[d.getDay()] + ", " + uhr + " Uhr";
  return DAYS[d.getDay()] + ", " + d.getDate() + ". " + MONTHS[d.getMonth()] + ", " + uhr + " Uhr";
}
function evDaysUntil(iso){
  const d = evDate(iso); if(!d) return 999;
  return Math.max(0, (d.getTime() - Date.now()) / 86400000);
}
function eventsAsPlaces(){
  const now = Date.now();
  return EVENTS
    .filter(e => { const d = evDate(e.start); return d && d.getTime() > now - 3*3600*1000; })
    .map(e => {
      let lat=+e.lat, lon=+e.lon, approx=!!e.approx;
      /* Ist der Veranstaltungsort unter gleichem Namen aus OpenStreetMap geladen,
         wird dessen genaue Lage übernommen. */
      if(approx && e.v){
        const hit = S.places.find(x => norm(x.n) && norm(e.v).includes(norm(x.n)) && norm(x.n).length>4);
        if(hit){ lat=hit.lat; lon=hit.lon; approx=false; }
      }
      return { n:e.t, c:"event", lat, lon, oh:"", approx,
               t:e.v || "", start:e.start, url:e.u || "", src:e.src || "", adr:"" };
    });
}

/* ---------- Neutrale Fläche, falls kein Foto vorliegt ---------- */
function hashOf(x){ let h=2166136261; for(let i=0;i<x.length;i++){ h^=x.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

/* Liest eine Farbe aus der aktuellen Farbwelt, damit die Ersatzflaeche dazu passt. */
function cssFarbe(name, ersatz){
  try{
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || ersatz;
  }catch(e){ return ersatz; }
}
function plate(name, cat, w, h){
  const label = esc(String(CATMAP[cat] || "Ort").toUpperCase());
  const id = "p" + (hashOf(name + cat) % 9999);
  const fs = Math.round(h * 0.115);
  const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`
    + `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">`
    + `<stop offset="0" stop-color="${cssFarbe("--surface-3","#1d1d1e")}"/>`
    + `<stop offset="1" stop-color="${cssFarbe("--surface","#0d0d0e")}"/></linearGradient></defs>`
    + `<rect width="${w}" height="${h}" fill="url(#${id})"/>`
    + `<text x="${w/2}" y="${h/2}" fill="${cssFarbe("--text","#ffffff")}" fill-opacity="0.13"`
    + ` font-family="system-ui,-apple-system,sans-serif" font-size="${fs}" font-weight="600"`
    + ` letter-spacing="${Math.round(fs*0.16)}" text-anchor="middle" dominant-baseline="central">${label}</text>`
    + `</svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.replace(/\s+/g," "));
}

    : `Stilisierte Illustration in den Farben der Kategorie ${CATMAP[p.c]||"Ort"} – kein Foto des Ortes`;
  const src = ph ? imgSrc(ph.src) : plate(p.n, p.c, w, h);
  return `<img src="${src}" alt="${esc(alt)}" loading="lazy" decoding="async"
    data-n="${esc(p.n)}" data-c="${esc(p.c)}" data-w="${w}" data-h="${h}"
    onerror="imgFallback(this)"${cls?` class="${cls}"`:""}>`;
}
function badgeFor(p){
  const ph = photoFor(p.n, p.c);
  return ph ? (ph.exact ? "Foto" : "Symbolbild") : "Illustration";
}

/* ---------------- Speicher (§ 25 Abs. 2 Nr. 2 TDDDG) ---------------- */
const store = {
  ok:(()=>{ try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return true; }catch(e){ return false; } })(),
  P:"radiux.", OLD:"radius.",
  get(k,d){ if(!this.ok) return d; try{ const v=localStorage.getItem(this.P+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ if(!this.ok) return; try{ localStorage.setItem(this.P+k,JSON.stringify(v)); }catch(e){} },
  clear(){ if(!this.ok) return;
    Object.keys(localStorage).filter(k=>k.startsWith(this.P)||k.startsWith(this.OLD))
      .forEach(k=>localStorage.removeItem(k)); },
  /* Fruehere Fassungen hiessen noch "Radius". Wer damals etwas gemerkt hat,
     soll es nach der Umbenennung nicht verlieren - einmalig uebernehmen. */
  migrate(){ if(!this.ok) return;
    try{
      Object.keys(localStorage).filter(k=>k.startsWith(this.OLD)).forEach(k=>{
        const neu = this.P + k.slice(this.OLD.length);
        if(localStorage.getItem(neu)===null) localStorage.setItem(neu, localStorage.getItem(k));
        localStorage.removeItem(k);
      });
    }catch(e){}
  }
};

   Die Uebernahme muss laufen, bevor der Zustand unten zum ersten Mal liest. */

  view:"discover", vmode:store.get("vmode","karten"), detail:null, q:"", step:"welcome",
  thema:store.get("thema","auto"),
  radius:store.get("radius",3000), mode:null, origin:MD,

/* ---------------- Hilfsfunktionen ---------------- */
const $ = s => document.querySelector(s);
const main = () => $("#main");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = t => {
  const l=$("#live"); if(l){ l.textContent=""; setTimeout(()=>l.textContent=t,60); }
  const tt=document.getElementById("toast");
  if(tt){ tt.textContent=t; tt.classList.add("on");
    clearTimeout(tt._h); tt._h=setTimeout(()=>tt.classList.remove("on"),4500); }
};

function dist(a,b){
  const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const fmtDist = m => m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const fmtRad  = m => m<1000 ? m+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const walkMin = m => Math.max(1, Math.round(m/80));
const walkTxt = m => { const n=walkMin(m); return n===1 ? "1 Minute" : n+" Minuten"; };

function openState(oh){
  if(!oh) return {s:"unknown", t:"Zeiten unbekannt"};
  const v=oh.trim();
  if(/^24\/7$/.test(v)) return {s:"open", t:"Durchgehend offen"};
  const days=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const now=new Date(), today=days[now.getDay()], mins=now.getHours()*60+now.getMinutes();
  let known=false, open=false;
  for(const part of v.split(";")){
    const m=part.trim().match(/^([A-Za-z,\-]+)\s+(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if(!m) continue;
    const spec=m[1], from=+m[2]*60+ +m[3]; let to=+m[4]*60+ +m[5];
    if(to<=from) to+=1440;
    let hit=false;
    for(const tok of spec.split(",")){
      if(tok.includes("-")){
        const [a,b]=tok.split("-"), ia=days.indexOf(a), ib=days.indexOf(b), it=days.indexOf(today);
        if(ia<0||ib<0) continue;
        if(ia<=ib ? (it>=ia&&it<=ib) : (it>=ia||it<=ib)) hit=true;
      } else if(tok===today) hit=true;
    }
    if(hit){ known=true; if(mins>=from && mins<to) open=true; }
  }
  if(!known) return {s:"unknown", t:"Zeiten unbekannt"};
  return open ? {s:"open", t:"Jetzt geöffnet"} : {s:"closed", t:"Jetzt geschlossen"};
}


/* ---------------- Suche ----------------
   Sucht im geladenen Ortsbestand. Suchbegriffe werden nicht gespeichert
   und fließen nicht in das Interessenprofil ein.
   Begriffe mit Gesundheitsbezug werden abgewiesen – siehe Blueprint 9.4. */
const BLOCKED_TERMS = ["apothek","arzt","aerzt","ärzt","doktor","klinik","krankenhaus",
  "zahnarzt","hausarzt","facharzt","praxis","therap","psycho","physio","sanitaets",
  "sanitäts","pflegeheim","notaufnahme","rezept","medizin"];

function norm(x){
  return String(x||"").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
}
function queryBlocked(q){
  const n = norm(q);
  return n.length >= 3 && BLOCKED_TERMS.some(t => n.includes(norm(t)));
}
function matches(p, q){
  const n = norm(q);
  if(!n) return true;
  const hay = norm(`${p.n} ${p.t||""} ${p.adr||""} ${CATMAP[p.c]||""}`);
  return n.split(" ").every(w => hay.includes(w));
}

/* ---------------- Empfehlungslogik ---------------- */
const W = { dist:0.40, interest:0.30, open:0.20, info:0.10 };

function score(p){
  const sd = Math.max(0, 1 - p._d / Math.max(S.radius,1));
  if(p.start){
    const days = evDaysUntil(p.start);
    const st = Math.max(0, 1 - days/28);
    const prof0 = S.profile.event || 0;
    const maxP0 = Math.max(1, ...Object.values(S.profile).map(Math.abs));
    const si0 = Math.max(0, Math.min(1, (prof0/maxP0 + 1)/2));
    return 0.45*st + 0.30*sd + 0.15*si0 + 0.10*(p.t?1:0);
  }
  const prof = S.profile[p.c] || 0;
  const maxProf = Math.max(1, ...Object.values(S.profile).map(Math.abs));
  const si = Math.max(0, Math.min(1, (prof/maxProf + 1)/2));
  const os = p._o.s==="open" ? 1 : p._o.s==="unknown" ? 0.5 : 0.05;
  const inf = (p.oh?0.5:0) + (p.t?0.5:0);
  return W.dist*sd + W.interest*si + W.open*os + W.info*inf;
}

function reasons(p){
  if(p.start){
    const days = Math.round(evDaysUntil(p.start));
    const o = [evLabel(p.start)];
    o.push(days <= 0 ? "Findet heute statt" : days === 1 ? "Findet morgen statt" : `In ${days} Tagen`);
    o.push(p.approx
      ? `${p.t ? p.t + " · " : ""}Lage noch nicht bekannt – Entfernung fließt nicht in die Reihenfolge ein`
      : `${p.t ? p.t + " · " : ""}${fmtDist(p._d)} entfernt`);
    if(p.src) o.push(`Angabe laut ${p.src} – bitte beim Veranstalter prüfen`);
    return o;
  }
  const out=[`${fmtDist(p._d)} entfernt – etwa ${walkTxt(p._d)} zu Fuß`];
  if(p.i) out.push("Beschreibung vorhanden – tippen für Details");
  if(p._o.s==="open") out.push("Hat aktuell geöffnet");
  else if(p._o.s==="closed") out.push("Hat gerade geschlossen – deshalb weiter unten");
  else out.push("Öffnungszeiten liegen nicht vor – neutral bewertet");
  const prof=S.profile[p.c]||0;
  if(prof>0) out.push(`Passt zu „${CATMAP[p.c]}“ – ${prof===1?"einmal":prof+"-mal"} gemerkt`);
  else if(prof<0) out.push(`„${CATMAP[p.c]}“ hast du bisher eher ausgeblendet`);
  else out.push(`„${CATMAP[p.c]}“ – noch keine Vorlieben hinterlegt`);
  return out;
}


/* ---------------- Was für ein Ort ist das? ----------------

/* Reihenfolge: das Genaueste zuerst. */
function artOf(t){
  const kette = [t.artwork_type, t.historic, t.man_made, t.natural, t.sport,
                 t.tourism, t.amenity, t.leisure, t.shop];
  for(const k of kette){ if(k && ART[k]) return ART[k]; }
  for(const k of kette){ if(k) return String(k).replace(/_/g," "); }
  return "";
}

/* Kurzbeschreibung aus dem, was OpenStreetMap hergibt. */
function beschreibung(t){
  const art = artOf(t);
  const zus = [];
  if(t.artist_name) zus.push("von " + t.artist_name);
  if(t.start_date && /^\d{3,4}/.test(t.start_date)) zus.push("seit " + t.start_date.slice(0,4));
  if(t.material && !t.artwork_type) {} else if(t.material) zus.push("aus " + t.material.replace(/_/g," "));
  const kopf = [art, zus.join(", ")].filter(Boolean).join(" · ");
  const frei = t["description:de"] || t.description || t.inscription || "";
  if(frei && kopf) return kopf + " – " + frei;
  return frei || kopf;
}

/* ---------------- Datenaufbereitung ---------------- */
function catOf(tags){
  const vals=[tags.amenity,tags.tourism,tags.leisure,tags.shop,
              tags.historic,tags.man_made,tags.natural,tags.sport].filter(Boolean);
  for(const c of CATS) if(vals.some(v=>c.m.includes(v))) return c.k;
  return null;
}
function allowed(tags){
  if(tags.healthcare) return false;
  if(BLOCKED_SHOP.includes(tags.shop)) return false;
  if(tags.adult === "yes" || tags["min_age"]) return false;
  if(BLOCKED_AMENITY.includes(tags.amenity))
    return !!tags.tourism && tags.amenity!=="pharmacy" && tags.amenity!=="doctors";
  return true;
}
function prepare(){
  const raw=S.places.concat(eventsAsPlaces()).map(p=>({...p}));
  const ref = bezug();
  raw.forEach(p=>{ p._d=dist(ref,p);
    p._o = p.start ? { s:"soon", t:evLabel(p.start) } : openState(p.oh); });
  const cats = S.activeCats.length ? S.activeCats : CATS.map(c=>c.k);
  const q = S.q.trim();
  if(q && queryBlocked(q)) return [];
  /* Bei aktiver Suche gelten weder Umkreis noch Kategorie- oder Vorhaben-Filter –
     wer einen Namen eingibt, will diesen Ort finden, egal in welchem Vorhaben er steckt. */
  const fern = istFern();
  let list = raw.filter(p => (q || fern)
    ? ((q ? matches(p,q) : cats.includes(p.c)) && !S.hidden.includes(p.n))
    : (p._d<=S.radius && cats.includes(p.c) && !S.hidden.includes(p.n)));
  list.forEach(p=>{ p._s=score(p); });
  list.sort((a,b)=>b._s-a._s);
  if(S.mode==="ueberrasch"){
    const top=list.slice(0,Math.max(8,Math.ceil(list.length*0.4)));
    for(let i=top.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [top[i],top[j]]=[top[j],top[i]]; }
    list=top.concat(list.slice(top.length));
  }
  return list;
}

/* ---------------- OpenStreetMap ---------------- */
const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"
];

async function loadLive(){
  if(S.loading) return;
  S.loading=true; say("Orte werden geladen …"); render();
  /* Radiux kennt bisher nur Magdeburg. Wer von außerhalb lädt, bekäme sonst ein
     leeres Ergebnis – deshalb wird in dem Fall um die Stadtmitte herum geladen. */
  const far = istFern();
  const c = bezug();
  const r=Math.max(S.radius,4000)/111000;
  const bb=[c.lat-r, c.lon-r*1.6, c.lat+r, c.lon+r*1.6]
    .map(n=>n.toFixed(4)).join(",");
  if(far) say("Du bist weit von Magdeburg entfernt – Radiux lädt die Orte der Stadtmitte.");
  const q=`[out:json][timeout:90];(
    nwr(${bb})["amenity"~"^(restaurant|cafe|bar|pub|fast_food|ice_cream|biergarten|theatre|cinema|arts_centre|library|nightclub|fuel|events_venue|community_centre|music_venue|marketplace|food_court|university|college|public_bath)$"]["name"];
    nwr(${bb})["tourism"~"^(attraction|museum|artwork|viewpoint|gallery|zoo|theme_park|aquarium|picnic_site)$"]["name"];
    nwr(${bb})["leisure"~"^(park|fitness_centre|sports_centre|swimming_pool|garden|dance|escape_game|bowling_alley|water_park|beach_resort|marina|sauna|miniature_golf|horse_riding|sports_hall|nature_reserve)$"]["name"];
    nwr(${bb})["historic"~"^(monument|castle|city_gate|ruins|tower)$"]["name"];
    nwr(${bb})["man_made"~"^(tower|water_tower|lighthouse)$"]["name"];
    nwr(${bb})["natural"="beach"]["name"];
    nwr(${bb})["sport"~"^(climbing|skateboard)$"]["name"];
    nwr(${bb})["shop"~"^(supermarket|mall|bakery|books|clothes|greengrocer|music|second_hand|charity|video_games)$"]["name"];
  );out center 2000;`;

  let lastErr="unbekannter Fehler";
  for(const url of OVERPASS){
    try{
      const res=await fetch(url,{ method:"POST",
        body:"data="+encodeURIComponent(q),
        headers:{"Content-Type":"application/x-www-form-urlencoded"} });
      if(!res.ok){ lastErr="Server antwortete mit Code "+res.status; continue; }
      const j=await res.json();
      const seen=new Set(), out=[];
      for(const el of (j.elements||[])){
        const t=el.tags||{};
        const lat = el.lat!=null ? el.lat : (el.center ? el.center.lat : null);
        const lon = el.lon!=null ? el.lon : (el.center ? el.center.lon : null);
        if(!t.name || lat==null || lon==null || !allowed(t)) continue;
        const c=catOf(t); if(!c) continue;
        const key=t.name+"|"+c; if(seen.has(key)) continue; seen.add(key);
        const wp = t.wikipedia || t["wikipedia:de"] || "";
        out.push({ n:t.name, c, lat, lon, oh:t.opening_hours||"",
          t: beschreibung(t) || (t.cuisine ? t.cuisine.replace(/[_;]/g," ") : ""),
          art: artOf(t),
          osm: (el.type||"node") + "/" + el.id,
          wp: wp ? "https://de.wikipedia.org/wiki/" + encodeURIComponent(wp.replace(/^de:/,"")) : "",
          adr:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" "),
          web:t.website||t["contact:website"]||"",
          tel:t.phone||t["contact:phone"]||"",
          wc:t.wheelchair||"" });
      }
      if(out.length){
        S.places=out; S.loaded=true;
        S.dataSource="OpenStreetMap, "+out.length+" Orte";
        say(out.length+" Orte aus OpenStreetMap geladen.");
        S.loading=false; S.idx=0; render(); return;
      }
      lastErr="Antwort enthielt keine passenden Orte";
    }catch(e){ lastErr = e && e.message ? e.message : "Verbindung fehlgeschlagen"; }
  }
  S.dataSource="Startbestand – Abruf fehlgeschlagen";
  say("Abruf nicht möglich: "+lastErr);
  S.loading=false; render();
}

function useGeo(){
  if(!navigator.geolocation){ say("Standortbestimmung wird nicht unterstützt."); return; }
  say("Standort wird ermittelt …");
  navigator.geolocation.getCurrentPosition(
    pos=>{ S.origin={lat:pos.coords.latitude, lon:pos.coords.longitude, label:"Dein Standort"};
      S.idx=0;
      const w = dist(S.origin, MD);
      say(w > FERN
        ? `Standort übernommen – du bist ${fmtDist(w)} von Magdeburg entfernt. Radiux zeigt dir die Stadt im Überblick.`
        : "Standort übernommen.");
      render(); },
    ()=>say("Standort nicht verfügbar. Es bleibt bei Magdeburg, Stadtmitte."),
    {enableHighAccuracy:false, timeout:8000, maximumAge:300000});
}


/* Reduzierte Bewegung: Lichtlauf im Hintergrund anhalten */
try{
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
    document.querySelectorAll(".wmark animate, .wmark animateTransform").forEach(a=>a.remove());
}catch(e){}

/* ---------------- Rückgängig ---------------- */
const HIST = [];
function remember(entry){ HIST.push(entry); if(HIST.length > 40) HIST.shift(); }

function undo(){
  const h = HIST.pop();
  if(!h){ say("Nichts zum Zurücknehmen."); render(); return; }
  if(h.type === "hide"){
    S.hidden = S.hidden.filter(n => n !== h.name);
    store.set("hidden", S.hidden);
    S.profile[h.cat] = (S.profile[h.cat] || 0) + 0.5;
    store.set("profile", S.profile);
    say(`„${h.name}“ ist wieder da.`);
  } else if(h.type === "save"){
    S.saved = S.saved.filter(x => x.n !== h.name);
    store.set("saved", S.saved);
    S.profile[h.cat] = (S.profile[h.cat] || 0) - 1;
    store.set("profile", S.profile);
    say(`„${h.name}“ nicht mehr gemerkt.`);
  } else if(h.type === "unsave"){
    S.saved.push(h.item); store.set("saved", S.saved);
    say(`„${h.name}“ wieder gemerkt.`);
  } else if(h.type === "skip"){
    say("Einen Schritt zurück.");
  }
  S.idx = Math.max(0, h.idx);
  render();
}

/* ---------------- Aktionen ---------------- */
const isSaved = n => S.saved.some(x=>x.n===n);
function bump(p,v){ S.profile[p.c]=(S.profile[p.c]||0)+v; store.set("profile",S.profile); }
function save(p){
  if(!isSaved(p.n)){
    const item = {n:p.n,c:p.c,lat:p.lat,lon:p.lon,t:p.t||"",adr:p.adr||"",oh:p.oh||"",
                  start:p.start||"",url:p.url||"",src:p.src||""};
    S.saved.push(item); store.set("saved",S.saved); bump(p,1);
    remember({type:"save", name:p.n, cat:p.c, idx:S.idx});
    say(`„${p.n}“ gemerkt.`);
  } else {
    const item = S.saved.find(x=>x.n===p.n);
    S.saved=S.saved.filter(x=>x.n!==p.n); store.set("saved",S.saved);
    remember({type:"unsave", name:p.n, cat:p.c, item, idx:S.idx});
    say(`„${p.n}“ entfernt.`);
  }
}
function hide(p){
  if(!S.hidden.includes(p.n)){
    S.hidden.push(p.n); store.set("hidden",S.hidden); bump(p,-0.5);
    remember({type:"hide", name:p.n, cat:p.c, idx:S.idx});
    say(`„${p.n}“ ausgeblendet.`);
  }
}

/* ---------------- Bausteine ---------------- */
function altOf(p){
  return `Stilisierte Illustration in den Farben der Kategorie ${CATMAP[p.c]||"Ort"} – kein Foto des Ortes`;
}

function whyLine(p){
  const prof = S.profile[p.c] || 0;
  if(p.start){
    const d = Math.round(evDaysUntil(p.start));
    return d <= 0 ? "Findet heute statt, ganz in der Nähe"
         : d === 1 ? "Findet morgen statt"
         : `In ${d} Tagen · ${p.t || "in deinem Umkreis"}`;
  }
  if(prof > 0) return `Passt zu „${CATMAP[p.c]}“ – ${prof === 1 ? "einmal" : prof + "-mal"} gemerkt`;
  if(p._o.s === "open" && p._d < S.radius * 0.4) return "Ganz in der Nähe und jetzt geöffnet";
  if(p._o.s === "open") return "Hat jetzt geöffnet";
  if(p._o.s === "closed") return "Gerade geschlossen – deshalb weiter hinten";
  return "Sortiert nach Nähe – noch keine Vorlieben hinterlegt";
}
function whyShort(p){
  return `<p class="whyline"><span class="micro">Warum</span>${esc(whyLine(p))}</p>`;
}

function whyBlock(p){
  return `<div class="why"><h3>Warum dieser Vorschlag</h3><ul>${
    reasons(p).map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
}
function pills(p){
  const o=p._o;
  return `<div class="meta">
    <span class="pill dist">${p.approx ? "Ort im Stadtgebiet"
      : `${fmtDist(p._d)} · ${walkMin(p._d)} Min`}</span>
    <span class="pill ${o.s==="open"?"open":o.s==="closed"?"closed":o.s==="soon"?"soon":""}">${esc(o.t)}</span>
    ${p.adr?`<span class="pill">${esc(p.adr)}</span>`:""}
  </div>`;
}

function bindList(){
  main().querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.act==="detail"){ openDetail(b.dataset.n); return; }
    const list=prepare();
    const p=list.find(x=>x.n===b.dataset.n) || S.saved.find(x=>x.n===b.dataset.n);
    if(!p) return;
    if(b.dataset.act==="save") save(p); else hide(p);
    render();
  }));
}

/* ---------------- Rankingtransparenz (§ 5b Abs. 2 UWG) ---------------- */
function viewHow(){
  const rows=[
    ["Entfernung",40,"Je näher am Bezugspunkt, desto weiter vorne. Orte außerhalb des eingestellten Umkreises erscheinen gar nicht."],
    ["Deine bisherigen Entscheidungen",30,"Gemerkte Orte stärken ihre Kategorie, ausgeblendete schwächen sie. Ohne Interaktionen wirkt das Kriterium neutral."],
    ["Aktuell geöffnet",20,"Geöffnet wird bevorzugt, geschlossen deutlich abgewertet. Fehlen Öffnungszeiten, wird neutral bewertet statt geraten."],
    ["Vollständigkeit der Angaben",10,"Orte mit Beschreibung und Öffnungszeiten sind verlässlicher."]
  ];
  main().innerHTML=`<div aria-live="polite" class="sr" id="live"></div>
  <div class="legal">
  <h1>Wie Radiux empfiehlt</h1>
  <p>Die Reihenfolge der Vorschläge entsteht aus vier Kriterien. Sie werden hier vollständig
  und mit ihrer Gewichtung offengelegt.</p>
  <table>
    <colgroup><col style="width:38%"><col style="width:20%"><col style="width:42%"></colgroup>
    <thead><tr><th>Kriterium</th><th>Gewicht</th><th>Wirkung</th></tr></thead>
    <tbody>${rows.map(([k,w,d])=>`<tr>
      <td><strong>${esc(k)}</strong></td>
      <td><div style="font-weight:800;margin-bottom:5px">${w} %</div>
          <div class="wbar"><i style="width:${w}%"></i></div></td>
      <td>${esc(d)}</td></tr>`).join("")}</tbody>
  </table>
  <h2>Aussehen</h2>
  <p>Unter „Mehr → Aussehen“ lässt sich die Farbwelt wechseln: automatisch nach
  Geräteeinstellung, ruhig dunkel, hell oder Neon. Die Wahl bleibt in deinem Browser
  gespeichert und wird nicht übertragen. Sie ändert nur Farben – nicht, welche Orte
  du siehst und in welcher Reihenfolge.</p>

  <h2>Welche Orte Radiux lädt</h2>
  <p>Über „aktuelle Orte laden“ fragt Radiux OpenStreetMap nach allem ab, was im Umkreis
  liegt und einen Namen trägt: Gaststätten, Bars und Clubs, Bühnen und Kinos, Museen und
  Galerien, Denkmäler, Türme und Kunst im öffentlichen Raum, Parks, Naturschutzgebiete und
  Badestellen, Sport- und Kletterhallen, Schwimmbäder, Bowling und Escape-Räume,
  Hochschulen, Märkte, Läden.</p>
  <p>Nicht geladen werden Orte des Gesundheitswesens und altersbeschränkte Betriebe –
  siehe die beiden Abschnitte weiter unten. Wie viel dabei herauskommt, hängt davon ab,
  wie gut die Stadt in OpenStreetMap erfasst ist. Fehlt etwas, kann es jeder eintragen.</p>

  <h2>Beschreibungen</h2>
  <p>Zu einigen bekannten Orten steht in der Detailansicht ein längerer Text. Diese Texte
  sind von Hand geschrieben und anhand öffentlicher Quellen geprüft – Wikipedia, die Seiten
  der Landeshauptstadt Magdeburg und die Websites der Häuser selbst. Sie sind weder bezahlt
  noch von den Betrieben gestellt, und sie beeinflussen die Reihenfolge der Vorschläge nicht.</p>
  <p>Fällt dir ein Fehler auf, sag Bescheid – siehe „Mitmachen“ unter „Über Radiux“.</p>

  <h2>Jugendschutz</h2>
  <p>Radiux prüft kein Alter und zeigt deshalb keine Orte, deren Besuch an ein Mindestalter
  gebunden ist: Erotikbetriebe, Bordelle, Spielhallen, Spielbanken und Wettbüros werden
  beim Laden verworfen. Das gilt auch für die Suche. Bars, Kneipen und Clubs bleiben
  enthalten – der Ausschank an Jugendliche ist Sache des Betriebs, nicht der App.</p>

  <h2>Suche</h2>
  <p>Die Suche durchsucht Namen, Beschreibung, Adresse und Kategorie der geladenen Orte.
  Ist ein Suchbegriff eingegeben, gelten weder der eingestellte Umkreis noch der Kategorie-
  oder Vorhaben-Filter: Wer einen Namen eintippt, sucht diesen Ort und nicht eine Kategorie.
  Sortiert wird weiterhin nach Nähe.</p>
  <p>Suchbegriffe werden weder gespeichert noch übertragen und fließen nicht in dein
  Interessenprofil ein. Begriffe mit Gesundheitsbezug führen bewusst zu keinem Ergebnis –
  aus demselben Grund, aus dem Arztpraxen und Apotheken gar nicht erst geladen werden.</p>

  <h2>Veranstaltungen</h2>
  <p>Veranstaltungen werden nach einer eigenen Regel sortiert, weil bei ihnen die Zeit
  wichtiger ist als die Entfernung: Termin 45 %, Entfernung 30 %, deine bisherigen
  Entscheidungen 15 %, Vollständigkeit der Angaben 10 %. Vergangene Termine verschwinden
  automatisch drei Stunden nach Beginn.</p>
  <p>Bei jeder Veranstaltung steht, aus welcher Quelle die Angabe stammt. Termine ändern
  sich kurzfristig — verbindlich ist immer der Veranstalter, nicht diese Anwendung.</p>
  <p>Neben der Termindatei gibt es einen zweiten Knopf „Google Kalender“. Der öffnet
  lediglich das Eintragsformular von Google in einem neuen Tab, mit vorausgefülltem Titel und
  Termin. Radiux greift dabei nicht auf dein Konto zu und überträgt nichts im Hintergrund –
  der Aufruf findet nur statt, wenn du den Knopf antippst, und dann gelten die
  Datenschutzbestimmungen von Google.</p>
  <p>Über „In den Kalender“ erzeugt Radiux eine Termindatei im Gerät, die sich in der
  gewohnten Kalender-App öffnet. Dabei wird keine Verbindung zu einem Kalenderdienst
  hergestellt und kein Konto verknüpft.</p>

  <h2>Was das Ranking nicht beeinflusst</h2>
  <ul>
    <li><strong>Bezahlung.</strong> Dieser Prototyp enthält keine bezahlten Platzierungen, keine Werbung und keine Provisionen. Sollte sich das ändern, würde jede bezahlte Platzierung am einzelnen Ergebnis gekennzeichnet.</li>
    <li><strong>Religiöse, gesundheitsbezogene oder medizinische Merkmale.</strong> Solche Orte werden gar nicht erst geladen und fließen nie in dein Interessenprofil ein.</li>
    <li><strong>Künstliche Intelligenz.</strong> Die Empfehlungen entstehen aus der oben beschriebenen Rechenregel. Es ist kein KI-Modell beteiligt und es werden keine Texte generiert.</li>
  </ul>
  <h2>Bildmotive</h2>
  <p>Die Bilder stammen aus einer freien Bilddatenbank und stehen unter einer Lizenz,
  die die kostenlose kommerzielle Nutzung erlaubt. Sie zeigen <strong>nicht</strong> den
  jeweiligen Ort, sondern stehen stellvertretend für die Kategorie. Deshalb trägt jedes
  Bild die Kennzeichnung „Symbolbild“.</p>
  <p>Liegt für einen Ort ein Bild des Ortes selbst vor, steht dort „Foto“. Fehlt ein Bild,
  erscheint eine neutrale Fläche mit dem Kategorienamen — es wird nie ein Bild gezeigt,
  das einen falschen Eindruck vom Ort erwecken könnte.</p>
  <h2>Dein Profil</h2>
  <p>Aktuell gespeicherte Vorlieben: ${Object.keys(S.profile).length
    ? Object.entries(S.profile).map(([k,v])=>`${esc(CATMAP[k]||k)} (${v>0?"+":""}${v})`).join(", ")
    : "keine"}.</p>
  <button class="btn" id="wipe">Alle lokal gespeicherten Daten löschen</button>
  </div>`;
  $("#wipe").addEventListener("click",()=>{
    store.clear(); S.saved=[]; S.hidden=[]; S.profile={}; S.mode=null;
    say("Alle lokal gespeicherten Daten wurden gelöscht."); render();
  });
}

/* ---------------- Übersichtskarte in der Detailansicht ----------------
   Wird im Gerät gezeichnet: Bezugspunkt in der Mitte, der Ort an seiner
   tatsächlichen Himmelsrichtung und Entfernung. Kein Kartendienst, keine
   Kachel-Gebühren, keine Verbindung nach außen. */
const DIRS = ["Norden","Nordosten","Osten","Südosten","Süden","Südwesten","Westen","Nordwesten"];

function bearingTo(a,b){
  const r=Math.PI/180;
  const dLon=(b.lon-a.lon)*r, la1=a.lat*r, la2=b.lat*r;
  const y=Math.sin(dLon)*Math.cos(la2);
  const x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function dirName(deg){ return DIRS[Math.round(deg/45)%8]; }
function ringLabel(m){ return m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km"; }

function miniMap(p){
  const W=320, H=320, cx=W/2, cy=H/2, pad=30;
  const maxD = Math.max(p._d*1.28, 250);
  const sc = (cy-pad)/maxD;
  const deg = bearingTo(bezug(),p), rad = deg*Math.PI/180;
  const tx = cx + Math.sin(rad)*p._d*sc, ty = cy - Math.cos(rad)*p._d*sc;
  const rings = [maxD/3, maxD*2/3, maxD];
  let g = "";
  rings.forEach((r,i)=>{
    g += `<circle cx="${cx}" cy="${cy}" r="${(r*sc).toFixed(1)}" fill="none"
            stroke="currentColor" stroke-opacity="${i===2?.26:.14}" stroke-width="1"
            ${i<2?'stroke-dasharray="3 5"':''}/>`;
    g += `<text x="${cx+4}" y="${(cy-r*sc+11).toFixed(1)}" fill="currentColor" fill-opacity=".38"
            font-size="9.5" font-family="system-ui,sans-serif" letter-spacing="1">${ringLabel(r)}</text>`;
  });
  g += `<line x1="${cx}" y1="${pad-14}" x2="${cx}" y2="${H-pad+14}" stroke="currentColor" stroke-opacity=".10"/>`;
  g += `<line x1="${pad-14}" y1="${cy}" x2="${W-pad+14}" y2="${cy}" stroke="currentColor" stroke-opacity=".10"/>`;
  g += `<text x="${cx}" y="13" text-anchor="middle" fill="currentColor" fill-opacity=".45"
          font-size="10" font-weight="600" font-family="system-ui,sans-serif" letter-spacing="2">N</text>`;
  g += `<line x1="${cx}" y1="${cy}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}"
          stroke="#5aa8ff" stroke-opacity=".75" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="12" fill="#5aa8ff" fill-opacity=".16"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="#5aa8ff"/>`;
  g += `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="13" fill="currentColor" fill-opacity=".12"/>`;
  g += `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="5.5" fill="currentColor"/>`;
  return `<div class="mmap">
    <svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Übersicht: ${esc(p.n)} liegt ${fmtDist(p._d)} in Richtung ${dirName(deg)}, ausgehend von ${esc(bezug().label)}">${g}</svg>
    <div class="mlegend">
      <span><i class="d you"></i>${esc(bezug().label)}</span>
      <span><i class="d there"></i>${esc(p.n)}</span>
      <span class="mdir">${fmtDist(p._d)} Richtung ${dirName(deg)}</span>
    </div>
  </div>`;
}



/* ---------------- Kalendereintrag ----------------
   Erzeugt eine ICS-Datei im Gerät. Öffnet sich in der Kalender-App,
   die der Nutzer ohnehin verwendet – Google, Apple, Outlook.
   Keine Anmeldung, keine Schnittstelle, keine Datenübertragung. */
function icsEsc(x){
  return String(x||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;")
    .replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
}
function icsFor(p){
  const pad = n => String(n).padStart(2,"0");
  const stamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const start = new Date(p.start);
  const end = new Date(start.getTime() + 3*3600*1000);
  const body = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Radiux//Prototyp//DE","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + hashOf(p.n + p.start) + "@radiux",
    "DTSTAMP:" + stamp(new Date()),
    "DTSTART:" + stamp(start),
    "DTEND:" + stamp(end),
    "SUMMARY:" + icsEsc(p.n),
    "LOCATION:" + icsEsc(p.t || ""),
    "DESCRIPTION:" + icsEsc((p.src ? "Angabe laut " + p.src + ". " : "") +
      "Termin und Ort beim Veranstalter prüfen." + (p.url ? " " + p.url : "")),
    "GEO:" + p.lat + ";" + p.lon,
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  return body;
}
/* iOS/Safari blockiert das direkte Öffnen von data:-Adressen. Deshalb wird die
   Termindatei als Blob im Gerät erzeugt und darüber ausgeliefert; die Datei
   verlässt das Gerät nicht. */
function icsDownload(p){
  try{
    const blob = new Blob([icsFor(p)], {type:"text/calendar;charset=utf-8"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = icsName(p); a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    say("Termindatei erstellt. Öffne sie, um sie in deinen Kalender zu übernehmen.");
  }catch(e){
    say("Termindatei konnte nicht erzeugt werden. Nutze den Kalender-Link.");
  }
}
/* Zweiter Weg, falls die Datei auf dem Gerät nicht geöffnet werden kann:
   ein gewöhnlicher Link auf das Eintragsformular von Google Kalender.
   Kein Konto-Zugriff, keine Schnittstelle, keine Übertragung im Hintergrund –
   der Link öffnet sich nur, wenn du ihn antippst. */
function gcalLink(p){
  const pad = n => String(n).padStart(2,"0");
  const z = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  const st = new Date(p.start), en = new Date(st.getTime()+3*3600*1000);
  const par = new URLSearchParams({
    action:"TEMPLATE", text:p.n, dates:`${z(st)}/${z(en)}`,
    location:p.t||"", details:"Termin und Ort beim Veranstalter prüfen."
  });
  return "https://calendar.google.com/calendar/render?" + par.toString();
}
function icsName(p){
  return (String(p.n).replace(/[^\wäöüÄÖÜß -]+/g,"").trim() || "Termin") + ".ics";
}
/* Dateiname der mitgelieferten Termindatei im Ordner „kalender“ */
function icsSlug(p){
  return norm(p.n).replace(/ /g,"-").slice(0,60) + "-" +
         String(p.start).slice(0,10).replace(/-/g,"");
}
/* iOS öffnet nur Termindateien, die über eine Adresse ausgeliefert werden.
   Deshalb liegt zu jeder Veranstaltung eine fertige .ics-Datei im Ordner „kalender“.
   Gibt es sie nicht (etwa beim Testen von der Festplatte), wird die Datei
   ersatzweise im Gerät erzeugt. */
async function openCalendar(p){
  const url = "kalender/" + icsSlug(p) + ".ics";
  if(location.protocol === "http:" || location.protocol === "https:"){
    try{
      const r = await fetch(url, {cache:"no-store"});
      if(r.ok){ location.href = url; return; }
    }catch(e){}
  }
  icsDownload(p);
}

   um eine ausdrücklich gewünschte Einstellung beizubehalten). Nichts davon

const THEMEN = [

  ["dunkel","Ruhig dunkel","Zurückhaltend, kontrastreich",        "#131315"],

];
function setThema(k){
  S.thema = k;
  store.set("thema", k);
  if(k === "auto") document.documentElement.removeAttribute("data-thema");
  else document.documentElement.setAttribute("data-thema", k);

    : k==="dunkel" ? "#09090a" : null;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta && dunkel) meta.setAttribute("content", dunkel);
}
function openThema(){
  document.querySelectorAll(".sheet").forEach(n=>n.remove());
  const el = document.createElement("div");
  el.className = "sheet";
  el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  el.setAttribute("aria-label","Aussehen");
  el.innerHTML = `<div class="veil" data-close></div>
    <div class="panel" tabindex="-1">
      <div class="grab"></div>
      <div class="sbody" style="padding-top:22px">
        <div class="micro" style="margin-bottom:14px">Aussehen</div>
        <div class="themen" role="group" aria-label="Farbwelt wählen">${THEMEN.map(([k,n,d,sw])=>
          `<button type="button" data-t="${k}" aria-pressed="${S.thema===k}">
            <span class="sw" style="background:${sw}"></span>
            <span><span class="tn">${esc(n)}</span><span class="td">${esc(d)}</span></span>
          </button>`).join("")}</div>
        <p class="note" style="margin-top:20px">Die Auswahl bleibt in diesem Browser
        gespeichert und wird nicht übertragen. Inhalte und Reihenfolge der Vorschläge
        ändern sich dadurch nicht.</p>
        <div class="lact" style="margin-top:18px">
          <button class="btn sm ghost" data-close>Schließen</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add("locked");
  const shut = ()=>{ el.remove(); document.body.classList.remove("locked"); };
  el.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",shut));
  el.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{
    setThema(b.dataset.t);

    say("Aussehen geändert.");
  }));
  dragClose(el, shut);
  el.querySelector(".panel").focus();
  el.addEventListener("keydown",e=>{ if(e.key==="Escape"){ shut(); } });
}

/* ---------------- Blatt nach unten wegziehen ----------------
   Wird von jedem Blatt genutzt (Detailansicht wie auch „Mehr“).
   Greift nur, wenn das Blatt oben steht – sonst würde normales
   Scrollen versehentlich schließen. Es gibt stets auch einen
   Schließen-Knopf und die Esc-Taste (Barrierefreiheit). */
function dragClose(el, close){
  const panel = el.querySelector(".panel");
  if(!panel) return;
  let y0=null, dy=0, active=false;

  const begin = (y, target)=>{
    if(panel.scrollTop > 2) return false;
    if(target && target.closest && target.closest("a,button,input,select,textarea")) return false;
    y0=y; dy=0; active=false;
    panel.style.transition="none";
    return true;
  };
  const move = (y)=>{
    if(y0===null) return false;
    dy = y - y0;
    if(dy<=0){ panel.style.transform=""; return false; }
    if(!active && dy>6) active=true;
    if(!active) return false;
    panel.style.transform="translateY("+dy+"px)";
    panel.style.opacity=String(Math.max(.35, 1 - dy/620));
    return true;
  };
  const stop = ()=>{
    if(y0===null) return;
    const d=dy; y0=null;
    panel.style.transition="transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s";
    if(active && d>110){
      panel.style.transform="translateY(110%)"; panel.style.opacity="0";
      setTimeout(close,190);
    } else { panel.style.transform=""; panel.style.opacity=""; }
    active=false;
  };

  /* Finger. Nur so erreicht uns die Bewegung auf Handy und Tablet:
     Solange das Blatt oben steht und nach unten gezogen wird, uebernehmen wir
     die Geste, sonst bleibt das gewohnte Scrollen erhalten. */
  panel.addEventListener("touchstart", e=>{
    if(e.touches.length!==1){ y0=null; return; }
    begin(e.touches[0].clientY, e.target);
  }, {passive:true});
  panel.addEventListener("touchmove", e=>{
    if(y0===null || e.touches.length!==1) return;
    if(move(e.touches[0].clientY) && e.cancelable) e.preventDefault();
  }, {passive:false});
  panel.addEventListener("touchend", stop, {passive:true});
  panel.addEventListener("touchcancel", stop, {passive:true});

  /* Maus */
  panel.addEventListener("pointerdown", e=>{
    if(e.pointerType && e.pointerType!=="mouse") return;
    if(begin(e.clientY, e.target)) panel.setPointerCapture?.(e.pointerId);
  });
  panel.addEventListener("pointermove", e=>{
    if(e.pointerType && e.pointerType!=="mouse") return;
    move(e.clientY);
  });
  panel.addEventListener("pointerup", e=>{
    if(e.pointerType && e.pointerType!=="mouse") return; stop();
  });
  panel.addEventListener("pointercancel", e=>{
    if(e.pointerType && e.pointerType!=="mouse") return; stop();
  });
}
